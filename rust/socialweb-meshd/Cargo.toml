[package]
name = "socialweb-meshd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Per-node pod network over iroh QUIC datagrams for socialweb.computer market nodes"

[dependencies]
iroh = "1.3.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rtnetlink = "0.23"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
bs58 = "0.5"
hex = "0.4"
getrandom = "0.3"
libc = "0.2"
bytes = "1"
ipnet = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
base64 = "0.22"
blake3 = { version = "1.8", features = ["pure"] }
hickory-server = { version = "0.26", default-features = false, features = ["resolver"] }
webpki-roots = "1"
