      - "requester-mutuals (requester)"
      - "requester-only-me (requester)"
      - "requester-tangled-vouch (requester)"
      - "under-4-cpus (bidder)"

  - id: TestPolicyWorkflowRunCacheRoundTrip
    kind: integration
