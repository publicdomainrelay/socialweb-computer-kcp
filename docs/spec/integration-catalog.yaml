  - id: TestRequestSecretsReachTheGuestThroughTheRFPFlow
    kind: integration
    source: test/integration/request_secrets_test.go
    actors: [requester, bidder, pds, kcp, guest VM]
    setup: >
      Own network: --bidders 1, no gateway, parallel. A secrets bundle [{path:
      /root/secrets/it/value, value: it-secret-<32 hex>}] (mode 0600). `run request --network <inst>
      --name rq<6 hex> --secrets <file> --hold --contract-timeout 2m --network-timeout 2m --exec
      "systemctl start setup-secrets.service; cat /root/secrets/it/value; echo; echo IT-SECRET-READ;
      read -r _"` (5m). Then "done" and `run request release <name>` (3m).
    asserts: >
      The guest prints the exact secret before IT-SECRET-READ. While held the secret (plain, and std
      and raw-url base64 at 3 byte offsets) appears nowhere outside the guest: files under the state
      dir and requests/<name> (vms excluded), process cmdlines and environments, the VM account's
      user journal since the start, test logs other than run request stdout; the scan covered at
      least 1 kine.db and at least 2 repos.db. The summary has phase Held, contract.receiptUri,
      winnerDid, secretsFetchedAt and at least one contract.hostKeys entry; stderr has
      StrictHostKeyChecking=yes. The release is Released with releaseStatus 200. Within 1m no
      ComputeVM, VM work dir or VM unit is left. The scans are clean again after the release.
    cleanup: Standard teardown.

  - id: TestTenantClusterScalesFromZeroOnMarketVMsAndBack
    kind: integration
    source: test/integration/scale_to_zero_test.go
    actors: [tenant owner, gateway, bidder, kcp, tenant cluster, guest VM]
    setup: >
      Shared 2-bidder network with gateway, parallel with TestClusterEventsStreamFromSubscribeClusters.
      Tenant "tenant" /readyz within 3m. Namespaces it-srv, it-cli-allowed (label it-allow=yes),
      it-cli-other. busybox httpd pods it-a and it-b in it-srv with required hostname anti-affinity,
      Service it-b:8080; later pod it-c pinned to B's node. The k8s_xrpc_test.go check on node A.
      NetworkPolicies applied and removed one at a time: deny-ingress, deny-egress,
      egress-one-ipblock (B /32), allow-labelled-namespaces, default-deny-dns-allow (UDP and TCP 53).
      Then delete it-b and it-c, then the three namespaces.
    asserts: >
      Idle 0 Nodes and 0 NodeClaims. Within 4m two nodes join from market RFP VMs and it-a and it-b
      are Ready on different nodes; exactly 2 NodeClaims Running with status.contract.receiptUri
      (within 2m); the bidders run one ComputeVM per receipt. The XRPC fixture passes. Network
      probes from node A (30s settle each): without policy B by IP, the CoreDNS name
      it-b.it-srv.svc.cluster.local and the service name all reach; deny ingress and deny egress
      block and removal restores; ipBlock allows B and blocks C; namespaceSelector allows only the
      labelled namespace; default deny with DNS allowed resolves but blocks B. Scale in: 1 Node and 1
      NodeClaim within 100s, never more than one node released at once, node A kept; then 0 and 0.
      Within 1m no ComputeVM carries this test's receipts. The gateway core log has 2+
      node_claim_released lines, all confirmed=true. /readyz answers at 0 nodes.
    cleanup: The test scales to zero itself; shared network standard teardown at package end.

  - id: TestSshGatewayExposesItsServerAndReusesTheGuestAcrossRestart
    kind: integration
    source: test/integration/sshgateway_test.go
    actors: [owner, ssh gateway, ssh server, pds, bidder, kcp, guest VM]
    setup: >
      Needs a dumbpipe executable (SOCIALWEB_IT_DUMBPIPE, /usr/local/bin/dumbpipe or PATH). Own
      network: --bidders 1, network timeout 10m. An owner ssh-<8 hex>.alice.test on the alice PDS via
      com.atproto.server.createAccount, written to owner-sessions.json (0600). `socialweb-computer run
      gateway ssh --network <inst> --host-backend proc --name sshgw --network-timeout 5m --
      --test-owner-sessions-file <file>`; its report names a local ssh exposure and the local
      svc-sshserver HTTP exposure. POST /keys with HTTP basic auth registers one ed25519 key. ssh as
      user <owner DID> with LC_SESSION=it-<8 hex> runs hostname. Then `socialweb-computer dev restart
      sshgw/ssh-server --instance <inst>` and the same session again.
    asserts: >
      Key registration is 200 with an rkey. An unregistered key is refused. The first hostname is
      non-empty and the bidders hold exactly 1 ComputeVM. dev restart succeeds within 4m. The second
      session returns the same hostname and still exactly 1 ComputeVM (the guest is reused).
    cleanup: Standard teardown.

  - id: TestClusterEventsStreamFromSubscribeClusters
    kind: integration
    source: test/integration/subscribe_clusters_test.go
    actors: [tenant owner, fresh account, gateway, pds, bidder, kcp, tenant cluster]
    setup: >
      Shared 2-bidder network with gateway. Gateway endpoint from Exposure
      svc-gatewayapi-gateway-api-local, audience from GatewayAPI gateway-api; owner from
      owner-sessions.json; tokens with lxm com.publicdomainrelay.temp.cluster.<method>. Websocket
      /xrpc/com.publicdomainrelay.temp.cluster.subscribeClusters (binary CBOR frames) for the owner
      and for a fresh createAccount account. POST com.publicdomainrelay.temp.cluster.createCluster
      {name: demo}; a subscription with ?name=nope. Then namespace it-srv and pod it-stream in demo,
      later deleted.
    asserts: >
      Within 30s the owner snapshot ends with #info SnapshotComplete, has 2+ events and starts with
      #cluster tenant snapshot=true. The fresh account's snapshot has no #cluster and no error
      frames. createCluster is 200. ?name=nope yields an error frame ClusterNotFound within 15s.
      #cluster demo reaches Ready within 3m with Initializing before Ready and at least one #member
      event; if tenant was not Ready at snapshot time, demo's first #member precedes tenant Ready.
      After the pod is created a #nodeClaim reaches Running within 4m after Bidding and Provisioning,
      never Failed or Lost; the pod is Ready within 90s. After the pod delete a #nodeClaim
      deleted=true frame arrives within 100s.
    cleanup: Websockets closed; demo goes with the shared network teardown.

  - id: TestOutOfBandComputeVMDeletionPublishesTermination
    kind: integration
    source: test/integration/termination_test.go
    actors: [requester, bidder, kcp, pds, guest VM]
    setup: >
      Own network: --bidders 1, parallel. `run request --network <inst> --name term<6 hex> --hold
      --exec "echo <marker>; read -r _" --contract-timeout 4m --network-timeout 2m` (6m). After the
      marker the single ComputeVM in root:bidder-1 is deleted directly in kcp.
    asserts: >
      Exactly 1 ComputeVM with a UID while held. It is gone within 3m. Within 2m StateSync
      termination-<hex of the first 8 bytes of sha256(UID)> in root:bidder-1 has status.phase Acked
      and status.acked.ref (one termination published). The held run request exits within 90s. The
      network stays healthy.
    cleanup: Standard teardown.

  - id: TestWebAppSignInOverLoopbackOriginIssuesAClientCertificate
    kind: integration
    source: test/integration/web_app_signin_test.go
    actors: [browser user, web app, gateway, pds, kcp, tenant cluster]
    setup: >
      A loopback origin http://127.0.0.1:<port>. Own network: --bidders 1 --with-gateway, 5m,
      gateway option public-origin=<origin>; a TCP proxy from the origin to the gateway API Exposure
      endpoint. Tenant "tenant" /readyz and ClusterRoleBinding socialweb-owner within 3m. A cookie-jar
      client that does not follow redirects, with Origin=<origin>: GET /oauth-client-metadata.json;
      POST /oauth/start {handle: owner DID}; POST /oauth/authorize on the PDS (identifier, password,
      request_uri, client_id); GET the /oauth/callback it returns; GET /session twice; POST
      /api/clusters/list; POST /api/clusters/kubeconfig {name: tenant}.
    asserts: >
      Metadata (retried up to 2m) is 200 with client_id <origin>/oauth-client-metadata.json and
      redirect_uris containing <origin>/oauth/callback. /oauth/start is 200 with an authorizationUrl
      at /oauth/authorize on the PDS carrying request_uri and that client_id (a PAR was pushed). The
      PDS authorize is 200 with a code and a redirect_uri at /oauth/callback with state and iss. The
      callback is 302 to <origin>/ and sets swc_session HttpOnly, SameSite=Strict, Path=/, not
      Secure. /session is 200 with did = owner DID on both calls. clusters/list is 200 naming tenant,
      which is Ready within 5m. kubeconfig is 200 (429 retried) with Cache-Control no-store, exactly
      1 user with a plain client cert and key, CN = owner DID, O [socialweb.computer:cluster-owners];
      a client-go node list on the tenant works with it.
    cleanup: Listener and proxy closed; standard teardown.

  - id: soak
    kind: soak
    source: test/soak/main.go
    actors: [market network, requester soakreq, bidder, gateway, tenant cluster, pds, openbao, kcp front, operator host]
    setup: >
      A Linux-only program `soak <verb> [flags]` with verbs load, sample, hammer, tidy, inspect,
      orphans and release (anything else: usage, exit 2). No script or CI invoked it; it was run by
      hand as systemd user units on a DigitalOcean droplet. Target: an existing `socialweb-computer
      dev up --profile market-network --bidders 1 --with-gateway` instance (optionally
      --vm-host-backend systemd-user), read from --instance (default soak) and --state-dir (default
      /var/tmp/swcit/soak); children under <state-dir>/apps/dev/<instance>-<app>. --binary (default
      /var/tmp/soak/bin/socialweb-computer) runs `dev status` and `status`. A typical run: a long
      load (RFP, VM and tenant lanes), a sample process, tidy every 10 minutes, and chaos run apart
      (dev restart of DenoPods, kill -9 of cores and bidder pods); recorded rates 1.1 RFP/s, a VM
      contract every 40s on 3 lanes held 20s, 2 to 6 tenant lanes, contract TTL 40m, requester
      retention 900s, 3h or more.
    asserts: >
      No threshold in the program; verbs exit 1 only on setup errors. load prints a JSON counter
      line every minute (ts, elapsedSec, rfpCreated, rfpFailed, vmStarted, vmHeld, vmReleased,
      vmFailed, refused, tenantCycles, tenantOut, tenantIn, tenantFailed, clustersCreated,
      clustersDeleted), one at stop and one after in-flight lanes drain (up to 15m). Pass, judged
      outside: failed counters 0 or explained by chaos; each application reports 0 orphans and 0
      stuck terminations; `soak orphans` reports unclaimed 0; every series in samples.jsonl
      plateaus: after warm-up a least-squares fit is flat when |slope x window| <= max(2 x residual
      sd, 5% of the mean).
    cleanup: >
      Contracts expire by their socialweb.computer/ttl-after-finished annotation; open VM contracts
      are closed by soak release; tenant lanes delete their Cluster and Workspace. The soakreq child
      stays until dev down. Afterwards only live and retained objects and records: no orphan
      compute.vm records, no unowned objects, no stuck finalizers.

  - id: soak/load-requester-bootstrap
    kind: soak
    source: test/soak/main.go
    actors: [market network, requester soakreq]
    setup: >
      First phase of soak load. --requester (default soakreq), --contract-quota 20000,
      --record-retention-sec 1800, --record-retention-scan-ms 60000, --max-concurrent 64. Without a
      NetworkApp of that name it adds a MarketRequester application with the network requester
      profile, a ComputeContracts quota and options record-retention-sec, record-retention-scan-ms,
      max-concurrent and per-account-max; an existing one is reused.
    asserts: >
      The NetworkApp reaches phase Ready with an instance name and kcp URL, without the stopped
      message, within 10m; listing ComputeContract in the child workspace works within 3m; prints
      {"event":"requester ready","instance":"<child>"}. Failure exits 1.
    cleanup: None; the requester child stays.

  - id: soak/load-rfp
    kind: soak
    source: test/soak/main.go
    actors: [requester soakreq, bidder, pds]
    setup: >
      On when --rfp-rate > 0 (default 0.5/s). RFP-only ComputeContracts rfp-<epoch>-<seq> (spec.vmName
      soak-rfp, annotation socialweb.computer/rfp-only=true, ttl-after-finished --contract-ttl default
      50m) at a fixed pace, at most --rfp-inflight (48) in flight, for --duration or until a signal.
    asserts: >
      rfpCreated per accepted create; Forbidden or Invalid with "quota" counts refused
      (back-pressure); other errors rfpFailed. Healthy: rfpFailed 0; object counts, market.rfp repo
      records and process memory plateau.
    cleanup: Contracts expire by TTL, market.rfp records by requester retention.

  - id: soak/load-vm
    kind: soak
    source: test/soak/main.go
    actors: [requester soakreq, bidder, vm host, pds]
    setup: >
      On when --vm-every > 0 (default 45s). A full ComputeContract vm-<epoch>-<seq> every
      --vm-every, at most --vm-lanes (3) open, through RFP, Bids, accept and VM boot.
    asserts: >
      vmStarted per create; Held within 10m counts vmHeld, else (Failed, Released, timeout)
      vmFailed. After --vm-hold (20s) spec.release=true and Released within 5m counts vmReleased,
      else vmFailed. Pass: vmFailed 0 or only chaos-explained (no_bids around a bidder kill).
    cleanup: Every opened contract gets spec.release=true; nothing left behind.

  - id: soak/load-tenant-cycle
    kind: soak
    source: test/soak/tenant.go
    actors: [gateway, tenant cluster, bidder, vm host]
    setup: >
      On when --tenant-every > 0 (default off). An existing tenant cluster --tenant-name (default
      tenant) on the <instance>-gateway child, opened through the gateway state dir
      (clusterprovider/pdr-*-<name>: front.json, server CA, admin client cert). One cycle per
      --tenant-every, pod hold --tenant-hold (20s).
    asserts: >
      default ServiceAccount within 1m; pod soak-<unix>-<seq> (pinned busybox, 10m CPU, 16Mi, grace
      0) Running within 6m (tenantOut); after the hold and delete, 0 nodes within 5m (tenantIn);
      any failure counts tenantFailed with a JSON event.
    cleanup: The probe pod is always deleted; the cluster stays; no nodes, VMs or contracts remain.

  - id: soak/load-tenant-lanes
    kind: soak
    source: test/soak/lanes.go
    actors: [gateway, tenant cluster, bidder, vm host, kcp workspace]
    setup: >
      On when --tenant-lanes N > 0 (recorded 2, 4, 6). Needs <instance>-gateway with a bootstrap
      account DID. Lanes --lane-base+1 .. --lane-base+N, lane i starts after i x 20s. Each lane
      loops: create Cluster l<lane>c<seq> in the bootstrap account home workspace
      (root:<account hash>:<name>) through the gateway members.kubeconfig, run the scale cycle,
      delete the cluster.
    asserts: >
      clustersCreated; tenant /readyz within 5m; pod Running within 8m (tenantOut); nodes 0 within
      6m after delete (tenantIn); errors count tenantFailed with backoff 1m per failure up to 5m;
      Cluster NotFound within 10m after delete. Pass: tenantFailed 0 apart from stop-cut cycles,
      clustersDeleted == clustersCreated, gateway kcp memory and OpenBao storage per cycle plateau.
    cleanup: >
      After every round the Cluster is deleted and awaited, then the tenancy.kcp.io Workspace of the
      same name; no cluster, workspace, node or VM left.

  - id: soak/sample
    kind: soak
    source: test/soak/sample.go
    actors: [operator host, market network, requester, bidder, gateway, pds, kcp, kine, openbao]
    setup: >
      `soak sample` --every (default 5m; 1m used), --out (default /var/tmp/soak/samples.jsonl), --once.
      One JSON line per tick: host memory, swap, oom_kill count, load, /var/tmp use, journal bytes;
      per app and role process count, RSS and sockets (kcp, kine, bao, firecracker, dumbpipe, caddy,
      postgres, deno:<pod>, core:<subcommand>); bytes per state subdir and sqlite file; `status`
      contracts per phase; kv.sqlite3 and pds repo.sqlite3 bytes, wal and rows; per PDS listener
      com.atproto.repo.describeRepo and paged com.atproto.repo.listRecords counts per DID and
      collection; kine live keys per resource and logical clusters; sampleSec.
    asserts: >
      Collection only; the evidence for the soak verdict (plateau rule; OOM kills flat; record counts
      follow retention). It closes idle connections after each sample so it does not leak itself.
    cleanup: Writes only the samples file.

  - id: soak/hammer
    kind: soak
    source: test/soak/hammer.go
    actors: [kcp front, gateway, tenant cluster mount]
    setup: >
      `soak hammer` --workers (64), --duration (5m), --every (0). Targets the network kcp default
      workspace, a child kcp (--app), or a tenant cluster's mounted workspace under the gateway
      account (--mount, root:<account hash>:<cluster>:<child label>). Each worker lists core v1
      namespaces (limit 1) through the kcp front, no client rate limit, 10s timeout.
    asserts: >
      Prints "requests <n> failed <m>". Pass: failed 0 and kcp RSS flat (reproduces mount proxy
      transport growth and audit-log growth).
    cleanup: None; read-only.

  - id: soak/tidy
    kind: soak
    source: test/soak/tidy.go
    actors: [market network, requester, bidder, gateway, openbao, tenant vault]
    setup: >
      `soak tidy` --interval (15m), once or every 10 minutes. For the network kcp and every child,
      every OpenBaoServer gets a merge patch (field manager soak-tidy) setting spec.tidy.interval and,
      when present, each spec.declared.pkiTidy interval.
    asserts: >
      Prints one line per server; OpenBaoServer status lastRunAt advances every interval and OpenBao
      storage stays flat in the samples.
    cleanup: The shortened intervals stay until teardown.

  - id: soak/inspect
    kind: soak
    source: test/soak/inspect.go
    actors: [bidder, requester, gateway]
    setup: >
      `soak inspect` --app (soak-bidder-1), --group (socialweb.computer), --resource (computevms,
      v1alpha1), --path (root), --unowned (true), --name. Lists the resource in that child's kcp.
    asserts: >
      One JSON line per object (name, phase, ageSec, owners, finalizers, deleting, annotations);
      unowned only by default. Pass: no unowned object older than its TTL, none stuck deleting with
      finalizers.
    cleanup: None; read-only.

  - id: soak/orphans
    kind: soak
    source: test/soak/orphans.go
    actors: [requester soakreq, pds]
    setup: >
      `soak orphans` --app (soakreq), --older-than (1h). Finds the app DID and repo listener from
      `dev status`, lists every ComputeContract (status.contract.payload.uri, status.contract.rfp.uri),
      pages com.atproto.repo.listRecords for com.publicdomainrelay.temp.compute.vm and
      com.publicdomainrelay.temp.market.rfp.
    asserts: >
      A compute.vm record older than --older-than whose URI and rfp URI no live ComputeContract
      claims is an orphan; one JSON line each, then a summary {contracts, vms, rfps, older,
      unclaimed, olderThan, repo}. Pass: unclaimed 0 (ACC13-NO-ORPHANS).
    cleanup: None; reports only.

  - id: soak/release
    kind: soak
    source: test/soak/release.go
    actors: [requester soakreq, bidder, vm host]
    setup: >
      `soak release` --app (soakreq), after load stops or crashes. Lists the ComputeContracts of the
      requester child.
