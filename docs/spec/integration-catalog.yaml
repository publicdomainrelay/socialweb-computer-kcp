catalog: integration-catalog
plan: 0026-abc-control-plane W0-TESTS
purpose: >
  The behavior that the Go integration suite (test/integration, build tag integration), the soak
  program (test/soak) and the wire-level unit tests asserted before plan 0026 W0-TESTS deleted every
  Go test. Plan 0027 writes specification tests from this file. Each entry names actors, inputs,
  the observable outcome and the cleanup expectation, not how the code did it. The deleted sources
  are in git history at the parent of the W0-TESTS deletion commit.
kinds:
  integration: a Go test function in test/integration (its own or a shared market network, or in-process fakes)
  fixture: a shared fake or check in test/integration with no Test function of its own
  soak: a verb or lane of the soak program in test/soak
  wire: a deleted unit test that asserted an externally observable wire rule; terse
  acceptance: a row of the plan 0026 acceptance matrix, proven live on the named hosts

harness:
  network: >
    A market network is brought up with `socialweb-computer dev up --instance i<6 hex> --profile
    market-network --bidders N [--with-gateway] --guest-image-source <image> --vm-host-backend
    systemd-user --app-values <file: bidder kcp handle {app}.<inst>.bob.test> --ready-timeout 90s
    --network-timeout 4m|5m|10m --state-dir <run root>`. dev up must exit 0 and print a report whose
    MarketNetwork status.phase is Ready. Every listener binds port 0. A tenant cluster front socket
    path must fit in 107 bytes, so the run root is short (default /var/tmp/swcit). Each network
    takes a host live slot first (SOCIALWEB_IT_LIVE_SLOT; up to 30m wait, heartbeat every 10m).
    Shared networks: one 1-bidder network without gateway (policy tests) and one 2-bidder network
    with gateway (scale-to-zero and subscribeClusters tests), each brought up once per package run.
  fail_fast: >
    While a network is up, `dev status` is read every 3s and every watched command is stopped at
    once when: devsup becomes unreachable after it was reachable; the MarketNetwork phase is Failed;
    VerifierPassed=False with reason Probe lasts 3m or more; any child application is Failed; or any
    ComputeVM is Failed.
  teardown: >
    Always, also on failure. On failure only, first save the `dev status` JSON as
    status-on-failure.json and copy core logs, guest console logs and VMM logs into the test log
    dir. Then `socialweb-computer dev down --instance <inst> --state-dir <run root>` (6m limit). Its
    report must show no remaining processes, no VMs left and removedState=true. Leak check, any hit
    is a failure: the state dir still exists; a VM work dir exists under handles/*/vms/*; a process
    names the state dir in its cmdline or environ; a systemd --user unit or the slice of a bidder
    handle is still listed; a socialweb-b.slice cgroup of a bidder handle exists. Then the
    per-network fixture dir is removed and the live slot released. Artifacts are kept.
  account: >
    Every command runs as the VM account (SOCIALWEB_IT_ACCOUNT, default test-0001; via
    `sudo -n -u <account>` when the caller differs) with HOME, XDG_RUNTIME_DIR=/run/user/<uid>, the
    user DBUS bus, PATH=/usr/local/bin:/usr/bin:/bin, TMPDIR=<run root>/tmp, LANG=C.UTF-8 and
    SOCIALWEB_CLUSTERPROVIDER_SCALE_HOLD=10s.
  pod_probe: >
    The tenant probe pod used by several tests: busybox 1.36.1 pinned by digest, sleep 3600,
    requests 10m CPU and 16Mi, termination grace 0.

entries:
  - id: TestMain
    kind: integration
    source: test/integration/main_test.go
    actors: [test operator, VM account, build script, socialweb-computer CLI, live-slot broker]
    setup: >
      Suite preconditions. Offline mode (no host preconditions, no build) when SOCIALWEB_IT_OFFLINE
      is non-empty or every '|' part of -test.run starts with TestMarket. Otherwise, in order, and
      exit 1 if any fails: SOCIALWEB_IT_ACCOUNT is a local user and `sudo -n -u <account> true`
      works when the caller differs; SOCIALWEB_IT_ARTIFACTS (default
      ~/.tmp/swc-it/<utc yyyymmddThhmmss>-<4 hex>) is created; SOCIALWEB_IT_GUEST_IMAGE (default
      file:///var/lib/socialweb-computer/guest-image) holds vmlinux, rootfs.ext4 and image.json for a
      file:// source; unless SOCIALWEB_IT_SKIP_BUILD, `scripts/build-socialweb-computer.sh --dev
      --publish <SOCIALWEB_IT_PUBLISH, default /var/tmp/swc-it-<repo dir>>` (15m, build.log) leaves
      <publish>/bin/socialweb-computer; SOCIALWEB_IT_RUN_ROOT (default /var/tmp/swcit) exists with mode
      1777 and <run root>/<run id> does not exist yet and is created as the VM account with tmp/.
    asserts: >
      The exit code is the suite result, forced to 1 when harness setup fails, a shared network
      fails its teardown, or the run root cannot be removed. The artifact path is printed at the end.
    cleanup: >
      After all tests every shared network runs the standard teardown; a failure there fails the
      run. Then <run root>/<run id> is removed as the VM account. Artifacts are kept.

  - id: TestHarnessEmptyNetworkUpAndDown
    kind: integration
    source: test/integration/harness_test.go
    actors: [kcp, devsup, bidder, pds, plc]
    setup: >
      Two parallel subtests, each its own 1-bidder network without gateway (harness.network).
    asserts: >
      dev up exits 0 within 4m30s with MarketNetwork phase Ready. The fresh network lists 0
      ComputeVM components in every application status. Two simultaneous instances on one host do
      not collide.
    cleanup: Standard teardown per subtest (harness.teardown).
    cases:
      - "a: one empty 1-bidder network up and down"
      - "b: a second empty 1-bidder network up and down at the same time"

  - id: TestAcceptOfAnEndedContractStartsNoVM
    kind: integration
    source: test/integration/accept_test.go
    actors: [tenant cluster, gateway, requester, bidder, kcp, pds, relay]
    setup: >
      Own network: --bidders 1 --with-gateway, network timeout 5m. Tenant cluster "tenant" answers
      /readyz within 3m; the default ServiceAccount exists within 30s. Pod default/it-accept-probe
      (harness.pod_probe) drives a NodeClaim, an RFP, a Bid, an accept and a ComputeVM on bidder-1.
      The pod is then deleted with grace 0. Then the bidder's dev-core process group gets SIGKILL.
    asserts: >
      A tenant Node is Ready within 4m; no NodeClaim is Failed or Lost at any time; no member keeps
      logging "failed after placement". Within 100s after the pod delete (10s scale hold + 90s)
      bidder-1 lists 0 ComputeVMs and no guest remains (no VM work dir, no VM unit). There is at
      least one Won Bid and every Won Bid has status.accept.uri; within 90s every Won Bid has
      status.terminated and the Bid count is unchanged. After the SIGKILL a new bidder pid appears
      within 2m and bidder-1 is Ready with a DID and a ready Bidder/bidder component within 2m.
      During a 15s settle window and at its end no ComputeVM appears and no guest starts for the
      ended contract; Bid and Won counts equal the counts from before the restart; every Won Bid
      still has status.terminated.
    cleanup: Standard teardown. The pod is already deleted.

  - id: TestAcceptSurvivesABidderRestart
    kind: integration
    source: test/integration/accept_test.go
    actors: [requester, bidder, kcp, pds, relay]
    setup: >
      Own network: --bidders 1, no gateway. `socialweb-computer run request --network <inst> --name
      rb<6 hex> --exec true --contract-timeout 4m --network-timeout 2m --state-dir <run root>` (5m).
      Bids in root:bidder-1 are read every 50ms. When the first Bid is Published or Won the bidder
      dev-core process group gets SIGSTOP; once the requester retries the accept it gets SIGKILL.
    asserts: >
      The bidder publishes a Bid within 3m and run request has not exited before it. The stop lands
      while the Bid is Published, not Won (the restart falls between bid and accept). Within 45s the
      requester core log has submitAccept_retry. A new bidder pid appears within 2m. run request
      exits 0; its last JSON summary has phase Released, a non-empty contract receipt URI and a
      non-empty VM address. Exactly 1 Bid is Won. No guest remains within 1m.
    cleanup: >
      SIGCONT and SIGKILL to the original bidder pid, then standard teardown. A still running run
      request is killed.

  - id: TestOneAcceptMakesOneComputeVM
    kind: integration
    source: test/integration/accept_test.go
    actors: [requester, bidder, kcp, pds, relay]
    setup: >
      Own network: --bidders 1, no gateway. `run request --network <inst> --name ao<6 hex> --exec
      true --contract-timeout 4m --network-timeout 2m -- --accept-copies 10`: the requester sends 10
      concurrent copies of one accept. ComputeVMs on bidder-1 are read every 200ms during the run.
    asserts: >
      At most 1 distinct ComputeVM is ever seen (a second one fails the test at once). run request
      exits 0 with phase Released, a receipt URI and a VM address. Every receipt on any ComputeVM is
      the requester's receipt. The requester log has submitAccept_copies with copies=10 and receipts
      equal to exactly that receipt. Exactly 1 Won Bid with a non-empty status.claimedBy. No guest
      remains within 1m.
    cleanup: Standard teardown.

  - id: TestARentedVMSurvivesABidderKillAndRestart
    kind: integration
    source: test/integration/bidder_restart_test.go
    actors: [requester, bidder, kcp, pds, relay, VM host systemd user units]
    setup: >
      Own network: --bidders 1, no gateway, parallel. `run request --network <inst> --name br<6 hex>
      --hold --exec 'echo IT-RESTART-HELD; read -r _' --contract-timeout 4m --network-timeout 2m`
      (6m), waiting for the marker. Records the VM identity: ComputeVM name and phase, runtime pid
      and start time, market address, receipt URI, and per VM user unit ActiveState, InvocationID,
      MainPID and process start ticks; and the issuerUrl values in the bidder core log. Two
      disruptions in sequence, then "done" on the guest stdin, then `run request release <name>
      --contract-timeout 2m --network-timeout 2m` (3m).
    asserts: >
      Before: exactly 1 ComputeVM, phase Running, non-zero pid, an address, a receipt, at least 1
      unit; the bidder log names exactly 1 issuer URL. After each disruption, within 2m the VM
      identity is unchanged (same units and invocation ids, same pid and start time) and so is the
      issuer URL. The held run request exits 0 with phase Held and the original receipt. The release
      exits 0 with phase Released and contract releaseStatus 200 (the vm.delete answer). No
      ComputeVM, VM unit or VM work dir remains within 1m.
    cleanup: Standard teardown.
    cases:
      - "kill -9 of the bidder dev-core process group; a new pid within 2m"
      - "socialweb-computer dev restart --instance <inst> bidder-1/bidder within 2m"

  - id: TestBidderAnswersEachRFPOnceAcrossARestart
    kind: integration
    source: test/integration/bids_test.go
    actors: [tenant cluster, gateway, bidder, kcp, pds, relay]
    setup: >
      Own network: --bidders 1 --with-gateway, 5m. Tenant "tenant" /readyz within 3m, default
      ServiceAccount within 30s. Pod default/it-bid-probe (harness.pod_probe) scales out. Then
      SIGKILL to the bidder-1 dev-core process group.
    asserts: >
      At least 1 tenant Node Ready within 4m; no NodeClaim Failed or Lost. Before the restart: no
      two Bids share spec.rfp.uri; at least 1 ComputeVM; exactly 1 Won Bid per ComputeVM (Bid
      status.computeVM names it). After the kill a new pid within 2m and bidder-1 Ready with a ready
      Bidder component within 2m. For a 15s settle window the Bid count does not change and the
      network stays healthy. After: same Bid, RFP, Won and ComputeVM counts, still 1 Bid per RFP,
      every ComputeVM still has a Won Bid.
    cleanup: Standard teardown (it also removes the pod, guests and tenant cluster).

  - id: TestComponentLinkRegistryEnforcesWorkspaceAccess
    kind: integration
    source: test/integration/componentlink_test.go
    actors: [component handler registry, bidder caller, pds handler, system caller]
    setup: >
      In process, no network (suite preconditions still apply unless offline). Handlers: root:beta
      Pds/pds HTTP handler "http" answering 204 and a stream handler "http"; root:alpha Pds/pds an
      HTTP handler. Calls GET http://<root:beta pds service name>/ and opens streams to root:beta
      Pds/pds "http" as several callers under several ComponentLink sets.
    asserts: >
      Denials are the link-denied error. With no links: alpha Bidder/bidder is denied; beta
      Bidder/bidder (same workspace) gets 204; the system caller gets 204. An exact link alpha
      Bidder/bidder -> beta Pds/pds gives 204; restricted to handler "other" denied, to "http" 204.
      A workspace-only link alpha -> beta gives 204; with a mismatched fromName denied. Streams: no
      link denied, the exact link allowed, a link for handler "other" denied. Clearing the links
      closes an open stream within 2s. After clearing, cross-workspace HTTP and streams are denied.
    cleanup: The registry is closed. Nothing on disk.

  - id: TestComponentLinksAreReconciledOnALiveMarketNetwork
    kind: integration
    source: test/integration/componentlink_test.go
    actors: [kcp, bidder, pds, policy engine]
    setup: >
      Own network: --bidders 1, no gateway, 5m. Reads every application component workspace from
      dev status and lists exposure.socialweb.computer/v1alpha1 ComponentLink objects in each.
      Deletes the reconciled Bidder -> Pds link in the MarketBidder workspace. Creates a manual
      ComponentLink manual-cross-workspace-<8 hex> in a Pds workspace outside the bidder workspace
      from <bidder ws> Bidder/<name> to that Pds, then deletes it.
    asserts: >
      The MarketNetwork names at least 1 component workspace. In every workspace within 3m every
      ComponentLink has from and to in that workspace, observedGeneration == generation and
      status.ready=true with phase Ready. The bidder workspace links Bidder/<bidder> to a Pds and
      has no link to PolicyEngine. The deleted Bidder -> Pds link returns with the same name and a
      new UID, Ready within 3m. The manual cross-workspace link is Ready within 3m and never Failed,
      and is gone within 2m after its delete. The network stays healthy.
    cleanup: The manual ComponentLink is deleted (30s, NotFound ignored), then standard teardown.

  - id: TestAStoppedBidderIsReplacedAndReleasesItsOrphan
    kind: integration
    source: test/integration/failover_test.go
    actors: [tenant cluster, gateway, requester, bidder-1, bidder-2, kcp, pds, relay]
    setup: >
      Own network: --bidders 2 --with-gateway, 5m, gateway option vm-ready-timeout-sec=90, parallel.
      Warm-up: two concurrent `run request --name fo<6 hex> --exec true --contract-timeout 4m
      --network-timeout 2m -- --deny-bidder-dids <other bidder DID>` (5m each). Then pod
      default/it-failover in tenant "tenant". Before the winner's node joins, the winner is stopped
      by stopped=true on its entry in MarketNetwork "network" spec.apps (root). Later the flag is
      removed. Finally the pod is deleted.
    asserts: >
      Warm-up: each request exits Released with a receipt, won by the bidder not denied; no guests
      within 2m. Within 4m a NodeClaim has status.contract.acceptUri and a winner DID while not yet
      Joining or Running; its receipt within 2m, still before any join; within 30s the winner has a
      ComputeVM carrying that receipt. After the stop the application message starts with "stopped:"
      within 2m and no claim for the old RFP is Joining or Running; within 270s that claim ends
      (Failed, Lost or Released) or is gone. Within 6m a replacement claim for a new RFP is Running,
      won by the other bidder, never Failed or Lost, and the pod is Ready on its node. After the
      restore the stopped bidder is Ready within 3m and within 3m has no ComputeVMs and no VM units;
      any ComputeVM it shows meanwhile carries only the old orphan receipt, never the replacement's.
      The pod stays Ready on the same node. After the pod delete no guest remains within 100s.
    cleanup: The pod is deleted with grace 0, then standard teardown for both bidder handles.

  - id: TestOpenTunnelProviderPublication
    kind: integration
    source: test/integration/ingress_provider_test.go
    actors: [opentunnel ingress provider, pds handler, fake opentunnel process]
    setup: >
      In process, no network. A fake opentunnel executable prints the URL held in a file (first
      https://pds-one.opentunnel.xyz) and sleeps. Handler root Pds/pds answers "ok". The opentunnel
      provider runs with route pds-test and local host 127.0.0.1. Ingress is registered (workspace
      root, exposure pds-ingress, service pds, protocol HTTP, handler http, ingress ref "ingress").
      Then the file changes to https://pds-two.opentunnel.xyz and the same spec is registered again.
    asserts: >
      The provider is Ready within 10s. The first URL starts with https://pds-one.opentunnel.xyz.
      The second registration is refused with the stable-host-mismatch error.
    cleanup: Registration closed, provider cancelled and awaited, temp dir removed.

  - id: TestKubeconfigClientCertificateWithoutCredentialHelper
    kind: integration
    source: test/integration/kubeconfig_client_cert_test.go
    actors: [owner pds account, pds, gateway, tenant cluster, kcp, kubectl]
    setup: >
      Own network: --bidders 1 --with-gateway, 5m, parallel. Tenant "tenant" ready within 3m and
      ClusterRoleBinding socialweb-owner within 3m. Gateway XRPC address from Exposure
      svc-gatewayapi-gateway-api-local status.endpoint; owner from the gateway owner-sessions.json
      (exactly 1) via com.atproto.server.createSession over the network CA. Service-auth tokens from
      com.atproto.server.getServiceAuth with aud = the GatewayAPI gateway-api audience and a per
      method lxm. Calls com.publicdomainrelay.temp.cluster.getKubeconfig,
      computer.socialweb.k8s.kubectlApplyServerSide and
      com.publicdomainrelay.temp.cluster.revokeIdentity. Uses the kubeconfig through client-go and
      /usr/local/bin/kubectl with a PATH that lacks socialweb-credential.
    asserts: >
      getKubeconfig {"name":"tenant","ttlSeconds":3600} is 200 with Cache-Control no-store. The
      kubeconfig has exactly 1 user with a plain client cert and key (no exec plugin, no token);
      cert CN = owner DID, O = [socialweb.computer:cluster-owners], lifetime 1h to 1h05m.
      ttlSeconds 59 and 86401 are 400 InvalidRequest. A token for lxm listClusters is 401 on
      getKubeconfig. `kubectl get nodes -o name` exits 0 and a client-go node list works.
      kubectlApplyServerSide of ConfigMap default/it-owner-credential (fieldManager kubectl) is 200
      and the object exists. revokeIdentity {"name":"tenant"} is 200, and within 2s the cert is
      refused (401/403; kubectl non-zero). The private key (base64 of the PEM, and PEM body lines of
      40+ chars) appears in no file under the gateway logs or the gateway run dir.
    cleanup: Fixture dir removed; standard teardown.

  - id: k8s_xrpc_test.go
    kind: fixture
    source: test/integration/k8s_xrpc_test.go
    actors: [owner pds account, gateway, tenant cluster]
    setup: >
      The shared "Job through XRPC" check of the scale-to-zero test (cluster "tenant", a test
      namespace, a pinned node), calling the gateway computer.socialweb.k8s.* methods with owner
      service-auth tokens (aud = gateway audience, lxm = full method NSID).
    asserts: >
      kubectlApplyServerSide of ConfigMap it-app-config (environment=production, log_level=info,
      fieldManager kubectl) is 200 with a uid and kind ConfigMap, and the object exists. log_level=debug
      with fieldManager other and no force is 409 ApplyConflict; with force=true 200 and the cluster
      shows debug. Kind example.invalid/v1 Nope is 400 KindNotFound. Job it-xrpc-job (batch/v1,
      backoffLimit 0, nodeName pinned, restartPolicy Never, busybox printing a marker and uname -m)
      is 200 kind Job. getJob (tailLines 20) reaches Succeeded within 90s with exactly 1 pod, 1
      container, Terminated, exit 0, the marker in its log. getJob it-no-such-job is 404
      ObjectNotFound.
    cleanup: Job it-xrpc-job deleted with background propagation; a failed delete is an error.

  - id: market_fixtures_test.go
    kind: fixture
    source: test/integration/market_fixtures_test.go
    actors: [pds, relay, jetstream, oauth token server, oauth QR transfer service, event stream controller, market inbox]
    setup: >
      In-process fakes for the offline TestMarket* tests. PDS: a local full-mode PDS (sqlite repo
      and account stores, random did:plc, handle market<8 hex>.test, k256 repo key), or a real PDS
      from SOCIALWEB_IT_MARKET_PDS_URL/_DID/_HANDLE/_PASSWORD. Account modes: managed-associated
      (association RequireApproval) and managed-unassociated (Skip) use a bearer session;
      existing-pds-account a RemotePDS market-remote with secret refs market/access (accessJwt) and
      market/dpop (P-256 DPoP key); existing-oauth-browser and existing-oauth-delegated OAuth
      sessions refreshed by a fake token server; existing-oauth-qr a QR transfer at
      /xrpc/com.fedfork.atprotoOauthQR. Relay fake: com.atproto.sync.subscribeRepos websocket in
      cbor or json frames. Jetstream fake: commit frames with time_us. EventStream objects (source
      relay or jetstream, collections, optional dids, handler sink) on a fake API with 20ms retry.
      Records: com.publicdomainrelay.temp.market.rfp, .bid, .accept, .receipt; association claims as
      com.publicdomainrelay.temp.badgeBlueKeys.
    asserts: >
      Relay and jetstream record each requested cursor and replay the backlog above it (resume is
      observable); the relay can close after N events to force a reconnect. The inbox dedupes on
      uri#cid and counts every apply. The token server in revoked mode answers 400 invalid_grant.
      The QR service needs a Bearer token (401 without), answers 400 without a nonce, and serves a
      nonce once (404 after).
    cleanup: Every fake server closed, local PDS stores closed and removed, controllers cancelled.

  - id: TestMarketAccountAndTransportMatrix
    kind: integration
    source: test/integration/market_matrix_test.go
    actors: [account holder, pds, jetstream, event stream controller, oauth token server, qr transfer service]
    setup: >
      Offline (market_fixtures_test.go). Each account subtest has its own PDS account and a
      com.atproto.server.createSession session; the OAuth modes use a DPoP-bound session as client
      fixture-browser, fixture-delegated or (via the one-shot QR transfer with a Bearer service-auth
      token) fixture-qr. Each transport subtest writes one com.publicdomainrelay.temp.market.bid with
      com.atproto.repo.createRecord and delivers it into an inbox keyed by at-uri#cid. XRPC: by
      com.atproto.repo.getRecord. subscribeRepos: com.atproto.sync.subscribeRepos opened before the
      write. JetStream: an EventStream (jetstream, collections [bid], dids [account]). Both:
      subscribeRepos plus XRPC.
    asserts: >
      XRPC: the first delivery is new, 1 object. subscribeRepos: within 10s an event with seq >= 0
      and ops[0].path <collection>/<rkey>, 1 object. JetStream: the handler gets the commit within
      15s, new, 1 object. Both: within 15s an event with repo = account DID and an op path; XRPC
      delivery is new, the firehose copy (same uri and cid) is not; 1 object after 2+ applies.
    cleanup: Fakes closed, temp stores removed, controller stopped.
    cases:
      - "accounts: managed-associated, managed-unassociated, existing-pds-account, existing-oauth-browser, existing-oauth-qr, existing-oauth-delegated"
      - "transports: XRPC, Firehose subscribeRepos, Firehose JetStream, Both"
      - "6 accounts x 4 transports = 24 subtests"

  - id: TestMarketDuplicateDeliveryCreatesOneObject
    kind: integration
    source: test/integration/market_matrix_test.go
    actors: [account holder, pds, relay, event stream controller]
    setup: >
      Offline. A relay EventStream (relayUrls [fake relay], collections
      [com.publicdomainrelay.temp.market.bid], dids [account]). One bid record; the relay publishes
      its commit at seq 1 and again at seq 2.
    asserts: >
      Both firehose events reach the handler within 15s. Both copies plus the getRecord copy give
      exactly 1 object after exactly 3 applies.
    cleanup: Fakes closed, controller stopped.

  - id: TestMarketRestartResumesCursorsAndDedupe
    kind: integration
    source: test/integration/market_matrix_test.go
    actors: [account holder, pds, relay, event stream controller]
    setup: >
      Offline. A JSON relay that drops the websocket after every event. Relay EventStream on the bid
      collection and the account DID. Two bids published at seq 1 and 2.
    asserts: >
      Both events arrive (15s each). Event one, then event two twice, give exactly 2 objects. The
      relay saw a reconnect with cursor=1.
    cleanup: Fakes closed, controller stopped.

  - id: TestMarketOutOfOrderAcceptConverges
    kind: integration
    source: test/integration/market_matrix_test.go
    actors: [account holder, pds]
    setup: >
      Offline. One record each of com.publicdomainrelay.temp.market.bid, .receipt and .accept,
      delivered by getRecord in the order accept, bid, receipt, accept.
    asserts: Exactly 3 objects after exactly 4 applies; the early accept does not block.
    cleanup: PDS closed, stores removed.

  - id: TestMarketFirehoseFailsClosedWithoutIngress
    kind: integration
    source: test/integration/market_matrix_test.go
    actors: [event stream controller]
    setup: An EventStream with source relay, an empty relay URL, the bid collection, no DID filter.
    asserts: Within 15s status.phase is Failed and status.cursor stays 0.
    cleanup: Controller stopped.

  - id: TestMarketRemotePDSMissingAuthFailsClosed
    kind: integration
    source: test/integration/market_matrix_test.go
    actors: [pds, remote pds binding]
    setup: >
      Offline. A RemotePDS market-remote with spec.url and spec.did, resolved first without auth,
      then with spec.auth accessTokenRef market/access and dPoPKeyRef market/dpop (P-256 multibase).
    asserts: >
      Without auth resolving fails with the authentication-required error. With auth it resolves and
      com.atproto.server.describeServer returns the PDS DID.
    cleanup: PDS closed, stores removed.

  - id: TestMarketRelayReconnectResumesCursor
    kind: integration
    source: test/integration/market_matrix_test.go
    actors: [account holder, pds, relay, event stream controller]
    setup: Offline. A JSON relay that drops after every event; two bids published at seq 10 and 11.
    asserts: Both events reach the handler (15s each); the relay saw a reconnect with cursor=10.
    cleanup: Fakes closed, controller stopped.

  - id: TestMarketAssociationRevocationRemovesApproval
    kind: integration
    source: test/integration/market_matrix_test.go
    actors: [account holder, pds]
    setup: >
      Offline. com.atproto.repo.putRecord of a com.publicdomainrelay.temp.badgeBlueKeys claim (rkey
      fixture-claim-<subject>, keyId a random did:plc, challenge the account DID, service, nonce,
      createdAt), then com.atproto.repo.deleteRecord.
    asserts: >
