plan: docs/plans/0007-compute-provider-kcp.yaml
item: M1-FC-INVENTORY
written: "2026-10-12"
gold_standard: >-
  hono-compute-provider lib/compute-provider-firecracker (TypeScript), with lib/microvm-firecracker,
  lib/node-image-firecracker, lib/oidc-issuer-hono (the provisioning enricher and issuer) and the
  atproto-market lib/common/cloud-init-common modules a firecracker guest's user_data composes. Each entry is
  one learning the Go side (cmd/socialweb-nodeboot, cmd/socialweb-nodeimage, internal/nodevm,
  internal/nodefirecracker, and the planned internal/vmruntime + internal/computevm ComputeVM controller)
  must meet, must not inherit, or that is dropped.
parity_boundary: >-
  M2-BACKPORT: the VMSpec handed to vmruntime.Prepare, the seed drive's bytes, fc.json, the bid config
  record and the issuer's droplet view. One recorded RFP fixture (testdata/compute-parity/: vm record,
  requester, accept bundle, contract) is run through ts/hono-compute-provider/test/compute_parity_test.ts (the
  firecracker provider, microvm stubbed at that boundary) and internal/computevm/parity_test.go (the Go
  controller, unit start stubbed at the same boundary); names and addresses the fixture marks as allocated
  are excluded. A parity id written TestParityX names one case run by BOTH files against that fixture; any
  other id names the test file and case that proves the entry.
fields:
  id: FC-<learning>
  source: TypeScript file:line or file:start-end, relative to the root of this repository
  behaviour: what the TypeScript does and why, including the live reading that taught it
  go_side: "meets: yes | partial | no | not-applicable (the behaviour stays TypeScript by design), and where"
  parity_test: the test ids that will prove the Go side (or prove the removal)
  status: "port | removed-legacy (non-iroh guest transport or the guest JSR registry: not ported, still in the TypeScript) | removed (removed from the TypeScript by 0008 M1-STRIP-LEGACY-TRANSPORTS; a source written path@<commit>:lines cites the code as it was at that commit, the last one before the removal) | superseded-by-<plan item>"
  covers: exported functions, constants and logger events of compute-provider-firecracker/mod.ts and microvm-firecracker/mod.ts this entry accounts for (checked by hono-compute-provider test/requirements_inventory_test.ts)
legacy_decision: >-
  docs/research/2026-10-11-vm-lifecycle/user-decisions.md (2026-10-12, multi-server-to-kcp section 7 cont.):
  STRIP ALL NON-IROH GUEST TRANSPORTS as legacy (cloud-init-common tunnel / fedproxy-ssh / fedproxy-web /
  wootty modules, websocat ProxyCommand paths, relay-fqdn guest addresses); this removes the guest JSR
  registry. Entries with status removed-legacy are not ported; entries with status removed are also gone from
  the TypeScript (0008 M1-STRIP-LEGACY-TRANSPORTS; atproto-market b78adc1 and hono-compute-provider 54d1b8f
  carry them).
requirements:
  - id: FC-USERDATA-REQUIRED
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:634-645
    behaviour: >-
      An RFP with no user_data is refused before a name, a work dir or an address is allocated. On this
      provider the user_data IS the guest: a guest started without one reaches Running with no sshd, no
      transport and no secrets, unreachable.
    go_side:
      meets: yes
      detail: >-
        M2-BACKPORT: compute-provider-kcp refuses an RFP with no user_data before a name exists; the ComputeVM
        controller waits for the user_data Secret and fails a ComputeVM whose Secret holds no user-data before
        Prepare clones anything (internal/computevm userData, boot).
    parity_test:
      - TestParityAnRfpWithoutUserDataIsRefusedBeforePrepare
    status: port
    covers: [createComputeProviderFirecracker]

  - id: FC-GUEST-NAME
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:116
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:151-162
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:646-647
    behaviour: >-
      A guest's name is fc-<12 hex of a hash of the requester DID>-<8 hex of a random UUID>. The one name is
      the providerId, the runner container's name, the work dir's last segment, the cloud-init instance-id
      and local-hostname, and the droplet id the provisioning nonce is bound to (associateWithDroplet). It
      never reaches the requester as an address (FC-OIDC-REPORTER-NO-HOSTNAME).
    go_side:
      meets: yes
      detail: >-
        M2-BACKPORT: One name: the ComputeVM name is the providerId, the HostProcess child vm-<name>, the unit
        socialweb-vm-<hid>-<name>, the work dir <state>/handles/<hid>/vms/<name>, the seed's instance-id and
        local-hostname (internal/vmruntime Prepare) and the droplet id the nonce is bound to.
    parity_test:
      - TestParityTheGuestNameIsTheProviderIdInstanceIdAndNonceBinding
    status: port

  - id: FC-ENRICH-ORDER
    source:
      - ts/atproto-market/lib/market-bidder-compute/mod.ts:376-387
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:652-671
    behaviour: >-
      user_data is enriched in a fixed order, each step reading what the earlier ones wrote: (1) the bidder
      injects the accept bundle (with guest_onnetwork_url) before provision; (2) the OIDC enricher adds the
      provisioning-token exchange and its on-network reporter; (3) withOnNetworkReporter (no-op when a
      reporter is present); (4) withOnNetworkBaseUrl (no-op when base_url is named); (5) injectJsrUrl
      (legacy, FC-JSR-REGISTRY); (6) the host address is the requester-named relay.localhost address, else
      the runtime's host address, logged as guest_host_address; (7) pointGuestAtHost (TLS port rewrite,
      /etc/hosts, .curlrc); (8) the result is written to <workDir>/user-data.yaml, which is exactly the seed.
    go_side:
      meets: not-applicable
      detail: >-
        Decided in M2-BACKPORT: pure enrichment stays TypeScript (compute-provider-common, applied by
        compute-provider-kcp before the ComputeVM is written); the Go side writes the enriched bytes into the
        cidata drive unchanged and never re-composes them.
    parity_test:
      - TestParityTheSeedUserDataEqualsTheProvidersByteForByte
    status: port
    covers: [guest_host_address]

  - id: FC-ENRICH-ONCE
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:322-348
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:524-559
      - ts/atproto-market/lib/common/cloud-init-common/mod.ts:168-214
      - ts/atproto-market/lib/common/cloud-init-common/mod.ts:276-345
    behaviour: >-
      The reporter and base_url steps detect themselves by marker (guest-onnetwork.service, the base_url
      path) and are idempotent; buildUserData dedupes write_files by path (later wins, first position keeps),
      set-unions packages and bootcmd, puts runcmdPrepend before the base runcmd and re-asserts the resolver
      once at the end. Two steps are NOT idempotent: the OIDC enricher mints a new nonce and token per call,
      and pointGuestAtHost appends its /etc/hosts runcmd and .curlrc entry again. So enrichment must run
      exactly once per guest.
    go_side:
      meets: not-applicable
      detail: >-
        compute-provider-kcp enriches once and stores the result on the ComputeVM spec; a controller restart,
        re-adoption or a re-Prepare reads the stored bytes and never enriches again.
    parity_test:
      - TestParityAReadoptedComputeVMKeepsItsSeedBytes
      - ts/hono-compute-provider/test/compute_parity_test.ts::"enrichment runs once per ComputeVM"
    status: port

  - id: FC-ACCEPT-BUNDLE
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:164-170
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:937-938
      - ts/atproto-market/lib/common/cloud-init-common/mod.ts:346-369
      - ts/atproto-market/lib/market-bidder-compute/mod.ts:376-384
    behaviour: >-
      The accept bundle {$type market.accept, accept, rfp, bid, bid_config (strongRef wrapper {uri, cid,
      value}), vm, guest_onnetwork_url} is written as JSON at the accept path (DEFAULT_ACCEPT_PATH_VM,
      /root/secrets/publicdomainrelay.com/market/accept.json), root:root 0600, its parent created 0700 by a
      prepended runcmd. It is per contract and never baked into an image.
    go_side:
      meets: not-applicable
      detail: >-
        Composed in TypeScript; the Go side carries it inside the seed bytes. M2-VM-RUNTIME's cidata drive
        must hold the user-data verbatim so the path and mode survive.
    parity_test:
      - TestParityTheAcceptBundleIsAtTheAcceptPathWithMode0600
    status: port
    covers: [injectAcceptBundle]

  - id: FC-ONNETWORK-URL
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:172-182
      - ts/atproto-market/lib/market-bidder-compute/mod.ts:383
    behaviour: >-
      The guest reports to the URL in the bundle's guest_onnetwork_url (the bidder's own /v1/on-network,
      which holds the accept-to-receipt map and submits the wrapped event); with none, this provider's issuer
      URL + /v1/on-network.
    go_side:
      meets: not-applicable
      detail: >-
        The route stays TypeScript (compute-provider-kcp, M4-ONNETWORK; a guest-facing DenoPod after
        M4-BIDDER-VAULT). The port derivation from the tunnel subscriber's --ingress-proxy-host flag in
        guestOnNetworkUrl is legacy (FC-LEGACY-TUNNEL-MODULE).
    parity_test:
      - ts/hono-compute-provider/test/firecracker_onnetwork_reporter_test.ts::"the bundle's guest_onnetwork_url is what the guest reports to"
      - TestParityTheSeedUserDataEqualsTheProvidersByteForByte
    status: port
    covers: [onNetworkUrlFromBundle]

  - id: FC-ONNETWORK-TARGETS
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:184-211
    behaviour: >-
      The report is tried at the URL as written and, when the user_data names `<ip> relay.localhost` and the
      URL's host is a .localhost name, again with curl --resolve <host>:<port>:<ip>: the guest's /etc/hosts
      line for a relay name may be the microVM's gateway, which carries no arbitrary port.
    go_side:
      meets: not-applicable
      detail: TypeScript enrichment; on the Go side the address in the alias is the constant pasta gateway (FC-HOST-ADDRESS).
    parity_test:
      - ts/hono-compute-provider/test/firecracker_onnetwork_reporter_test.ts::"a relay name behind a dispatcher is also tried at the address the guest reaches it on"
    status: port
    covers: [onNetworkTargets]

  - id: FC-REQUESTER-NAMED-HOST
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:510-522
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:667
    behaviour: >-
      A host address the requester already named (`<ip> relay.localhost`, the market network's guestHostAliases) is the
      one the provider uses for every .localhost name: cloud-init resolves before the provider's runcmd can
      append a second line, so a different address would be the line that never wins.
    go_side:
      meets: yes
      detail: >-
        M2-BACKPORT: compute-provider-kcp points every .localhost name at the address the requester named
        (addressTheRequesterNamed), else the constant pasta host address 192.0.2.1; pasta forwards both to the
        host.
    parity_test:
      - ts/hono-compute-provider/test/firecracker_network_test.ts::"a host address the requester already named is the one the guest is given"
      - TestParityARequesterNamedRelayAddressWins
    status: port
    covers: [addressTheRequesterNamed]

  - id: FC-HOST-ADDRESS
    source:
      - ts/hono-compute-provider/lib/microvm-firecracker/mod.ts:53-65
      - ts/hono-compute-provider/lib/microvm-firecracker/mod.ts:297-302
    behaviour: >-
      The address a guest dials this host at is the runner container's default bridge gateway
      (backend.defaultGateway()), not pasta's gateway, which is the container itself and answers nothing.
    go_side:
      meets: no
      detail: >-
        No container on the Go side. Decided 2026-10-11: every guest gets the identical address plan inside
        its private pasta user+net namespace and the host address is pasta's mapped gateway, a constant
        vmruntime exports and compute-provider-kcp uses for enrichment (M2-VM-RUNTIME).
    parity_test:
      - TestParityTheHostAddressIsThePastaMappedGateway
    status: superseded-by-M2-VM-RUNTIME

  - id: FC-ONNETWORK-REPORTER-FALLBACK
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:213-304
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:338-348
    behaviour: >-
      When no OIDC enricher composed a reporter, the provider composes its own (two reporters would race to
      publish the same event): waits up to 180 s for /run/guest-fqdn, posts {acceptUri, acceptCid, address}
      to each target, 5 rounds 6 s apart, stops at the first 200, logs to journal+console. Script and unit
      ride in user_data, never in the image.
    go_side:
      meets: not-applicable
      detail: >-
        TypeScript enrichment. Ported with the rules the live run taught the OIDC reporter: ordered after
        iroh.service, never posts a hostname (FC-OIDC-REPORTER-NO-HOSTNAME); its tunnel-subscriber ordering
        is FC-LEGACY-REPORTER-TUNNEL-ORDERING.
    parity_test:
      - ts/hono-compute-provider/test/firecracker_onnetwork_reporter_test.ts::"user_data that already reports the FQDN is left alone"
      - TestParityTheSeedUserDataEqualsTheProvidersByteForByte
    status: port
    covers: [onNetworkReporterModule, withOnNetworkReporter]

  - id: FC-ONNETWORK-BASE-URL
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:306-336
      - ts/hono-compute-provider/lib/oidc-issuer-hono/mod.ts:469-482
    behaviour: >-
      With no issuer, the provider writes <SECRETS_PREFIX>/base_url (the report URL's origin, 0600) so the
      reporter does not fall back to the public dispatcher and 404. It is skipped whenever the user_data
      names that path, because provisioning-token.service has ConditionPathExists=!base_url and a pre-written
      base_url would stop the token exchange.
    go_side:
      meets: not-applicable
      detail: TypeScript enrichment; carried in the seed bytes.
    parity_test:
      - ts/hono-compute-provider/test/firecracker_onnetwork_reporter_test.ts::"the guest is told where to report, without an OIDC exchange having to succeed"
    status: port
    covers: [withOnNetworkBaseUrl]

  - id: FC-OIDC-REPORTER-NO-HOSTNAME
    source:
      - ts/hono-compute-provider/lib/oidc-issuer-hono/mod.ts:484-541
      - ts/atproto-market/lib/abc/compute-request/mod.ts:269-275
    behaviour: >-
      Live hat-8 2026-10-11T23:53Z (hono-compute-provider 033a8c0, atproto-market 6099aac): the reporter
      waited 60 s and then posted $(hostname), and the requester polled wss://fc-1379be663dd9-762b64d5/ until
      timeout. Now it waits 600 s for /run/guest-fqdn, is ordered After=iroh.service with
      TimeoutStartSec=900, logs to journal+console, never falls back to the hostname, and on giving up dumps
      pending jobs and the transport units' status and fails the unit; the requester classifies a
      single-label address as a hostname and keeps waiting. With no base_url the reporter now exits 1 instead
      of falling back to a public dispatcher, and a provisioning whose issuer has no http(s) base URL is
      refused at provision time (plan 0007 M3-OIDC-ISSUER-INSTANCE).
    go_side:
      meets: not-applicable
      detail: TypeScript enricher; carried in the seed bytes.
    parity_test:
      - ts/hono-compute-provider/test/oidc_onnetwork_reporter_test.ts::"the oidc reporter never publishes the guest's hostname as its address"
      - ts/hono-compute-provider/test/oidc_onnetwork_reporter_test.ts::"the oidc reporter waits for the transport long enough for a slow boot and says why when it gives up"
      - ts/hono-compute-provider/test/compute_parity_test.ts::"the reporter has no fallback base URL"
      - ts/hono-compute-provider/test/oidc_issuer_instances_test.ts::"the on-network reporter has no hardcoded base URL and fails closed without one"
    status: port

  - id: FC-IROH-LISTENER-ORDERING
    source:
      - ts/atproto-market/lib/common/cloud-init-common/mod.ts:562-726
    behaviour: >-
      Live hat-8 2026-10-11T23:53Z (atproto-market ad659c1): `systemctl enable --now ssh` in runcmd never
      returned and iroh.service was ordered After=ssh.service, so no ticket reached /run/guest-fqdn in time.
      Now iroh.service is After=network-online.target only (dumbpipe dials 127.0.0.1:22 per stream), runcmd
      enables and starts it --no-block before ssh, ssh starts --no-block, the ticket is written as
      iroh://<ticket> to /run/guest-fqdn through a temp file and mv, IROH_SECRET persists 0600 so the
      endpoint id survives restarts, Restart=always. Re-run: ticket 6.5 s after boot, ssh ready ~20 s after
      the request. iroh is the only guest transport kept.
    go_side:
      meets: partial
      detail: >-
        The module stays TypeScript and rides in the seed. The guest image (M1-GUEST-IMAGE) must not bake any
        unit that orders iroh after ssh; dumbpipe is still fetched from GitHub at boot by setup-iroh.sh unless
        the image carries the pinned version.
    parity_test:
      - ts/atproto-market/test/cloud_init_snapshot_test.ts::"iroh listener never waits on sshd and no runcmd step blocks on a unit start"
      - TestParityTheSeedUserDataEqualsTheProvidersByteForByte
    status: port

  - id: FC-BID-CONFIG-TOKEN-PATH
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:27
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:35
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:659-675
      - ts/hono-compute-provider/lib/oidc-issuer-hono/mod.ts:460-465
      - ts/atproto-market/lib/common/cloud-init-common/mod.ts:362-490
    behaviour: >-
      The bid config record (com.publicdomainrelay.temp.compute.config.wif.simple) carries accept_path,
      issuer_uri, to_issue exchange-firecracker-oidc, actx (last segment of the bidder DID), and under
      SECRETS_PREFIX /root/secrets/digitalocean.com/serviceaccount: actx_path team_uuid, token_path token,
      url_path base_url; url_route /v1/oidc/issue; subject actx:{actx}:plc:{did-plc-key}:role:{role}.
      token_path must be the file provisioning-token.sh writes: before 4d7da59 it named another path and
      setup-secrets.service, which reads bid_config.value (or the inline record) from accept.json, waited for
      a token that never appeared.
    go_side:
      meets: yes
      detail: >-
        M2-BACKPORT: compute-provider-kcp createBidConfig writes the same wif.simple record (accept_path,
        issuer_uri, exchange-firecracker-oidc, actx, SECRETS_PREFIX token, team_uuid and base_url paths).
    parity_test:
      - TestParityTheBidConfigRecordEqualsTheProviders
      - ts/hono-compute-provider/test/firecracker_secrets_path_test.ts::"the firecracker bid config points the guest at the token the provisioning script writes"
    status: port
    covers: [SECRETS_PREFIX, WIF_SIMPLE_NSID]

  - id: FC-GUEST-TLS-PORT-AND-CURLRC
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:524-559
      - ts/atproto-market/request-vm-ssh/mod.ts:329-333
    behaviour: >-
      With guestTlsPort set (a market network dispatcher off 443), every https://<name>.localhost URL without a port is
      rewritten to :<guestTlsPort>, /root/.curlrc gets `resolve = *:<port>:<hostAddress>`, and every
      .localhost name gets a prepended runcmd line `<hostAddress> <name>` in /etc/hosts; a user_data that is
      not YAML is refused. .curlrc reaches systemd units only when CURL_HOME is set, which the market network requester
      does with `systemctl set-environment CURL_HOME=/root` in bootcmd.
    go_side:
      meets: yes
      detail: >-
        M2-BACKPORT: compute-provider-kcp applies pointGuestAtHost with the bidder's guest TLS port before the
        ComputeVM is written; the seed carries the bytes verbatim.
    parity_test:
      - TestParityTheGuestTlsPortRewriteHostsAndCurlrc
    status: port

  - id: FC-NETWORK-RANGE-INDEX
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:108-110
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:132-149
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:570
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:648
    behaviour: >-
      Each guest gets a /30 out of rangeBase (default 172.30.0.0): pasta .0, gateway .1, guest .2. The index
      is a process-local counter, never reused, 16384 blocks, exhausted rather than wrapped.
    go_side:
      meets: no
      detail: >-
        Decided 2026-10-11: an IDENTICAL address plan for every guest inside its private pasta namespace; the
        network-index allocator is deleted. nodevm.Network has one default plan today
        (internal/nodevm/spec.go:37-43, 156-232).
    parity_test:
      - TestParityEveryGuestGetsTheSameAddressPlan
      - internal/vmruntime TestPrepareWritesASeedDriveAndFcJsonAndNoHostToolIsExecd
    status: superseded-by-M2-VM-RUNTIME
    covers: [networkFor]

  - id: FC-GUEST-MAC
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:118-130
    behaviour: >-
      The guest MAC is 06:00:<the guest IPv4's four octets in hex>, so the guest's network setup configures
      the address the host routed; it is derived only from an IPv4 address.
    go_side:
      meets: yes
      detail: >-
        nodevm.DefaultGuestMAC 06:00:ac:10:00:02 encodes 172.16.0.2 by the same rule
        (internal/nodevm/spec.go:39, 241-242); with the identical plan it is the constant fc.json
        network-interfaces MAC.
    parity_test:
      - TestParityFcJsonMacEncodesTheGuestAddress
    status: port
    covers: [guestMacFor]

  - id: FC-GUEST-IS-NOT-GATEWAY
    source:
      - ts/hono-compute-provider/lib/microvm-firecracker/mod.ts:202-208
    behaviour: >-
      A guest addressed as its own gateway is refused before anything starts: it would ARP for itself and
      its frames would be answered by the interface that sent them.
    go_side:
      meets: yes
      detail: nodevm Network.Validate refuses guest == gateway and pasta == gateway (internal/nodevm/spec.go:156-232).
    parity_test:
      - TestParityTheConstantAddressPlanValidates
    status: port

  - id: FC-RESOLVER-GATEWAY
    source:
      - ts/atproto-market/lib/common/cloud-init-common/mod.ts:117-129
      - ts/atproto-market/lib/common/cloud-init-common/mod.ts:287-319
    behaviour: >-
      /etc/resolv.conf names the DNS gateway first, then 1.1.1.1 and 9.9.9.9, then any nameserver a caller
      wrote; it is written in write_files and re-asserted last in bootcmd and in runcmd. The default gateway
      172.30.0.1 is the first block of the TypeScript provider's range.
    go_side:
      meets: yes
      detail: >-
        M2-BACKPORT: The identical guest network's gateway is 172.30.0.1 (internal/guestnet Gateway, pasta
        --dns-forward), the same address as DEFAULT_DNS_GATEWAY.
    parity_test:
      - TestParityTheResolverNamesTheConstantGatewayFirst
    status: port

  - id: FC-PACKAGES-GUARD
    source:
      - ts/atproto-market/lib/common/cloud-init-common/mod.ts:207-249
    behaviour: >-
      Packages the modules ask for leave cloud-init's apt module and become the first runcmd entry, a dpkg -s
      guard that runs apt only for what the image lacks; package_update is false; names are validated before
      entering a shell command. A baked image therefore runs no apt at boot.
    go_side:
      meets: not-applicable
      detail: TypeScript composer; the image must carry the packages (FC-PREINSTALL-MANIFEST).
    parity_test:
      - TestParityTheSeedUserDataEqualsTheProvidersByteForByte
    status: port

  - id: FC-PREINSTALL-MANIFEST
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:350-508
    behaviour: >-
      The image's baked list is derived from module ids only (a module function is refused: it closes over
      one contract, e.g. its accept.json). A package, file or prepended command is baked only when the module
      emits it identically with and without instance values; everything else is left to boot. The last
      module to write a path wins; prepended commands keep their order; argv commands are shell-quoted; files
      owned by anyone but root, apt sources and non-command runcmd entries are refused rather than baked
      wrong.
    go_side:
      meets: partial
      detail: >-
        cmd/socialweb-nodeimage applies a manifest in a chroot on the bidder (preinstall.go:32 LoadPreinstall,
        :140 chrootPreinstall; ensure.go:209 refuses an image that does not carry it). M1-GUEST-IMAGE bakes
