  - id: FC-VM-TERMINATED
    source:
      - ts/hono-compute-provider/lib/compute-provider-firecracker/mod.ts:776
      - ts/atproto-market/lib/market-bidder-compute/mod.ts:58-69
      - ts/atproto-market/lib/market-bidder-compute/mod.ts:202-242
    behaviour: >-
      A GuestGone reason `runner container exited|removed` is mapped by the bidder to vm.terminated (exited
      with code 0 -> guest_poweroff, else vmm_exited), published as a signed market.event to submitEvent or
      the firehose, with a tombstone so a late vm.delete answers 200. Live hat-8 2026-10-12T01:44Z: 5.6 s from
      guest poweroff to the requester's session end, no vm.delete sent.
    go_side:
      meets: yes
      detail: >-
        The string heuristic is replaced by explicit Lost reasons (HostRebooted -> host_reboot,
        GuestPoweroff -> guest_poweroff, UnitGone/UnitFailed/VMMExited -> vmm_exited, OOMKilled -> oom,
        IdentityMismatch -> identity_mismatch). GuestPoweroff is a VM whose VMM logged "Firecracker exiting
        successfully. exit_code=0": the guest powered off or reset (reboot=k, the i8042 reset), and
        firecracker exited by itself. The unit status cannot tell it apart: the unit watch reads a VMM
        killed by SIGKILL and a clean exit alike as inactive, result success, code 0 status 0.
    parity_test:
      - internal/computevm TestEveryLostVerdictCarriesTheTerminatedReason
      - ts/hono-compute-provider/test/compute_provider_kcp_test.ts::"a ComputeVM going Lost fires onGuestGone with its reason"
    status: superseded-by-M4-TERMINATION-EVENT

