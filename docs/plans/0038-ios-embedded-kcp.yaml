  - id: I7-AGENTS
    title: "Agents section: launch an agent VM through the market request flow (EphemeralInfra, ComputeContract with spec.agent), leased token row, Release, revoke; release finished in background time or on next launch"
    owner: atirc-ios-client-dev
    status: doing
  - id: I8-ASK-OWNER
    title: "Pending owner questions list, answer sheet and local notification on a new ask (chat.atirc.ask/questions/answer/decide/owner_mode)"
