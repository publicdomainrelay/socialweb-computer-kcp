    title: "kcp boots in process in the iOS Simulator (memory storage, net.Pipe, no sockets); status bar shows kcp ready"
    owner: atirc-ios-client-dev
    status: done
  - id: I2-RUNTIME
    title: "One Go runtime: AtircGo.xcframework (app golib + kcp bridge); memory settings (GOGC, GOMEMLIMIT, watch cache off) measured on a device"
    owner: atirc-ios-client-dev
    status: done
  - id: I3-PERSIST
    title: "Persistence across app restarts: snapshot/restore and persist hooks into the app container; cold boot vs resume times measured"
    owner: atirc-ios-client-dev
    status: done
  - id: I4-SOCIALWEB-IOS
    title: "socialweb builds for ios/arm64: the MarketRequester root and Requester component compose in the app's kcp (comms Firehose, no ingress), with ios build tags for host-only packages; build gate covers ios/arm64"
    owner: linux-kcp
    status: done
  - id: I5-OAUTH
    title: "OAuth sign-in in the app with the requester scope plus chat.atirc.revoke (28); client metadata generated from requester-scope.txt; MarketIdentity Ready in the embedded kcp"
    owner: atirc-ios-client-dev
