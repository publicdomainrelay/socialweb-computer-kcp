plan: "0038"
title: "iOS embedded kcp: the AT-IRC iOS app runs kcp and the socialweb requester in process, signs in with OAuth, and launches leased atirc agents through the market request flow"
status: doing
source: >
  2026-10-30 atirc, owner: "see if you can get a build of kcp running in the ios app, we got it running
  in wasm so this should be possible", then the full shell.socialweb.computer scope set and an Agents
  section that launches agents "via the same market request flow ... via kcp the other agents are
  working on". Lead and plan owner: linux-kcp. App owner: atirc-ios-client-dev (its own milestone plan
  M1-M5: AT-IRC docs/plans/0001-ios-embedded-kcp.md in atirc-client-ios; bridge AtircgoKCPStart,
  AtircgoKCPRequest, AtircgoKCPSnapshot, AtircgoKCPReady, AtircgoKCPStatus, AtircgoKCPStop in package
  github.com/kcp-dev/kcp/contrib/wasm/ios/atircgo). Atirc server: atirc-dev. Port advice: wasm (the page
  is the model).
principle: >
  The iOS app is one more requester host, like the page: it composes the same MarketRequester root and
  runs the same Requester component in process. No iOS-only market protocol, no iOS-only lexicon, no
  socket listener in the app; the app reaches the market only through the requester's outbound XRPC and
  the firehose (comms mode Firehose, as the page). The selected policy mode runs for every decision.
decisions:
  runtime: >
    One Go runtime per process: AtircGo.xcframework holds the app's Go library and the kcp bridge
    (two gomobile frameworks crashed with two Go runtimes). Build GOOS=ios GOARCH=arm64 CGO_ENABLED=1
    with -trimpath -ldflags "-s -w"; GOGC 25 and a GOMEMLIMIT; the apiserver watch cache off.
  storage: >
    kcp runs on the in-memory storage of kcp-wasm contrib/wasm/storage (no etcd), persisted to the app
    container through its snapshot/restore and persist hooks; the restore check is the page's (exact
    seqs both ways, key and owner).
  oauth: >
    The app has its own client metadata. Its scope is exactly the requester scope generated by
    socialweb cmd/requester-scope at the socialweb rev the app is built at, plus
    rpc:chat.atirc.revoke?aud=did:web:irc.fedfork.com%23atirc. Granted scopes are read from the token
    response, never from the access token's opaque scope claim. Simulator sign-ins are scripted with the
    alice credential file sourced into the one command that signs in; no sign-in URL is ever posted.
  agents: >
    The Agents section follows the page: one EphemeralInfra per app session, one ComputeContract entry
    per launch with spec.agent (and guestTools for R2), the requester mints a leased atirc token after
    the verified receipt, and Release stamps releaseRequestedAt. A release asked for before the app is
    suspended finishes on the next launch from the persisted state; the app asks iOS for background
    time to finish it first.
  policy: >
    The requester runs requester-tangled-vouch by default, as on every host. iOS has no deno: the policy
    sandbox needs an iOS provider on PolicyEngine spec.sandbox (the plan 0037 pattern: a contract runner
    with a Prober, Fenced only after the probe passes); until it exists the requester fails closed and
    Request VM shows why.
state_rules:
  - "No contract is created while the requester policy cannot run; Fenced=False means Deny."
  - "The app never holds a long atirc token for agents; agent tokens are leased and die with the contract."
  - "The account-level OAuth session is the owner identity for chat.atirc.answer and chat.atirc.owner_mode."
items:
