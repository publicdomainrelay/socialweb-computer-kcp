  - id: M3-UNITS
    milestone: M3
    title: user_data installs systemd units for dumbpipe connect-tcp and the k3s agent; no ssh to guests
    decision: >
      Binaries come from our nodeimage when present, otherwise from the door hash-pinned (static
      musl amd64 and arm64, sha256 written into user_data). Invariant 13 changes from ssh stdin to
      OpenBao JWT over the cluster link. Measured for the market path: the iroh transport module
      (setup-iroh.sh, /usr/local/bin/dumbpipe) and the k3s module (setup-k3s.sh, /usr/local/bin/k3s)
      the door already composes install both binaries in the same runcmd before the units start, so
      door-served binaries are not needed there. Decided by Claude, user may veto: the agent unit is
      socialweb-k3s-agent (the k3s installer owns k3s/k3s-agent); socialweb-node-secrets is a oneshot
      with Restart=on-failure (systemd refuses Restart=always on oneshot) and every unit has
      StartLimitIntervalSec=0; node-secrets refuses a non-IPv4 advertiseAddress, a non-digit port and a
      ticket outside [a-z0-9]+ because they reach a unit command line; the token is pinned
      K10<sha256(serverCA)>::server:<token> as the ssh join pinned it.
    status: done
    evidence:
      - "prod probe 2026-10-07T20:54Z (first bidder online, bob on hat-8): the door asked for ClusterLink 2wjeqtgx-2wjeqtgx-...-openbao -- it re-derived the cluster key from spec.cluster, which the provider already writes as the key; every claim failed before its RFP. Fixed in 657a915 (door test now pins spec.cluster as the key; 4 tests failed first), deployed ~20:57Z"
