  - id: M5-NETPOL
    milestone: M5
    title: NetworkPolicies are enforced on market nodes
    decision: >
      Read 2026-10-10T02:02Z over debug ssh on a market node: k3s logs "Failed to load kernel module
      nft-expr-counter with modprobe", kube-router's network policy controller "Aborting sync. Failed to run
      iptables-restore ... RULE_APPEND failed (No such file or directory): rule in chain KUBE-POD-FW-*", and
      `iptables -S` answers "iptables: Incompatible with this kernel" (iptables-nft 1.8.10; nft_compat,
      nf_tables, xt_comment, xt_mark, xt_set loaded). Pod traffic works (M5 proven) but tenant NetworkPolicies
      are not enforced. Fix: ship the missing nft expression modules (nft_counter and whatever else the rules
      need) in the node image's module set or kernel config, prove a deny-all NetworkPolicy blocks a cross-node
      connection on prod. decided by Claude, user may veto.
    status: done
    evidence:
      - "root cause (2026-10-10, local market network + offline image reading): not a missing module FILE and not an iptables backend mix. The image copies the build host's whole module tree (debugfs on ~/kcp-image/out-market/sha256-51e20605.../rootfs.ext4 lists nft_limit, nft_log, nft_reject*, nfnetlink_log under /lib/modules/7.2.8-200.fc44.x86_64), but the Fedora kernel is built with CONFIG_MODPROBE_PATH=\"/usr/bin/modprobe\" and the Ubuntu 24.04 rootfs has modprobe only at /usr/sbin/modprobe (-> ../bin/kmod; /sbin -> usr/sbin; no /usr/bin/modprobe). So every request_module() in the guest exec'd a missing path and no module autoloads; only systemd-modules-load's list and userspace modprobe-on-PATH calls load anything. kube-router's failing restore line (61 on the market network) is `-m mark ! --mark 0x10000/0x10000 -j NFLOG --nflog-group 100 -m limit --limit 10/minute --limit-burst 10`; Ubuntu's iptables-nft 1.8.10 writes NFLOG and limit as NATIVE nft expressions (`nft --debug=netlink` on that ruleset replayed with the image's own xtables-nft-multi in a user+net namespace on the build host: `[ log group`, `[ limit rate`, `[ counter`, compat `match name` for comment/conntrack/addrtype/set/physdev), so it needs nft_log and nft_limit, which the module list never named (it names xt_NFLOG/xt_limit, which only the xtables path uses) -> ENOENT -> the whole sync aborts. The same replay on the build host kernel, where autoload works, applies cleanly and `iptables -S` lists it, so the ruleset and the iptables binary are fine"
      - "nft-expr-counter: harmless. The host config has no CONFIG_NFT_COUNTER and modules.alias no nft-expr-counter; the counter expression is built into nf_tables.ko, and the replayed rules carry `counter` expressions that load. k3s's own modprobe of that alias still warns on every boot"
      - "not explained: prod's `iptables -S` -> `iptables: Incompatible with this kernel` (iptables-nft maps errno 0 to that text, i.e. a userspace parse failure, not a kernel errno); not reproduced on the market network (no shell there) -- re-read on prod after the rebuilt image ships"
