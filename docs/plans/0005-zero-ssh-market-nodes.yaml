plan: 0005-zero-ssh-market-nodes
written: 2026-10-07
source: >
  Decided with the user on 2026-10-07 in a question-by-question session after prod was found pinned
  at six market nodes for 7.5 idle hours. goal.txt carries the same content in compressed form.
state_rules:
  - TypeScript lives in this repository (decided by the user 2026-10-12): the closure's ten repositories were vendored with their history under ts/<repository>/ and the originals are frozen; a path this plan names under ts/ is changed here, never in the original.
  - This file is the only state. Every step updates status and evidence.
  - status is one of todo, doing, done, blocked.
  - An item is done only when its evidence is recorded (commit SHAs, test names watched to fail and
    then pass, prod or GitLab readings with UTC timestamps).
  - Open items are mirrored in NEXT.yaml.
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user.
ownership:
  owned: >
    All code in socialweb-computer-kcp, the prod deployment on socialweb.computer, the vendored
    deno-kcp market network, and the atproto-market requester libraries.
  not_owned: >
    The market protocol records and lexicons, and the core architecture: kcp in front of
    k3s --disable-agent clusters at zero nodes, with nodes only ever born through
    requester -> RFP -> bid -> accept -> cloud-init user_data. Changes there are asked first.
m3_contract:
  decided: "2026-10-07, decided by Claude, user may veto (names only; the mechanism is the user's)"
  api: "commit 0c1c7e5: ClusterLink (spec cluster/service/targetPort, status phase/endpointId/did/ticket/message), NodeClaim.status.grant {issuer, subject, audience, role}; NodeClaim schema revision 3"
  links:
    - "one ClusterLink per tenant cluster per service, named <clusterKey>-apiserver and <clusterKey>-openbao, in the cluster's home workspace; spec and status written by the provider only"
    - "each is a dumbpipe listen-tcp process-group component started after k3s, forwarding to the k3s apiserver port or the cluster OpenBao port on loopback"
    - "iroh secret key per link generated once and kept in the cluster OpenBao, KV v2 mount socialweb-links, path <service>; dumbpipe gets it as IROH_SECRET; the public key is published as did:key (multicodec ed25519-pub 0xed01, base58btc, z prefix)"
  node_secrets:
    - "the provider writes KV v2 mount socialweb-nodes, path <nodeName>: token, nodePassword, serverCA, apiserverTicket, advertiseAddress, apiserverPort; deleted at release"
    - "policy node-<nodeName>: read on socialweb-nodes/data/<nodeName> only"
  jwt:
    - "the door writes status.grant at accept from the winning bid's grant (issuer, subject) plus audience socialweb.computer/node/<clusterKey>/<nodeName>"
    - "the provider ensures JWT auth mount jwt-<first 12 hex of sha256(issuer)> with oidc_discovery_url = issuer, and role <nodeName> with bound_subject, bound_audiences, user_claim sub, token_ttl 5m, token_policies node-<nodeName>; role and policy deleted at release"
  guest:
    - "the --secrets capability delivers /etc/socialweb/node/openbao-ticket, /etc/socialweb/node/openbao-ca.pem and /etc/socialweb/node/claim.json {node, cluster, jwtMount, role, audience, kvMount, kvPath}"
    - "user_data units: socialweb-openbao-link (dumbpipe connect-tcp --addr 127.0.0.1:18200), socialweb-node-secrets (oneshot: exchange the workload token for the audience at the bidder issuer, POST /v1/auth/<jwtMount>/login, read the KV path, write files 0600), socialweb-apiserver-link (advertise address on lo, dumbpipe connect-tcp --addr <advertiseAddress>:<apiserverPort>), k3s-agent; all Restart=always; no sshd use"
    - "the cluster OpenBao serving certificate must verify as 127.0.0.1 with the delivered CA"
  door:
    - "requestCompute handlers: write contract state; at accept write status.grant; return at onSecretsFetched, then dispose capabilities; no ssh session; release only when the claim is deleted; startup never releases a live claim"
acceptance:
  where: >
    Our GitLab (inspect git log -p docs/gitlab/, ssh gitlab, $GITLAB_TOKEN, chrome devtools MCP for
    the OAuth flow) running against a cluster created through the SPA on prod.
  checks:
    - id: ACC-ZERO
      text: An idle cluster sits at 0 nodes; a pipeline scales it up; nodes scale in one by one and it returns to 0 with the control plane Ready.
      status: done
      evidence:
        - "GitLab pipeline 77 (project johnandersen777/kcp-ci-probe, branch acc-0005, runner 6 acc-kcp-tenant-spa on hat-10 with ONLY the SPA kubeconfig + socialweb-credential) on cluster acc-gitlab-0001 created through the SPA by aliceoa.bsky.social (headless OAuth login) on prod, 2026-10-08, SCALE_HOLD=0s, DEBUG_SOCIALWEB_NODE_SSH_DIR still set (key unused): 3 jobs, one per node"
        - "cluster idle at 0 nodes before the run (kubectl get nodes: No resources found 00:00:50Z); 00:04:56Z pipeline -> 00:04:59Z Provision nodes:3 -> jobs running 00:06:07-09Z; scale-in one by one: node2 cordoned+drained 00:07:12Z released 00:07:15Z (Release nodes:2), node3 00:08:11Z/00:08:13Z (Release nodes:1), node1 released 00:09:15Z Teardown nodes:0; control plane Ready throughout (10 Ready status lines at 00:09:26Z, 0 nodes)"
        - "owed: the same run with the debug key off (final configuration)"
        - "FINAL CONFIGURATION: GitLab pipeline 78 (project johnandersen777/kcp-ci-probe branch acc-0005, runner 6 on hat-10 holding only the SPA kubeconfig + socialweb-credential) on SPA-created cluster acc-gitlab-0001, prod 2026-10-08, DEBUG_SOCIALWEB_NODE_SSH_DIR unset (container.env), SCALE_HOLD=0s, scope refresher deployed"
        - "0 nodes before (No resources found); pipeline 00:11:46Z -> Provision nodes:3 00:12:08Z -> claims Joining 00:12:39-46Z -> 3 jobs one per node; scale-in one by one: cordon+drain 00:14:29Z Release nodes:2 00:14:32Z, cordon+drain 00:15:33Z Release nodes:1 00:15:36Z, Teardown nodes:0 00:16:27Z; tenant lists no nodes after; control plane Ready"
    - id: ACC-MESH
      text: A pod on node A reaches a pod on node B, and DNS resolves on a node that does not run CoreDNS.
      status: done
      evidence:
        - "prod 2026-10-07T23:20:54Z: Deployment mesh-probe (2 replicas, required pod anti-affinity) on test-cluster-alice-0001 scaled the cluster 0 -> 2 market nodes ('Provision nodes:2'); node96 and node97 registered 23:22:30Z, Ready 23:22:31Z; pods 10.42.2.4 on node96 and 10.42.4.3 on node97"
        - "23:23:06Z kubectl exec (apiserver->kubelet over the agent tunnel) into both pods: node97 -> node96 pod IP answered by node96's httpd (HTTP 404 before its index existed), node96 -> node97 pod IP returned node97's content"
        - "23:23:16Z from the pod on node97 (CoreDNS runs on node96): resolv.conf nameserver 169.254.20.10; kubernetes.default.svc -> 10.43.0.1, mesh-probe.default.svc -> 10.43.21.222, gitlab.com resolves; wget via the Service ClusterIP returned node96's pod content"
        - "still owed: the same reading from a GitLab pipeline on an SPA-created cluster (acceptance 'where')"
        - "GitLab pipeline 77 (project johnandersen777/kcp-ci-probe, branch acc-0005, runner 6 acc-kcp-tenant-spa on hat-10 with ONLY the SPA kubeconfig + socialweb-credential) on cluster acc-gitlab-0001 created through the SPA by aliceoa.bsky.social (headless OAuth login) on prod, 2026-10-08, SCALE_HOLD=0s, DEBUG_SOCIALWEB_NODE_SSH_DIR still set (key unused): 3 jobs, one per node"
        - "probe-b on node3 at 00:06:09Z while CoreDNS ran on node2: resolv.conf nameserver 169.254.20.10 answered kubernetes.default.svc, kube-dns.kube-system.svc and gitlab.com; nslookup via the kube-dns Service 10.43.0.10 answered (pod on node3 -> CoreDNS pod on node2, cross-node)"
        - "FINAL CONFIGURATION: GitLab pipeline 78 (project johnandersen777/kcp-ci-probe branch acc-0005, runner 6 on hat-10 holding only the SPA kubeconfig + socialweb-credential) on SPA-created cluster acc-gitlab-0001, prod 2026-10-08, DEBUG_SOCIALWEB_NODE_SSH_DIR unset (container.env), SCALE_HOLD=0s, scope refresher deployed"
        - "jobs 277/278/279 all success: each resolved via node-local 169.254.20.10, via the kube-dns Service 10.43.0.10 and externally (gitlab.com); CoreDNS ran on node2 for the whole run (evicted at node2's release 00:15:33Z), so probe-a on node1 and probe-c on node3 reached the CoreDNS pod on node2 across nodes"
    - id: ACC-NOSSH
      text: Logs show zero ssh sessions to any guest for the whole run.
      status: done
      evidence:
        - "FINAL CONFIGURATION: GitLab pipeline 78 (project johnandersen777/kcp-ci-probe branch acc-0005, runner 6 on hat-10 holding only the SPA kubeconfig + socialweb-credential) on SPA-created cluster acc-gitlab-0001, prod 2026-10-08, DEBUG_SOCIALWEB_NODE_SSH_DIR unset (container.env), SCALE_HOLD=0s, scope refresher deployed"
        - "door log 00:11:40Z-00:16:30Z: 0 lines naming debug_node_ssh, sshAuthorizedKey, ssh sessions; prod container: no ssh or dumbpipe-connect processes to guests; the three guests of the run (fc-1379be663dd9-bd5c385d, -374a2854, -12381479) carry an EMPTY /root/.ssh/authorized_keys in their user_data and their consoles show no sshd connection; join path entirely OpenBao JWT over dumbpipe links (M3)"
        - "LOCAL reading (hat-8, no prod; prod acceptance stays open): TestAMarketNodeJoinsATenantClusterThroughItsOpenBaoWithNoSsh PASS 753.57s at 2026-10-07T23:55:13Z asserts it twice per run - no line of the door's log names runSession, ssh_session, pollReady, sshReady or ssh_connect, and the guest's own sshd records no Accepted, no session opened, no Failed password and no Invalid user, over a run that covered boot, the secrets fetch, the OpenBao login, the join, a control-plane restart and the release. The only sshd line the gate accepts is the guest's shell prompt and one 'Connection closed by <guest gateway> [preauth]', which is the compute provider's own TCP readiness probe of port 22, unauthenticated and pre-auth, not a session."
        - "the same reading at the claim level: the door's request carries no sshPublicKey and no sshAuthorizedKeys (node_market_test.ts 'the door asks for no ssh key and builds no ssh session'), and the debug key option DEBUG_SOCIALWEB_NODE_SSH_DIR was unset for every run of this gate"
items:
  - id: M0-BASELINE
    milestone: M0
    title: Measured baseline delta so a cluster holding only our stuff reads as nothing deployed
    decision: >
      Record the objects our installers wrote plus a hash of their live spec read back after apply;
      pods are resolved through their controller chain to a baseline workload; a baseline workload
      whose spec changed counts as intent. Chosen by the user over hand-stamping.
    status: done
    evidence:
      - "commit 65cd9d7 An idle cluster of only our own add-ons scales to zero"
      - "installer applies under field manager socialweb-addons; provider records what that manager applied with a live spec hash in the cluster's addon-baseline.json; scale.Narrow drops baseline workloads and pods whose owner is counted"
      - "tests watched to fail then pass: TestOurInstalledOperatorAloneIsNothingDeployed (demand 6 before), TestABaselineWorkloadWhoseSpecChangedIsIntent, TestATenantWorkloadBesideTheBaselineIsIntent, TestABaselineEntryNamesOneNamespace, TestTheSpecHashIsStableAndSeesAReplicaChange, TestObserveLeavesAnIdleClusterOfOurAddOnsAtNoIntent, TestTheBaselineIsWhatOurFieldManagerApplied, TestTheBaselineSurvivesARoundTripThroughItsFile; deploy/check.sh --fast green"
      - "prod 2026-10-07T16:48:28Z baseline measured: 3 ESO Deployments in default"
      - "SHAs rewritten by the user's 2026-10-08/09 history rewrite (old->current, matched by subject): 65cd9d7->d389636"
  - id: M0-DEMAND
    milestone: M0
    title: Demand stops counting a pod and its owning workload twice
    decision: A pod whose controller workload is counted is not counted again.
    status: done
    evidence:
      - "commit 65cd9d7 (same change as M0-BASELINE)"
      - "tests watched to fail then pass: TestAPodAndItsDeploymentAreOneUnitOfDemand (6, want 3), TestPodsOfACountedJobStatefulSetOrDaemonSetAreNotCountedTwice"
      - "re-verified 2026-10-10: 65cd9d7 is d389636 after the 2026-10-08/09 history rewrite. Parent d389636^ with d389636's baseline_test.go: FAIL (build: undefined KindDeployment). Behavioural mutation on a scratch HEAD worktree 03:01:30Z (Narrow's pod/owner dedupe removed): TestAPodAndItsDeploymentAreOneUnitOfDemand FAIL 'demanded 6, want 3', TestPodsOfACountedJobStatefulSetOrDaemonSetAreNotCountedTwice FAIL 'demanded 5, want 3'; unmutated HEAD a7932be: ok internal/scale"
      - "SHAs rewritten by the user's 2026-10-08/09 history rewrite (old->current, matched by subject): 65cd9d7->d389636"
  - id: M0-PROD-ZERO
    milestone: M0
    title: Prod idle cluster observed at 0 nodes with control plane Ready and no new RFPs
    decision: Proof required before M1 starts.
    status: done
    evidence:
      - "2026-10-07T16:48:30Z..16:51:37Z 96 of 96 scale passes: None, nodes 0, nothing running and no node; 0 RFPs, 0 claims, 0 no_bids"
      - "2026-10-07T16:52:07Z independent check: 111 of 111 passes in 5m None nodes 0; rfps=0 no_bids=0; tenant get nodes: No resources found; /readyz ok"
      - "re-verified 2026-10-10T02:59:16Z..03:00Z on prod: provider logged node scale action Teardown nodes 0 for test-cluster-alice-0001; test-cluster-alice-0001, acc-gitlab-0001 and acc-gitlab-0002 each list 0 nodes; bob runs 0 guests"
