      - "watched to fail (scratch mutations, restored): no guardPackages in buildUserData -> 3 FAIL in test/cloud_init_packages_test.ts and 1 in test/preinstall_manifest_test.ts; openssh-server dropped from the manifest -> 1 FAIL; the iroh skip removed -> 2 FAIL; the k3s skip removed -> 1 FAIL; the secrets start moved back to the end of runcmd -> 1 FAIL; the manifest's dumbpipe release changed to v0.40.0 -> 1 FAIL"
