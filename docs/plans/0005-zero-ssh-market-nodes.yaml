  - id: M0-TMP
    milestone: M0
    title: Delete hat-8's three dead /tmp directories, never /tmp/live-k3s-*
    decision: >
      /tmp/rfp-guests, /tmp/nodeboot-check, /tmp/nodeimage-preinstall-check only, each re-checked for
