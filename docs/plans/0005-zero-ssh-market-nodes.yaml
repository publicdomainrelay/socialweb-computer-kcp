  - id: M6-SPA-CREATE
    milestone: M6
    title: A cluster created in the SPA is reachable through its kubeconfig without operator help
    decision: >
      Found by the acceptance run 2026-10-08: (1) the door's createCluster call times out at 30 s while the
      gateway's Ensure waits for a Cluster status.URL that cannot appear, because CreateCluster sets running
      only AFTER Ensure returns; the request's cancellation then also drops ControlPlaneUp, leaving the
      cluster running=false; (2) the kcp mount child (workspace "clusters" with spec.URL + mount ref) is only
      ever created inside Ensure and only if status.URL is already set, so nothing creates it later; (3) the
      gateway talks to kcp as kcp-admin (admin.kubeconfig context root), and kcp refuses spec.URL from a
      non-privileged user ("spec.URL can only be set by system privileged users"), so even a later Ensure
      cannot create or repair the child; the operator had to create it as system:admin; (4) errForDeny maps
      every Ensure error to "the identity store could not be read" (503), hiding the real cause. Fix: set
      running before waiting; never wait for the URL in the request path (return Initializing); a reconciler
      (provider, which owns the Cluster status) creates/repairs the mount child once status.URL appears,
      with a privileged identity scoped to that write; Ensure errors keep their own message/code and are
      logged. decided by Claude, user may veto.
    status: done
    evidence:
      - "commit 9a56762: CreateCluster records spec.running FIRST on context.WithoutCancel and answers the phase it finds (Initializing is a 200, not a refusal); errForDeny maps only revocation.ErrDenyUnreadable to the identity-store message and everything else to ClusterUnavailable 'the cluster could not be prepared: <cause>', with the full error logged"
      - "commit df51a4b: Ensure stops at the Cluster CR and never reads it back or waits for status.URL; kcpclient.MountChild (one method, EnsureMountChild) creates the child or repairs an empty spec.URL, built from SOCIALWEB_CLUSTERPROVIDER_MOUNT_CONTEXT (default system:admin) in cmd/socialweb-clusterprovider; Provider.addressMount runs it on every pass right after the status write and fails the pass on a refusal; Build refuses a join without the writer (ErrNoMountChild)"
      - "tests watched to fail then pass: gateway TestCreateClusterRecordsRunningBeforeItReadsAnythingBack, TestACreateTheCallerAbandonedStillLeavesTheClusterRunning, TestCreateReportsThePhaseItFoundRatherThanRefusing, TestAnEnsureFailureKeepsItsOwnCauseAndIsLogged (FAILED: 'the identity store could not be read'); kcpclient TestEnsureStopsAtTheClusterCRAndNeverWaitsForAURL and TestEnsureCreatesTheTree (FAILED against the old wait: 'Ensure POSTed the mount child 1 time(s)', 'read the Cluster CR back 10 time(s)'), TestTheMountChildIsWrittenByItsOwnWriter (4 subtests), internal/kcpclient/context_test.go; clusterprovider TestAPassAddressesTheMountChildOnceTheCRReportsAURL, TestEveryPassRepairsTheMountChildItFinds, TestAMountChildThatCannotBeWrittenFailsThePass (FAILED against a stubbed addressMount)"
      - "deploy/check.sh --fast green at df51a4b (gofmt, build, apigen 9 files no drift, vet, staticcheck, cargo fmt/test, go test)"
      - "door unchanged: it already answers a create with the phase as data (test/cluster_api_test.ts 'the account is the proved one, never one named in the body' asserts 200 {name, phase: Initializing}) and its 30 s budget now covers a create that no longer waits"
      - "owed: a create through the SPA on prod with the mount child written by the system:admin context, and the live-gated mount proofs (internal/kcpclient/mount_child_live_test.go, internal/clusterprovider/live_mount_test.go, internal/kcpclient/live_apiserver_test.go) run against a live kcp -- they were updated but NOT RUN here"
      - "live prod 2026-10-08 after merge e27c6f6 deployed: the SPA (headless OAuth as aliceoa.bsky.social) created acc-gitlab-0002 and returned its kubeconfig 00:27:14Z->00:27:31Z with no clusterUp workaround; the provider wrote the mount child 'clusters' (spec.URL https://127.0.0.1:20029) itself, Ready 32 s after creation; from hat-10 the SPA kubeconfig + socialweb-credential reached the cluster through kcp.socialweb.computer at 00:28:45Z (~74 s after create) with no operator action (acc-gitlab-0001's child had needed a manual system:admin create)"
