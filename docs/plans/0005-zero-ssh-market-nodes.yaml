  - id: M2-CLAIM-RECEIPT
    milestone: M2
    title: NodeClaim tracks receipt and contract URIs
    decision: >
      The claim is the durable record a restarted door resumes from. decided by Claude, user may
      veto: the fulfiller drives requestCompute; onRfpSubmitted/onAccepted/onReceipt/onNetwork each
      await a status write of the full ContractState (legacy vmUri/rfpUri/acceptUri/receiptUri/
      receiptCid mirrored); after the ssh session the door reads the claim back (new
      NodeClaimStore.get) and calls releaseCompute with the state parsed from the claim. A claim
      needs release iff it has receipt + submitEventRef and contract phase != released; released
      claims keep the receipt plus release refs. Startup / not-ours / deleted claims are released by
      releaseCompute from the saved state (reason requester_restarted), replacing reapContract; still
      a reap (adopting is M3-NODE-LOSS). Released only on release.ok. Unreadable claim at run end
      defers the release to the next pass. No early return from onAccepted (would lose the receipt).
      ARCHITECTURE section 6 "The claim is the durable record a door releases from".
    status: done
    evidence:
      - "merged to main as 8af4f67 (via 444755e, 4c60f9d); door deno task test 80 passed 0 failed on main"
