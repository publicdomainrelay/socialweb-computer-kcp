  - id: M3-SECRETS-TICKET
    milestone: M3
    title: OpenBao ticket delivered through the --secrets capability
    decision: >
      Only the public portion travels through the secrets flow. Door half decided by Claude, user may
      veto (ARCHITECTURE section 9 "A market node joins through its cluster's OpenBao, never through
      ssh"): the bundle is exactly openbao-ticket (ClusterLink <clusterKey>-openbao status.ticket),
      openbao-ca.pem (read from <dirname(spec.tokenFile)>/openbao/tls/ca.crt until the provider
      publishes a path) and claim.json {node, cluster = cluster KEY, jwtMount, role = node, audience,
      kvMount, kvPath = node}; claim.json joins the bundle when the capability is granted, because
      jwtMount needs the winning issuer; status.grant {issuer, subject, audience, role} is awaited
      inside the capability's onContract, before the accept record exists; the door returns at
      onSecretsFetched (claim Joining), disposes capabilities, never returns at onAccepted, and
      releases only on claim deletion.
    status: done
    evidence:
      - "0f3a771 + b489218 (socialweb-computer-k8s only): node-market fulfiller without ssh (guest.ts, node_session_test.ts, NodeJoinDocument helpers, the door's dumbpipe download and node-apiserver-host removed); grantingCapability; ClusterLinkReader in lib/abc + createKcpClusterLinkReader in nodeclaim-kcp; accountHashOf/clusterKeyOf/nodeAudience/jwtMountName/nodeClaimDocument in socialweb-computer-k8s-common"
