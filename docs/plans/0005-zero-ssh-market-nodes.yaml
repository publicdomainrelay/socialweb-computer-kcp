  - id: M2-BID-LATENCY
    milestone: M2
    title: A first-free winner is accepted within 0.5 s of its bid, not after 6 s of policy evaluation
    decision: >
      User asked 2026-10-07 why first-free waits. Measured on prod (door log, claim node96 23:16Z):
      firstFree true, bidWindowSec 30; bid present 23:16:04.97Z, first_free_winner 23:16:11.30Z. The window
      is not the cost: BidCollector waits on allow() = decideBid + evaluateCandidate, which spent ~3 s
      silent (policy worker start, record/DID resolution) then ~3.3 s scanning the same delegated-trust
      vouch chains (badgeBlueKeys, operator vouches) three times, uncached. User 2026-10-07: caching must
      keep the policy engine generic from the execution of it. So the requester learns nothing about what
      a policy does: it mirrors the bidder's host wiring (market-bidder/mod.ts: one createScopeCache() per
      process passed to createPolicyEvaluator, firehose trust events -> scopeCache.applyEvent); the door
      creates the one ScopeCache and shares it across contracts; candidates are pre-warmed through the
      generic evaluator.scope at bidder_discovery; verdict memoization stays inside policy execution
      (runPolicy's opaque cache). Timing logs per phase. decided by Claude, user may veto.
    status: done
    evidence:
      - "merged atproto-market 87e9ebf (502a1bf timing logs, 2b4bfd1 requester scopeCache + prewarm + trust invalidation), door 0a7e9b0 (one createScopeCache per process shared by every contract)"
      - "live 2026-10-07T23:47Z: bid_decide 0 ms; bid 23:47:34.18Z -> first_free_winner 23:47:39.46Z = 5.3 s (was 6.3 s): the previous contract was 5.5 min earlier, past the 5 min positive TTL, and scope_prewarm logged at 23:47:35.7Z, after the bid, though bidder_discovery was 23:47:29.4Z. Still doing."
      - "merged 2026-10-10 onto the rewritten histories: policy-engine fast-forward to b049d54 (47fb02f one in-flight scope run per (policy, counterparty, args); b049d54 gha-lite trust lookups concurrent, once per DID); atproto-market cherry-picks cfb9a73 (refresh in place), 754658c (delegated trust concurrent), 02bb5c6 (first-free wins when the shared run lands); tests: policy-engine 52 passed, atproto-market check + 130 unit passed, bidder lock --frozen ok; door main 831a370 130 passed"
      - "live prod COLD (first contract after the 01:54Z door restart) 2026-10-10: bidder_discovery 02:01:47.648Z, scope_prewarm_done 02:01:49.242Z (1.6 s, was ~6 s), waiting_for_bids 02:01:51.120Z, first_free_winner 02:01:51.375Z: bid->winner 0.255 s cold (was 5.3-5.7 s); warm reading 2026-10-08T00:23Z 0.25 s"
