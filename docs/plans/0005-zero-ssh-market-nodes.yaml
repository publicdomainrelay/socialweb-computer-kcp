  - id: M3-BAO-SYNC
    milestone: M3
    title: The cluster OpenBao's JWT mounts, roles, policies and KV entries match the live claims, always
    decision: >
      User asked 2026-10-07 that the plans keep OpenBao backends and roles in sync with what is active.
      Read live 22:53Z: the tenant OpenBao holds 5 jwt-* mounts, one per issuer bob has had (its issuer
      is a fresh did:key relay keypair every restart), and only jwt-df356681a07e serves a live node. Rule:
      per cluster, desired = for each live (Adoptable) claim with a grant: mount jwt-<sha12(issuer)>,
      role <node>, policy node-<node>, KV socialweb-nodes/<node>. The provider reconciles actual to desired
      every confirm pass and at adoption: a role, policy or KV entry with no live claim is deleted; a
      jwt-* mount with no role left is disabled. Release keeps revoking eagerly; the reconcile is the
      backstop for restarts and crashes. Unit test against a fake OpenBao seeded with stale mounts/roles;
      live reading on prod: after a release and after a provider restart, `bao auth list` and
      `bao list auth/<m>/role` name exactly the live nodes. Plan 0007's stable bidder keys shrink the
      churn; this keeps the store honest regardless. decided by Claude, user may veto.
    status: done
    evidence:
      - 'commit 0ff704b: NodeVault.Reconcile (internal/clusterprovider/nodesecrets.go) declared as nodemarket.NodeSecretsReconciler, a sibling of NodeSecrets rather than a fourth method on it; deletes every role under a jwt-<12 hex> mount whose name is not a live node or whose mount is not that node''s grant mount, every policy named node-<node> that names no live node, every socialweb-nodes/metadata/<node> entry naming no live node, and disables a jwt-<12 hex> mount left with no role that no live grant names; creates nothing, writes nothing else, never touches a mount, policy or path outside those naming patterns, and deletes nothing when any of its three listings fails (each reports its own error out of Reconcile)'
      - 'commit 0ff704b: the provider calls it (cmd/socialweb-clusterprovider/vaultsync.go) with live = the claims it holds plus the Adoptable claims in the home workspace (liveNodeGrants), after adoptClaims at adoption (adopt.go) and on every pass (nodes.go reconcile), rate-limited to once per cluster per VaultSyncInterval (30 s); every deletion is logged at INFO with its reason (NodeVault.WithLogger, wired in main.go)'
      - 'green: internal/clusterprovider/nodesecrets_sync_test.go against a real bao server -dev (v2.6.2) and an in-test ES256 issuer, seeded with 4 stale jwt mounts (one with a stale role, one holding a live node''s role under a stale issuer, two empty), a stale policy, a stale KV entry, and one live node''s full set: TestReconcileLeavesOnlyTheLiveNodesMaterialInTheClusterVault (only the live mount/role/policy/KV remain, an approle mount, a jwt-<non-hex> mount and postgres/default/root survive, a second pass changes nothing), TestReconcileWithNoLiveNodeRemovesEveryNode, TestReconcileKeepsTheMountALiveNodesGrantNamesBeforeItsRoleIsWritten, TestReconcileDeletesNothingWhenAListFails (an httputil proxy in front of the dev vault answers every LIST with 500: Reconcile errors, names each of the three failed reads, and every role, policy and KV entry survives)'
      - 'green: cmd/socialweb-clusterprovider/vaultsync_test.go: TestAdoptionReconcilesTheClusterOpenBaoWithTheLiveClaims (adoption reconciles once with the live node and its grant; a second pass inside 30 s does not read the vault again; 30 s later it does), TestReconcileNamesEveryLiveNodeAndOnlyThose (a Released claim is not live, a claim with no grant is live with none), TestReconcileKeepsANodeTheProviderStillHoldsWithNoClaim'
      - 'mutations caught (9, each reverted): a LIST failure read as an empty list for roles, for policies and for KV; a role kept under a mount that is not its node''s grant mount; the policy naming filter dropped; the jwt-<12 hex> mount filter dropped; a mount named by a live grant disabled anyway; the rate limit removed; a Released claim counted live; the held nodes dropped from live'
      - 'docs/ARCHITECTURE.md: new section "The cluster OpenBao is reconciled against the live claims (plan 0005 M3-BAO-SYNC)"; the M3-JWT mount row now reads "disabled by the reconcile" instead of "never", and the "the mount outlives its last role" decision is superseded there'
      - 'not done: the live reading on prod (after a release and after a provider restart, bao auth list and bao list auth/<m>/role name exactly the live nodes) -- the lead deploys and reads; nothing here was deployed'
