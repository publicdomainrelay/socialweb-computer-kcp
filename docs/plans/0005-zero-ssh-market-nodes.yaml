  - id: M3-JOIN-PATH
    milestone: M3
    title: >
      A node dials both links at once, and the guest stops unpacking k3s on its way to joining
    decision: >
      Measured on prod 2026-10-07T23:47Z (M3-BOOT-TIME evidence): secrets served at uptime ~11 s,
      "fetched the join secrets" at 17.4 s, Node registered about 8 s later. The chain is serial for
      one reason -- the apiserver link's dumbpipe ticket arrives only in the KV entry the OpenBao JWT
      login reads -- and the guest's first k3s command unpacks k3s's own runtime (about 254 MiB) into
      <data-dir>/data/<sha256 of its data tarball> on a filesystem it is already booting. Three
      changes, none of them to the market protocol or the cluster design: (1) every join script prints
      its own step times off the guest's /proc/uptime, so the split reads off the console instead of
      being inferred from two timestamps 8 s apart; (2) the door delivers the apiserver link's ticket
      with the claim's advertise address and port in the secrets bundle, and
      socialweb-apiserver-link waits on setup-secrets instead of socialweb-node-secrets, so both
      dumbpipe dials are up before the agent needs either. An apiserver ticket is a capability, not a
      credential: the apiserver still refuses a connection that does not carry the k3s token, and that
      token, the node password and the server CA stay in OpenBao. The KV copy of the ticket is still
      read when the bundle does not carry one -- an older door, or a link that is not listening yet --
      so those nodes still join, serially. (3) the image build stages k3s's runtime assets into the
      rootfs, checked against the .sha256sums and .links k3s itself checks after it unpacks, with
      data/current and the data/cni plugin links written to name the guest's path rather than the
      build host's. decided by Claude, user may veto.
    status: done
    evidence:
      - "the image reading the third change rests on: debugfs on the newest market image in ~/kcp-image/out-market (sha256-52df8a09..., the one M3-BOOT-TIME measured) shows /var/lib/rancher/k3s holding agent and nothing else, so the guest unpacks the runtime itself at its first k3s command"
      - "code: 69f91cf (STEP_PROBE and per-step lines in the six join scripts), e6b5d55 (NODE_LINK_ENV_PATH, renderNodeLinkEnv and nodeLinkEnv in k8s-common; the door reads <clusterKey>-apiserver beside <clusterKey>-openbao; node-secrets keeps a bundled apiserver.env and refuses one that names another node; apiserver-link waits on setup-secrets; ARCHITECTURE invariants 13 and 29 and section 9), 460521f (a link the door cannot read is withheld like an absent one, never fatal to the claim), 4a3f516 (cmd/socialweb-nodeimage/k3sdata.go: k3sAssetDir, parseK3sAssetDir, stageK3sAssets, verifyHashes, verifyLinks, linkK3sCurrent, linkK3sCNI, called from buildRootfs after stageK3s)"
      - "tests watched to fail then pass: k3s_join_test.ts 'node-secrets keeps the apiserver link the bundle already wrote, and needs no ticket in the KV entry' (mutation: the bundle branch disabled -> 3 FAILED), 'every join script times its own steps' and 'node-secrets prints its start and done times' (mutation: the two done lines dropped -> 2 FAILED); node_market_test.ts 'the secrets bundle hands the guest the apiserver link's ticket with the OpenBao ticket' FAILED first with the four-path diff, and 'an apiserver link that is not listening', 'an apiserver ticket that would ride a unit's command line' and 'an apiserver link the door cannot read' FAILED as undefined bundle entries; k3sdata_test.go TestAnAssetDirectoryWhoseSumsDoNotMatchIsRefused and TestAnAssetDirectoryWithNoSumsAtAllIsRefused (mutation: the sums check skipped -> 2 FAILED)"
      - "k3s's own trigger, measured on the build host: k3s --debug --data-dir <stage> check-config <kernel config> prints msg=\"Asset dir /var/lib/rancher/k3s/data/5a9973ddf4c7ec074f657c06287e0e6a07a24ecafd6d326827f70ef1e95bdd2d\". k3s falls back to its default data dir before it extracts, so on a host that already has this k3s the line names a directory outside the stage; the build copies that directory in and checks it either way. A probe run of stageK3sAssets against the real directory staged it in 3.5 s, with data/current -> /var/lib/rancher/k3s/data/5a9973dd... and data/cni/{bandwidth,bridge,cni,firewall,flannel,host-local,loopback,portmap} each pointing at the guest's bin/cni, the same shape as the host's own data/cni. The probe file was scratch and is deleted"
      - "green at 4a3f516 and 460521f: socialweb-computer-k8s deno test -A test/ 125 passed (live_market_node_test.ts excluded: a worktree has no sibling org root for its ../../../atproto-market/test/fetch-interceptor.ts import), deno check hono-socialweb-computer-k8s/mod.ts exit 0, cmd/socialweb-nodeimage go test -count=1 exit 0, gofmt/go vet/staticcheck clean, deploy/check.sh --fast exit 0"
      - "not done: the lead deploys, rebuilds the image and measures. No image was built here and nothing was measured on prod. The numbers this is aimed at are the 6.4 s OpenBao link+login and the 8 s apiserver link+agent registration M3-BOOT-TIME lists as remaining; the staged assets add about 254 MiB to the image, and a rebuild that -reuse-stale answers with an older image would measure none of it"
      - "step 4 of the handoff (start the OpenBao dial before the token exchange finishes) needed no change: socialweb-openbao-link already waits only on setup-secrets, so it dials while socialweb-node-secrets, which is where the token exchange lives, is still running"
      - "the image's name does not cover the builder's own behaviour, and that is now load-bearing: internal/nodefirecracker's BuildConfig fingerprint digests the config's inputs (kernel, modules, base image, k3s binary, busybox, init binary and package, preinstall, seeded images, boot args) and not the builder's code, so an image built before this change and one built after it share a name and -present-only answers present for either. Measured while checking the deploy path (scripts/deploy-firecracker-bidder.sh --dry-run, ORG_ROOT and LOCAL_NODEIMAGE_BIN redirected): the current inputs name sha256-d1a844929f46a01f5ea06a777bbf02c340d1725b7f6ddaaa1ba5a4052a5d0d07, the store in ~/kcp-image/out-market does not hold it, and the deploy's own guard (the answered dir's basename against the shipped FINGERPRINT) refuses any other directory -reuse-stale would answer with. So the lead's rebuild does include this change, but the next builder change under the same inputs would not be visible in the name, and fixing that (an input covering the builder, or the built binary's digest) changes how every image is named and is left to the lead"
      - "live prod 2026-10-08T00:23Z (image 52df8a09 rebuilt with the k3s runtime assets after moving the stale same-named build aside; door/provider 1abe746): bundle at uptime 11.03 s, apiserver-link and openbao-link both start 11.03 s (parallel), node-secrets done 17.66 s, Node registered ~22 s, CNI 23.9 s: secrets->registered ~11 s (was ~14 s); pod->Node registered 33.6 s (was 44.2 s). Follow-ups split into M3-JOIN-FOLLOWUPS"
      - "SHAs rewritten by the user's 2026-10-08/09 history rewrite (old->current, matched by subject): 1abe746->35bb7d2 460521f->2c3bec3 4a3f516->eb85648 69f91cf->e596fb5 e6b5d55->c1178bf"
  - id: M3-JOIN-FOLLOWUPS
    milestone: M3
    title: The join's remaining waits, and an image name that changes when the builder does
    decision: >
      From the 2026-10-08T00:23Z prod reading: (1) socialweb-node-secrets starts with the bundle, fails
      because the OpenBao link has not connected, and systemd retries it 5 s later (RestartSec) -- poll the
      link inside the script at ~0.5 s for a bounded time instead; (2) Ready 00:23:46Z but the busybox pull
      began 00:24:03Z: ~16 s of pod sandbox creation (5 s in earlier runs), cause unknown -- read kubelet and
      containerd on a debug-ssh node; (3) internal/nodefirecracker's image fingerprint covers inputs, not
      the builder, so a builder-only change keeps the name and the installer ships the stale image (hit
      2026-10-08: the operator moved the old build aside to force a rebuild) -- add the nodeimage binary's
      digest (or a builder version) to the fingerprint. decided by Claude, user may veto.
    status: done
    evidence:
      - "(2) done in ee75a03. Market clusters now name --kube-scheduler-arg=config=<DataDir>/kube-scheduler.yaml, rendered pure by clusterstack.KubeSchedulerConfig/KubeSchedulerConfigPath/SchedulerKubeconfig and written before the steps are built by clusterprovider.WriteKubeSchedulerConfig (the OpenBao config's shape), with podInitialBackoffSeconds and podMaxBackoffSeconds at 1 and a clientConnection block (a --config file makes kube-scheduler IGNORE the deprecated --kubeconfig flag k3s still passes, so the block is what carries the apiserver)"
      - "(2) the flags the plan preferred do not exist here: MEASURED against k3s v1.36.4+k3s1, kube-scheduler's own --help (printed when it is handed a flag it does not know) lists --config and the deprecated --pod-max-in-unschedulable-pods-duration, and --kube-scheduler-arg=pod-initial-backoff-seconds=abcde is not rejected, so --pod-initial-backoff-seconds and --pod-max-backoff-seconds are not flags this binary defines. The file form IS read: a config of garbage bytes makes kube-scheduler exit (k3s logs `scheduler exited`) while the server stays up, so the failure is a cluster whose pods are never placed rather than one that fails to start"
      - "(2) tests, against the real binary under SOCIALWEB_LOCAL=1: TestK3sPlacesAZeroNodePodWithTheMarketSchedulerConfig creates a pod at zero nodes and requires it placed on the node that arrives (PASS 7.73 s, pod on probe-node); TestK3sPlacesNoPodWhenTheSchedulerConfigIsUnreadable is the same probe with a garbage config and requires the pod NOT placed (PASS 62.19 s), so a green acceptance result is about the file and not about a line k3s prints either way. Unit tests pin the market argv and the absence of the arg for a plain cluster; internal/clusterprovider pins where the file is written (mode 0600, same inode on a second write, nothing written for a plain cluster)"
      - "(2) what is NOT claimed: on this host a pod waiting on a node was requeued ~50 ms after the node became schedulable with the DEFAULT backoff in every shape tried (node Ready, a taint removed, a label added), so the 16 s prod reading was not reproduced here and this change bounds the worst case (a pod requeued into backoffQ waits at most 1 s) rather than an observed wait. The next reader should not treat the backoff as the measured cause of the 16 s"
      - "green at ee75a03: deploy/check.sh --fast exit 0 (gofmt, go build, apigen no drift, go vet, staticcheck, cargo fmt, cargo test, go test ./...)"
      - "(1) done in 4e5d9cf. renderNodeSecretsScript's login and KV read now go through a bounded wait on the link rather than one attempt: 120 attempts 0.5 s apart (NODE_SECRETS_LINK_ATTEMPTS, 60 s) around the curl to https://<OPENBAO_LINK_LOCAL_ADDR>/v1/..., each failed attempt printed on the console as `the OpenBao link on 127.0.0.1:18200 has not answered yet (attempt N of 120, curl exit S)`, and exit 1 after the last so systemd still owns the retry. The token exchange at the door is NOT retried: the door issued the workload identity token in accept.json before the guest existed, while the link started in the same `systemctl start --no-block` as node-secrets and its listener was not bound yet -- which is the failure the prod console recorded at 11.0 s uptime, followed by RestartSec=5 at 16.6 s"
