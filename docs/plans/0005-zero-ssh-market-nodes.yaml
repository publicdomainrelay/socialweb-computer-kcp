    status: done
    evidence:
      - "2026-10-07T16:51Z: no process cmdline or cwd referenced any of the three (own shell excluded), none written in the last hour; rfp-guests 6.6G, nodeboot-check 6.6G, nodeimage-preinstall-check 5.6G removed (its root-owned stage/ via sudo after /proc/mounts showed no mount under it)"
      - "2026-10-07T16:52:03Z /tmp 24G tmpfs at 12% (2.6G used, was 92%); all 7 /tmp/live-k3s-* untouched"
      - "re-verified 2026-10-10T03:01:44Z on hat-8: /tmp/rfp-guests, /tmp/nodeboot-check and /tmp/nodeimage-preinstall-check absent (test -e false for each); /tmp tmpfs 24G, 6.9M used"
  - id: M1-MARKET-NETWORK
    milestone: M1
    title: Vendor deno-kcp CRDs and deploy/market-network (with PR 2's bidder and bob PDS) as the live market network
    decision: >
      Vendored into this repo (user chose vendoring over building in deno-kcp). The bidder runs
      --compute-provider-firecracker with our nodeimage and nodeboot. Replaces the ad-hoc local
      dispatcher plus fake PLC harness for live tests. The bidder and requester use the in-cluster
      PLC (https://127.0.0.1:2587) and the market network's own dispatcher (relay.localhost:2588, TLS front
      for guests on 2589), never plc.directory or xrpc.fedproxy.com; the bidder runs --policy open
      because every identity is minted per run (decided by Claude, user may veto).
    status: done
    evidence:
      - "commit e997fe6 vendor deno-kcp f5b7c10c (pr-2) schemas, exports, workspace types, scripts and the market example; deploy/denokcp/vendor.json records commit and sha256 per file"
      - "commit c1451df build-provider.sh builds deno-kcp at the recorded commit against kcp-libs f6911d2 plus kcp-libs-no-default-issuer.patch (OpenBao 2.6/2.7 answer 400 'no default issuer' on an empty PKI mount; kcp-libs read only 404 as no authority)"
      - "commit fb6da3a firecracker bidder, dispatcher, TLS front, market-requester/mod.ts (runComputeContract, no ssh session), accept.sh market checks, provider --pod-timeout 24h, livegate test"
      - "commit d4448f2 guest onNetwork end to end (TLS front reads the HTTP/2 authority; requester user_data sets CURL_HOME=/root so units read the bidder's .curlrc)"
      - "commit 3e1f2c6 guest work root under /var/tmp, apply.sh refuses a work root whose firecracker socket path exceeds 107 bytes"
      - "tests watched to fail then pass: TestTheVendoredDenoKcpTreeIsExactlyItsRecord, TestTheRecordMatchesTheDenoKcpCommitItNames, TestEveryVendoredManifestDecodesAgainstTheVendoredSchemas (no vendor.json, then pass; a mutated 70-bidder.yaml fails all three); TestTheMarketNetworkRentsAFirecrackerGuestThroughTheRFPFlow (FAIL 964 s at 2026-10-07T20:09:51Z, guest socket path too long; PASS 684 s at 2026-10-07T20:22:12Z)"
      - "accept.sh on hat-8 2026-10-07: run 1 17:23Z 0/17 (OpenBao 400); run 2 17:30:42Z deno-worker bidder as upstream, accept: pass 17/17 (upstream bidder registered did:plc:lm4cljto7fyrug2xgjvsefh3 in the public plc.directory); run 3 17:45Z firecracker bidder up, RFP 403 scope filter (only-me); run 4 17:53Z bid, accept, receipt verified, guest booted, every DenoPod killed at the 5m pod timeout; runs 5-8 vm.delete 200 and guest gone, guest never got its OIDC token; run 9 19:53:16Z accept: pass 23/23, onNetwork iroh ticket 335 s after the RFP, vm.delete 200, guest container gone 2 s after release"
      - "deploy/check.sh --fast green 2026-10-07T20:23:04Z on the branch merged with main"
      - "SHAs rewritten by the user's 2026-10-08/09 history rewrite (old->current, matched by subject): 3e1f2c6->5060160 c1451df->04dece8 d4448f2->09e4f31 e997fe6->0c3dab8 fb6da3a->2d40964"
  - id: M1-MARKET-ONLY
    milestone: M1
    title: Retire clusterprovider's local firecracker and qemu substrates
    decision: >
      The market path with a local bidder covers the same market network; one node path remains. The VMM
      code survives where the bidder's nodeboot needs it. decided by deepseek executor, lead may
      veto: the subnet allocator STAYS in the composition root, because internal/materialiser
      requires it to release a cluster's range beside its ports on teardown and removing it ripples
      through materialiser, the legacy-key migrator and check-host for no behaviour a market cluster
      has; the node hosts no longer take it. decided by deepseek executor, lead may veto: the node
      record sweep keeps walking and keeps refusing to signal on a record it cannot verify, but a
      record from a retired substrate is now REPORTED and left in place rather than reaped, because
      the market path writes no record at all (a rented node is a NodeClaim) and every remaining
      record names a process whose argv this provider can no longer reconstruct.
    status: done
    evidence:
      - "commit cd12808: internal/nodeqemu deleted; internal/nodefirecracker trimmed to the image, manifest, namespace-child, fingerprint and guest-document halves the bidder's nodeboot builds and boots; SOCIALWEB_CLUSTERPROVIDER_SUBSTRATE accepts market alone and refuses firecracker/qemu by name and retirement date; the variables only the retired substrates read (FIRECRACKER, QEMU, NODE_AGENT, IMAGE_OUT_DIR, IMAGE_CONFIG, NETWORK, NODE_DISK_MIB) are refused rather than parsed; GuestDialled, GuestGateway, nodeVaultStage, the per-node network allocation, AssertGuestAdvertiseInvariant, dialFromAGuest and internal/nodevm's guest-dial helpers deleted; internal/clusterprovider's guest advertise invariant and image-config check deleted; deploy/control-plane-container's computer target and nodeimage-qemu stage, deploy/test-rig and cmd/socialweb-rig-inputs deleted; run-container.sh keeps the k8s target"
      - "tests watched to fail then pass: cmd/socialweb-clusterprovider TestTheRetiredSubstratesAreRefusedAtStartup, TestTheRetiredSubstratesAreRefusedAndNameTheirRetirement, TestNoPlacementSuppliesAProcessIdentityAnyMore, TestTheMarketSweepLeavesARetiredSubstratesRecordAlone, TestASweepLeavesARecordWhoseSubstrateItCannotRead, TestShutdownLeavesTheMarketNodesToTheNextProvider, TestTheCredentialSourceIsTheClustersOwnCA; internal/clusterstack TestAStackWithNoDialFlagValidates, TestOnlyAMarketClusterDropsFlannel; internal/portallocator dropped AssertGuestAdvertiseInvariant and AssertGuestDialAddress with no remaining caller"
      - "deploy/check.sh --fast green 2026-10-07T21:50:55Z on the branch at cd12808 (gofmt, go build, apigen no drift, go vet, staticcheck, cargo, go test ./...); go build ./... and go vet ./... clean again at b2e931a 2026-10-07T21:51:03Z"
      - "re-verified 2026-10-10: cd12808 is 9d85916, b2e931a is 5b48f5d after the history rewrite. Parent 9d85916^ with 9d85916's config_test.go/market_test.go: FAIL (build: undefined RetiredSubstratesRetiredOn). Behavioural mutation 03:01:30Z (checkPlacement's default branch returns nil): TestTheRetiredSubstratesAreRefusedAtStartup FAIL 'firecracker was accepted as a placement'; HEAD a7932be: ok cmd/socialweb-clusterprovider"
      - "SHAs rewritten by the user's 2026-10-08/09 history rewrite (old->current, matched by subject): b2e931a->5b48f5d cd12808->9d85916"
  - id: M1-AGENT-SPLIT
    milestone: M1
    title: Split socialweb-nodeagent into a static guest binary (init and agent) and a host binary (namespace and VMM runner)
    decision: >
      User suggested the split; market guests stop carrying a host half that always fails. Mapping on
      2026-10-07 showed nodeboot already re-execs ITSELF for the namespace verb, and the agent verb
      needs an identity disk only local substrates attach, so on market guests it always exits
      KCP_AGENT fatal. With M1-MARKET-ONLY the split therefore lands as: guest binary
      socialweb-nodeinit (initramfs /init only), host binary socialweb-nodeboot (unchanged); the agent
      verb, /kcp/kcpagent and kcp-agent.service are deleted, the guest joining through cloud-init
      units (M3-UNITS). Done in one change with M1-MARKET-ONLY after M1-MARKET-NETWORK proves the market
      path, because both rewrite the same files. decided by Claude, user may veto. decided by
      deepseek executor, lead may veto: the image configuration's old key names are REFUSED with a
      message naming the new ones rather than accepted for a release, and the operator's
      configurations under /home/johnandersen777/kcp-image/ were rewritten to the new names and
      fingerprinted again (the old spellings are refused, so leaving them would have made every
      build host fail).
    status: done
    evidence:
      - "commit cd12808: cmd/socialweb-nodeagent -> cmd/socialweb-nodeinit with the init verb alone; agent.go, audit.go, agent_test.go, the guest identity-disk join, LoadNodeDocument, /kcp/kcpagent and kcp-agent.service deleted; kcp-agent.service added to rootfs staleUnits so an image built on a base that carried it retires it; image config keys init_package/init_binary/init_go_flags with RefuseRenamedKeys refusing agent_package/agent_binary/agent_go_flags; every JSON config in the repo and scripts/deploy-firecracker-bidder.sh updated"
      - "image built by the real builder from the renamed configuration 2026-10-07T21:47:45Z (logs/image-build.log): fingerprint sha256-bcdfbb6824a7743d8fd4c15d1be1ad1bda35785fe97a0f1278ebfa507b98be00, stage /kcp holds guest.yaml alone, multi-user.target.wants holds no kcp unit, and the initramfs's /init is a stripped static x86-64 Go binary whose strings carry KCP_INIT fatal and 13 nodeinit markers and no KCP_AGENT marker"
      - "internal/nodefirecracker TestAnInitPackageIsRelativeToTheModuleAndNotToWhereTheReaderStands and cmd/socialweb-nodeimage TestAnImageBuiltBeforeTheRecordCoveredTheInitIsRefused, plus the input-role table renamed; fingerprint tests updated deliberately (the input's name and content are both inputs)"
      - "the market network live test was attempted twice and did NOT reach a verdict on this change: 2026-10-07T21:48Z SKIPPED (ports 2583-2589 held by an earlier session's market network), then 2026-10-07T21:55:29Z FAIL in 120 s with the MARKET NETWORK's own bring-up broken -- apply.sh failed 3/3, no OpenBao ready, no DenoPod in any workspace, the OpenBao CA unreadable, and no guest work directory ever created -- while that other session's market network came back up on the same fixed ports (ss shows the listeners again). The failure is upstream of everything this change touches: the market network never reached an RFP, so the node image, the init binary and the renamed image keys were never read. Nothing in this change is known-failing; the live reading is owed on a host with no second market network running"
      - "REOPENED 2026-10-07T22:50Z by the lead: the image bcdfbb68 above was built WITHOUT -preinstall (image.json preinstall \"\"), so its rootfs carries no cloud-init (no /etc/cloud, no cloud-init.target.wants, no /usr/bin/cloud-init; debugfs on the bidder store). Prod guest fc-1379be663dd9-4d49fee1 booted it 22:23Z, console stops after fcnet.service, no cloud-init stage, door node_claim_ended outcome network_timeout 22:43:08Z. Done needs an image built WITH preinstall-market.json, shipped, and a market guest that runs cloud-init on it"
