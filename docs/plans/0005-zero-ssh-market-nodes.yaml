  - id: M6-CLONE
    milestone: M6
    title: A CI job on a market node can fetch its repository
    decision: >
      The acceptance run used GIT_STRATEGY none: market nodes resolve public names, but the GitLab host is a
      tailnet name (gitlab.dorper-matrix.ts.net), so the runner helper cannot clone. Options: a public
      clone_url for the runner (a reverse proxy in front of GitLab's HTTPS), or reaching the tailnet from
      the cluster. User 2026-10-08: "It's a funnel" -- GitLab :8443 is a Tailscale Funnel. Measured 2026-10-10 from socialweb.computer (no tailscale): gitlab.dorper-matrix.ts.net resolves publicly (208.111.34.11) and https://gitlab.dorper-matrix.ts.net:8443/users/sign_in answers 200, so the GIT_STRATEGY none was a wrong assumption; prove a market-node job clones. decided by Claude, user may veto.
    status: done
    evidence:
