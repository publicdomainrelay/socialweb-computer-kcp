  - id: M5-CNI-READY
    milestone: M5
    title: A market node's kubelet reports NetworkReady with the bridge CNI
    decision: >
      Prod 2026-10-07 22:51-23:00Z: three market nodes joined over the no-ssh path (secrets bundle,
      OpenBao JWT login, dumbpipe apiserver link, Node registered ~75-80 s after boot) and every one stayed
      NotReady: "container runtime network not ready: NetworkReady=false reason:NetworkPluginNotReady
      message:Network plugin returns error: cni plugin not initialized", although socialweb-pod-cni wrote
      <data-dir>/agent/etc/cni/net.d/10-socialweb-bridge.conflist ~76 s after boot. The bridge CNI had never
      run under a real kubelet (M5 evidence is zero-node and unit level). Hypotheses: H4 containerd's conf
      watch was never armed because net.d did not exist when it started (with flannel off nothing creates
      it before pod-cni); H1 a plugin named by the conflist (bridge/host-local/portmap, loopback) is not in
      containerd's bin_dirs; H2 containerd's conf_dir is not the dir we write; H3 the conflist is rejected.
      Isolation: socialweb-node-diagnose (2501ea9) prints crictl info's lastCNILoadStatus, confDir, binDirs
      and their contents to the console; DEBUG ssh (M3-DEBUG-SSH) for containerd's own log; a host-side
      netns test of the rendered conflist against k3s's bundled plugins (cnitool, no guest) for H1/H3; a
      unit that creates net.d before the agent for H4. The join grace (2f0ad94, 10m) is a placeholder to be
      replaced by 2x the measured register->Ready time once a node reaches Ready. decided by Claude, user
      may veto.
    status: done
    evidence:
      - "2026-10-07T22:52:55Z provider: node96 NotReady since 22:51:24Z released by the 90s loss rule; tenant Node condition read 22:58Z: KubeletNotReady cni plugin not initialized"
      - 'root cause read over the debug ssh on guest fc-1379be663dd9-48148a7e 23:11Z: k3s with --flannel-backend=none writes no cni section into containerd''s config, so crictl info shows confDir=/etc/cni/net.d binDirs=[/opt/cni/bin], lastCNILoadStatus ''no network config found in /etc/cni/net.d''; linking k3s''s bundled cni into /opt/cni/bin and the conflist into /etc/cni/net.d -> NetworkReady true and Node Ready at 23:12:04Z within seconds'
      - 'fix 3919df6 (tests watched to fail: pod-cni symlink test, path test, diagnose false test; suite 108 passed); deployed 23:15:28Z; fresh node registered 23:18:03Z Ready 23:18:04Z with no hand change'
      - 'claim->Ready 125 s on prod: apt-get update 55 s, apt install 15 s, dumbpipe 7 s, k3s install 9.5 s, bid window 6.6 s; targets in M3-BOOT-TIME'
