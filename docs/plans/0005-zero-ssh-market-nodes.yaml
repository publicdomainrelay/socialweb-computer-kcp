  - id: M3-BOOT-TIME
    milestone: M3
    title: Claim to Ready in about 30 s by baking the guest's software into the node image
    decision: >
      Measured 125 s claim->Ready on prod 2026-10-07 (M5-CNI-READY evidence); 85 s of it is the guest
      installing software at boot. (1) preinstall-market.json carries openssh-server, jq, curl, iptables and
      everything else the user_data packages lists, and the user_data skips package_update when nothing is
      missing (~70 s); (2) k3s and dumbpipe come from the node image (k3s is already a nodeimage input) or
      door-served sha256-pinned, never get.k3s.io/GitHub at boot (~16 s); (3) setup-secrets starts once the
      network is up instead of at the end of cloud-init's runcmd (~10 s). Bid window (6.6 s, policy
      bidWindowSec 8) is market policy: ask the user before changing it. decided by Claude, user may veto.
    status: done
    evidence:
      - "code: socialweb-computer-kcp bcccf22 (deploy/bidder/preinstall-market.json in the repo; scripts/deploy-firecracker-bidder.sh LOCAL_PREINSTALL defaults to it; socialweb-computer-k8s/test/preinstall_manifest_test.ts; node_network_test.ts reads the guard), 8cd8e12 (the dumbpipe run unpacks into a directory of its own, so tar never has to set the mode of /tmp); atproto-market d20612d (lib/common/cloud-init-common/mod.ts: packagesGuardCommand + guardPackages in buildUserData, package_update in UserDataPatch, the k3s and dumbpipe skip paths, the secrets module runcmd -> runcmdPrepend; test/cloud_init_packages_test.ts, test/cloud_init_baked_binaries_test.ts; cloud-init fixtures regenerated)"
      - "the manifest carries cloud-init, jq, unzip, ca-certificates (what the file already held) plus curl, iptables, openssh-server and tar, and a run that installs sha256-pinned dumbpipe (x86_64 9ac5e71983eba4cf4f47e92e4694dad0f0133abba4f14dd2a2a8428cece88fef, aarch64 8cd099afe80c69ac58bfbc975b28e29d41caea141f3dd396457345a739836a0e) at /usr/local/bin/dumbpipe with its release written to /usr/local/bin/dumbpipe.version. Every name in the door's user_data (iroh, k3s, k3s-join, secrets) is covered: openssh-server, jq, curl, iptables"
      - "the composed document no longer has a packages list at all: cloud-init's own module is what runs apt-get update on every boot whatever the image holds. The packages become one runcmd step at the head of the document -- dpkg -s per package, apt-get update and install only for the missing ones -- so a node image that carries them does no apt at all and a container or droplet guest nothing was baked for still installs what it needs (test/cloud_init_packages_test.ts: 6 tests, including the ordering against the steps that need jq and curl and a name that is not a package name refused rather than put in a shell command)"
      - "k3s: setup-k3s.sh skips get.k3s.io when /usr/local/bin/k3s --version reports v1.36.4+k3s1. The node image stages the pinned release at exactly that path (k3s_binary in nodeimage-market.json, staged by cmd/socialweb-nodeimage rootfs.go:214), and the build host's /usr/local/bin/k3s reports v1.36.4+k3s1. dumbpipe: dumbpipe has no --version flag (checked against the real v0.39.0 archive: 'error: unexpected argument --version found'), so the skip reads /usr/local/bin/dumbpipe.version, which the preinstall run is what writes; a caller that pins another release through ctx.dumbpipeVersion gets a guest that installs that one. Decision: dumbpipe rides the preinstall manifest's runs rather than a new nodeimage config key, because the builder refuses a config whose required keys are unset and the market config lives outside every checkout (~/kcp-image/nodeimage-market.json), so a new required key would refuse the next build"
