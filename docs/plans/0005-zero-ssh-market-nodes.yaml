      - "(1) the other join script that dials a just-started link needed no change: the k3s agent dials the apiserver link, and a k3s agent that cannot complete the bootstrap against the address it dials LOOPS on `failed to get CA certs` rather than exiting (internal/versions/versions.json, the k3s v1.36.4+k3s1 invariant, MEASURED -- the same measurement that records a node dialing the wrong port looping), with Restart=always/RestartSec=5 and StartLimitIntervalSec=0 behind it on every join unit; socialweb-pod-cni already waits for the Node to register with its own bounded retry (CNI_WAIT_ATTEMPTS x 2 s), and meshd is a daemon k3s's own API serves rather than a dialer of the link. dumbpipe's listener ordering is not observable on this host (dumbpipe exists only in the guest), so what is claimed here is the agent's tolerance, not the link's bind order"
