  - id: M2-BOOTSTRAP-LAYER
    milestone: M2
    title: "The bootstrap layer - kcp's store, kine, slot(s), front and the core: installed systemd units in production, devsup units in dev, up before kcp exists"
    depends_on: [M2-KCP-PORT0, M1-DEV-INSTANCE, M1-INSTALL]
    decision: >
      Decided by the user 2026-10-12: kcp, its kine and its store cannot be supervised by kcp itself, so in
      production systemd runs them as installed units and in dev the core's devsup runs them before kcp
      exists; everything else goes through kcp (HostProcess, M2-HOSTPROCESS-KIND); instances nest as kcp
      workspaces (one kcp per application instance; principle). The bootstrap layer is per APPLICATION
      INSTANCE, not per machine: each instance brings up its own kcp's store, kine, slot(s) and front, and
      several instances' bootstrap layers sit side by side on one host sharing nothing but the machine.
      Decided by Claude, user may veto: the bootstrap layer is exactly
      {kcp store (gateway: the pg unit; bidder: none), kine unit(s), kcp slot unit(s), the kcp front, the
      core unit itself} and is defined by ONE table, internal/bootstrap, per role: gateway = socialweb-kcp-gw-pg,
      socialweb-kcp-gw-kine@a|b, socialweb-kcp-gw@a|b, socialweb-kcp-gw-front, socialweb-computer-gateway;
      bidder handle = socialweb-kcp-<hid>-kine@a (sqlite), socialweb-kcp-<hid>@a, socialweb-kcp-<hid>-front,
      socialweb-computer-bidder@<handle>. The table renders (a) on systemd-user to installed user unit files
      (written and removed by install/uninstall, extending M1-INSTALL's unit table; WantedBy=default.target
      so a lingering user manager brings kcp up at boot before the core; ordering store -> kine -> front ->
      slot -> core by After=/Wants=; per-instance parameters - kine port, front URL, root dir, asset paths -
      from an EnvironmentFile <state>/kcp/<unit>.env the core writes before it starts an instance, the first
      one written by install), started and stopped by name (hostsvc StartInstalled/StopUnit, never
      StartTransientUnit); and (b) on proc to devsup unit specs that `dev up` places in the same order before
      the core (devsup is the bootstrap supervisor in dev; the core is itself a devsup unit, so `dev restart
      core` replaces it while kcp keeps running). Dev profiles: quick (gateway-role kcp on kine-sqlite), market network
      and prodlike (kine -> postgres); a dev instance whose profile composes a gateway and a bidder runs two
      application instances, each with its own kcp (~1 GB together), talking to each other only over the
      atproto market protocol. The earlier `--kcp-shared-roles` (both roles on one kcp under <base>:gateway
      and <base>:bidder) is dropped: two applications never share a kcp (principle, user 2026-10-12); the
      lighter shape is nesting under a parent (M4-DEV-PARENT-KCP), where each child keeps its own kcp. Every role addresses its workspaces under the kcp-base-workspace option (root in
      production), so no role assumes it owns root and instances can later nest (M4-DEV-PARENT-KCP). Once kcp
      answers, the core writes one read-only HostProcess MIRROR per bootstrap unit (spec.placement bootstrap;
      M2-HOSTPROCESS-KIND), the kubelet static-pod/mirror-pod pattern: deleting a mirror never stops its
      unit and the supervisor never places a bootstrap unit.
