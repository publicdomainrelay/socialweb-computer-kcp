  - id: M2-OPENBAO-SERVER
    milestone: M2
    title: An OpenBao server as a reconciled resource in its own unit (placed through a HostProcess), for the gateway's root vault and the bidder's vault
    depends_on: [M1-ASSETS, M2-HOST-UNITS, M2-APPLY, M2-HOSTPROCESS-KIND]
    decision: >
      Placement (decided by the user 2026-10-12, kcp-native now): the OpenBaoServer controller owns one
      HostProcess child per server; the supervisor places it on either backend; "a new InvocationID" below is
      read from the child's status.runtime.
      Decided by the user 2026-10-11: KEEP the OpenBaoServer CRD with its own unit. Kind OpenBaoServer
      (export hostprocesses) with spec {listen, tls, storageDir, init: {shares, threshold, keysSecret}} and
      status {phase, address, initialized, sealed, runtime {backend, ref, instance, pid, startTime,
      hostBootID}}; the controller reuses internal/rootvault for init, unseal and engine layout and runs the
