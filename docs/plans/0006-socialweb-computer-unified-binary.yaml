  - id: M2-HOST-BACKEND-PROC
    milestone: M2
    title: "The proc placement backend - devsup, a per-instance parent of every unit, for dev and tests"
    depends_on: [M2-HOST-UNITS, M2-HOST-CONFORMANCE]
    decision: >
      Decided by the user 2026-10-12: dev run mode now; placement backends systemd-user (production installs)
      and proc (dev: a plain supervised process tree); in dev the core's devsup runs the bootstrap layer
      before kcp exists; the host-backend option is required with no default. Decided by Claude, user may
      veto (dev-run-mode.md 3(a2), 4.6; its measurement section 6): `socialweb-computer internal devsup
      --state <state>/sup --socket <rt>/sup.sock [--die-with <pid>]` is the real parent of every unit (reads
      each exit by wait4, so Result/ExecMainCode/ExecMainStatus, CollectMode=inactive, ResetFailed and
      Restart=on-failure|always behave like systemd's), sets PR_SET_CHILD_SUBREAPER (a descendant that leaves
      its unit's process group is reparented to devsup and attributed by the inherited SWC_UNIT=<name>; killed
      if its unit is not active - the KillMode=control-group emulation), starts each unit in its own process
      group with Pdeathsig SIGKILL from a locked OS thread, stdout/stderr to the Output files, Env, WorkDir
      and a fresh 128-bit InvocationID. Stop = KillSignal to -pgid and every attributed descendant (snapshot
      from /proc/<pid>/task/*/children first), wait StopTimeout, then SIGKILL the same set. Identity/Check use
      the existing pin sequence; GetUnitByPIDFD is replaced by "pid in the unit's pgid or attributed to it",
      answered by devsup. Slice is a label and StopSlice stops nested slices by dash prefix; After/Wants are
      validated and advisory; Watch streams unit state changes; an fd store holds a listening fd a unit
      hands it and passes it back with LISTEN_FDS (Capabilities().FDStore); PrivateHostname is the
      `internal ns-exec` one-shot (user+UTS namespace, sethostname, optional bind of <state>/rancher over
      /etc/rancher, execve; M3-CP-SLOTS). State <state>/sup/units/<name>.json {spec, InvocationID, pid, pgid,
      leader ticks, bootID, devsup instance, last Result}; after a devsup crash the next devsup sweeps
      leftovers by the safe pgid rule (signal -pgid only when the leader pid has the recorded ticks, or no
      process has pid == pgid but the group still has members) before accepting calls. Client:
      internal/hostsvc/proc_linux.go over the socket. Interface changes on hostsvc (both backends): Open(ctx,
      Config{Backend, UnitPrefix, SystemdPrivateSocket, ProcSocket}) refuses an empty Backend (no default,
      no probing); Capabilities {Backend, EnforcesLimits, OOMKillReported, FDStore, PrivateHostname, Journal};
      Watch(prefix); StopSlice(slice); UnitSpec.Restart, PrivateHostname, FDStore; Identity.Manager (systemd:
      the user manager's InvocationID; proc: devsup's instance id) so a manager restart is told apart from a
      unit restart; every status records runtime.backend, and a unit placed by one backend is never adopted
      by the other (Lost(IdentityMismatch) naming both). Not enforced on proc and declared by
      Capabilities().EnforcesLimits=false: MemoryMax, MemorySwapMax, TasksMax, CPUQuota, CPUWeight, OOMPolicy
      (a VM's memory stays capped by firecracker's machine-config). Cross-OS: proc_linux.go first; stubs
      return ErrUnsupported (Windows Job Objects, darwin kqueue NOTE_EXIT are plans 0011/0012).
    files: ["internal/devsup/ (server)", "internal/hostsvc/proc_linux.go (client)", "internal/hostsvc/hostsvc.go (Backend, Capabilities, Config, Open, Watch, StopSlice, Restart, PrivateHostname, FDStore, Identity.Manager)", "internal/hostsvc/systemd_linux.go (the same additions on systemd-user)", "cmd/socialweb-computer internal devsup, internal ns-exec"]
    test_first: >
      The proc half of M2-HOST-CONFORMANCE red against a stub, plus
      TestADevsupCrashLeavesNoProcessAndTheNextDevsupSweepsByLeaderTicks,
      TestAPgidWhoseLeaderPidWasReusedIsNeverSignalled, TestDieWithStopsEverythingWhenTheWatchedPidExits,
      TestAnOrphanReparentedToDevsupIsKilledWhenItsUnitIsInactive, TestOpenRefusesAnEmptyBackend,
      TestAUnitPlacedByOneBackendIsLostOnTheOther. Stand-ins only, no root, no systemd.
    done_when: "the proc half of the contract suite green in check.sh --fast; readings of a devsup crash and sweep recorded."
    risks:
      - "devsup is a resident process of ours that is pasta's parent in dev; it is outside every unit's process group (as systemd is outside a unit's cgroup), so the VM tree audit stays meaningful (M2-VM-TREE-AUDIT is made backend-aware)."
      - "Pdeathsig fires when the creating THREAD exits; devsup keeps the locked-thread trick of processrunner.go:138-147."
    status: done
    evidence:
