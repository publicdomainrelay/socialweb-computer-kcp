  - id: M3-CP-CONTINUITY
    milestone: M3
    kcp_use: "traditional-exception (virtual Kubernetes clusters project; principle)"
    title: Control-plane continuity across upgrades and restarts of the finished system, proved end to end on the market network
    depends_on: [M3-CLUSTER-UNITS, M3-APISERVER-FRONT, M3-CP-SLOTS, M3-LINK-HANDOVER, M2-POSTGRES, M3-HOST-INSTALL, M3-KCP-ROLL, "0007:M3-NODE-LOSS-CLOCK", "0007:M6-CLAIM-RESUME"]
    decision: >
      Decided by the user 2026-10-12: continuity is planned only for upgrades of the finished system (no
      cutover, no container); tenant control-plane upgrades are blue/green behind a per-cluster front. The
      user's goal (2026-10-11): the gateway durably tracks which clusters own which market-rented VMs, so
      after any restart or upgrade the nodes re-join their control planes, with zero downtime for clusters.
      Ownership model, decided by Claude, user may veto (control-plane-handover.md 7): the owner of a VM is
      exactly one NodeClaim (claim name = tenant Node name = guest vmName; market records are evidence, the
      claim is the index); the owner of a control plane is the host (member units + controlplane.json +
      leases.json; the Cluster CR is desired state and status mirror); join material is the cluster vault,
      keyed by claim name, link keys never regenerated; liveness is the tenant Node judged by the rebased
