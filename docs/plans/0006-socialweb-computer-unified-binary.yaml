source: >
  The user's request of 2026-10-07: take the test setup (the vendored deno-kcp market network) and expand it
  into a prod environment, so one Go binary, socialweb-computer, is the entrypoint for the whole stack;
  it runs kcp and does Go-programmatic kubectl-apply-equivalents of templated YAML held in an embed.FS; it
  supports `socialweb-computer run {request,bidder,gateway ssh}` and `socialweb-computer serve gateway kcp`;
  Go and TypeScript are both first class, with the TypeScript codebase shipped inside the binary in the
  style of sshai's policy_engine. The user then decided (2026-10-07): ONE binary; kcp binds port 0 and
  reports the bound port; no container at runtime, with postgres and everything else the container
  supplied embedded and driven by CRDs; the prod deploy is fresh with no rehearsal (run by Claude, user 2026-10-12); the core binary
  and its deno processes must be upgradable while VMs keep running. On 2026-10-11 the user decided: this
  plan executes on Linux only and builds the cross-OS seams (Windows is plan 0011, macOS plan 0012); VMs
  survive a core crash, upgrade and logout, a reboot is Lost; no socialweb-computer code is in a running
  VM's process tree; the gateway and the bidder each live in the USER manager of a lingering account; the
  in-process kcp of 2026-10-07 is re-opened and decided after the M0 spike, both routes carried. On
  2026-10-12 the user decided: no backwards compatibility, migration, cutover, rollback or prod-downtime
  planning until the finished solution exists (the 2026-10-07 "user runs the prod cutover" becomes a fresh
  deploy of the finished binary); the gateway runs no containers; tenant control-plane upgrades are
  blue/green behind a per-cluster front, each cluster a systemd slice of member units; kcp runs out of
  process as blue/green slot units on kine -> a dedicated postgres behind our own front on 127.0.0.1:6443;
  production setup is one explicit root command, `socialweb-computer install bidder|gateway`, and systemd
  is for production installs only; the dev run mode is kcp-native now (HostProcess objects placed by an
  in-binary supervisor on the systemd-user or proc backend, a bootstrap layer below kcp, one kcp per
  application instance; docs/research/2026-10-11-vm-lifecycle/dev-run-mode.md); a bidder's kcp is one slot on
  kine-sqlite, blue/green kcp slots are the gateway's only. This plan
  holds the Go binary, kcp, assets, the install and upgrade layout, host processes as units and reconciled
  resources, programmatic apply, the gateway composition, control-plane continuity across upgrades, the
  build and the fresh prod deploy. The embedded deno,
  the TypeScript closure and DenoPods are plan 0008; the compute provider and VM lifecycle are plan 0007.
principle:
  stated: >
    Decided by the user 2026-10-12 (user-decisions.md): "what we are doing is a paradigm shift, we are using
    kcp (the kubernetes control plane) as a core part of applications, it's probably not how it's
    traditionally used. With the exception of our virtual kubernetes clusters project that is a more
    traditional usage of it." This is the ORGANIZING PRINCIPLE of plans 0006, 0007 and 0008; every item is
    read through it, and an item whose wording contradicts it is wrong, not the principle.
  rules:
    - "An application instance (a bidder handle, a requester `run request`, the gateway, a market network, a dev instance) = its own kcp + a manifest set + a profile. kcp belongs to the application instance, never to a machine: a host is only where instances run, and any number of instances run on one host."
    - "Application state = kcp objects in the instance's own kcp (ComputeVM, ComputeContract, NodeClaim, OpenBaoServer, Postgres, DenoPod, HostProcess, ...). A restarted core re-reads what its instance knows from there."
    - "Application components (the servers that live today inside one deno or Go process) = DenoPods and HostProcesses reconciled from those objects."
    - "Modes = profiles over ONE manifest set. Example: a bidder in OAuth QR mode against a real account has no PDS pod; a bidder in the market network has its own PDS pod. A mode is never a second code path or a second manifest set."
    - "Composition = applying manifest sets into an instance, or nesting instances as workspaces (M4-DEV-PARENT-KCP: a parent's workspace holds a child instance's HostProcess objects; the child keeps its own kcp). A market network or a dev instance is a composition of application instances."
    - "Applications talk to each other ONLY over the atproto market protocol (records, XRPC, the relay, the ingress proxy), never by sharing a kcp: no application reads or writes another instance's objects, and no two applications are placed on one kcp."
    - "The market network (deploy/market-network) is the seed of this model and the vehicle for parallel workstreams (state rule 'market network per workstream')."
    - "The ONLY traditional use of kcp is the virtual Kubernetes clusters project: tenant k3s --disable-agent control planes fronted by kcp (clusterprovider, socialweb-computer-k8s, NodeClaims). Its items carry `kcp_use: traditional-exception` (here M2-POSTGRES, M3-CLUSTER-UNITS, M3-APISERVER-FRONT, M3-CP-SLOTS, M3-LINK-HANDOVER, M3-BAO-SYNC, M3-CP-CONTINUITY; plan 0007 M3-NODE-LOSS-CLOCK, M6-CLAIM-RESUME, M6-GATEWAY-REPOPULATE, M6-NOSSH-JOIN). Even there the gateway's own kcp is still one application instance's kcp."
  about_the_machine: >
    What stays about the machine, because it is where an instance runs and not what it is: /dev/kvm and the
    kvm group, the systemd user manager and its units (production placement only), `install`, the host
    contract (check-host), and the bootstrap layer that runs an instance's kcp itself (M2-BOOTSTRAP-LAYER).
  port0_rule: >
    Every listener behind the edge binds port 0 and reports its bound address into its own kcp object's
    status: a DenoPod's runner reads the pod's port file (<runDir>/port-bound-to, written by createServe's
    onListen) and records status.address (port-audit.md ranked blocker 1 = B2; 0008 M1-MARKET-NETWORK-PARALLEL); a
    HostProcess's address is read back from its single listening socket (hostsvc.ListenPort, M2-KCP-STORE)
    and written to its status; kcp slots, kines and fronts likewise (M2-KCP-PORT0). Peers resolve each other
    by service name through kcp (the servicenames table built from status.address), so an address is
    application state in kcp, never config. Reasons: N instances per machine; no allocator and no
    bind-close-rebind race; nesting (a child instance needs no port plan from its parent); blue/green slots
    (a new slot binds a fresh port beside the old); isolation (an application learns addresses only from
    its own kcp, so it can never reach another instance's components by accident). Exception: only stable
    public edge entry points keep known addresses - caddy on 443 and an application's front that caddy
    proxies to (the gateway's kcp front 127.0.0.1:6443, M2-KCP-FRONT; the door's 8788, 0008
    M3-DOOR-DENOPOD), each listed with its reason in deploy/edge-ports.yaml. Leases (M1-PORT-LEASE-INSTANCE)
    remain only for ports that must stay stable inside one instance across restarts (a tenant cluster's
    front port and link UDP ports, the virtual-clusters exception) and are recorded in that instance's kcp.
    Enforced by M1-NO-FIXED-PORTS.
  decomposition:
    folded: >
      2026-10-12 (fifth fold) from docs/research/2026-10-11-vm-lifecycle/multi-server-to-kcp.md and the user's
      answers to its section 7 (user-decisions.md, 2026-10-12). Where the research and the user differ, the
      user's answer is what is written here.
    rules:
      - "Root objects: each application is ONE root object in its own kcp - MarketBidder, MarketRequester, Gateway or MarketNetwork (M2-APP-CONTROLLER) - whose spec carries the application's options and profile and whose status aggregates its children's readiness, DID and reported listeners. The core renders the profile into owned children; a profile switch deletes what the new profile omits."
      - "STRICT kcp per application (decided by the user 2026-10-12): every application instance has its own kcp everywhere, including inside a market network. A market network is itself an application, MarketNetwork: its kcp runs the shared atproto services (PLC, relay, dispatchers, PDSes, the QR relay) as its own DenoPods and holds each child application's bootstrap layer as HostProcess objects; it composes a child by applying the child's root object into the child's OWN kcp. No two applications share a kcp. The research's nested-workspace market network (apps as workspaces of one kcp) is rejected."
      - "Cross-application discovery (decided by the user 2026-10-12): only through values the composer (MarketNetwork) copies onto a child's root object - the MarketNetwork value (PLC URL, ingress host, relay and firehose URLs, QR origin, guest TLS URL, CA reference) and any peer value a profile names. The DNS shim resolves only names of its own application."
      - "Every CLI option stays (decided by the user 2026-10-12): every option hono-bidder and request-vm-ssh support today keeps working, transformed into a root-object field or a profile; an option may be removed only when it selects a legacy (non-iroh) guest transport, with that reason (option-coverage test in M2-APP-CONTROLLER). Interactive sign-in is an object, MarketIdentity (0007 M1-MARKET-IDENTITY): it sets the sign-in up and reports what the user must do (URL to visit, association to approve, session expired) in status, which the foreground CLI renders; tests complete it by driving hono-pds's OAuth session minting. The ephemeral-PDS mode (in-process repo + association records) stays for the bidder and the requester."
      - "kcp only (decided by the user 2026-10-12): no standalone `deno run hono-bidder` or `request-vm-ssh` without kcp; every run goes through socialweb-computer and kcp. The TypeScript CLIs become DenoPod entries that refuse to start outside one, from the item that deletes the launcher they serve today (0007 M5-RUN-BIDDER, 0008 M4-RUN-REQUEST), so production keeps running until then. The TypeScript in-process harnesses stay as library tests of the same composer (decided by Claude, user may veto)."
      - "Requester (decided by the user 2026-10-12): a fresh kcp per `run request` invocation; its state dir (kcp root + vault under state/<invocation>) persists, and `run request release|resume <name>` restarts that same kcp to finish the contract (0008 M4-RUN-REQUEST)."
      - "Secrets (decided by the user 2026-10-12): OAuth sessions and every key (repo key, relay keypairs, OIDC JWK, requester key, door keys, per-claim keys) live in the application's own OpenBao, never in kcp Secrets; kcp objects hold references only."
      - "Guest transports (decided by the user 2026-10-12): iroh only. The ssh gateway is ported to reach guests over iroh first (0008 M1-SSH-GATEWAY-IROH), then every non-iroh guest transport is stripped (0008 M1-STRIP-LEGACY-TRANSPORTS): the cloud-init-common tunnel, fedproxy-ssh, fedproxy-web and wootty modules, websocat ProxyCommand paths, relay-fqdn guest addresses and the guest JSR registry."
      - "Components (decided by the user 2026-10-12): the bidder's guest-facing endpoints (OIDC issuer, /v1/on-network, behind the provider relay) become their own DenoPods after 0007 M4-BIDDER-VAULT and M3-OIDC-ISSUER-INSTANCE (0007 M5-BIDDER-COMPONENTS). The door's node fulfiller stays in the door DenoPod for now and is revisited after 0007 M6-CLAIM-RESUME (decided by Claude, user may veto; 0008 M3-DOOR-STATE-VAULT)."
      - "Every listener reports into status (0008 M2-DENOPOD-LISTENERS: tcp, unix and relay ingress URLs in DenoPod.status.listeners), so no test or peer scrapes stdout for a DID, a port or a readiness line."
state_rules:
  - TypeScript lives in this repository (decided by the user 2026-10-12): the closure's ten repositories were vendored with their history under ts/<repository>/ and the originals are frozen; a path this plan names under ts/ is changed here, never in the original.
  - Item status (todo, doing, done, blocked) lives here; the git history is the evidence. No evidence lists are added (user, 2026-10-12).
  - status is one of todo, doing, done, blocked.
  - An item is done when its done_when holds on main; the commits say how.
  - Open items are mirrored in NEXT.yaml (P6-*).
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user; one marked
    "decided by the user 2026-10-07", "decided by the user 2026-10-11" or "decided by the user 2026-10-12"
    was.
  - >
    No backwards compatibility (decided by the user 2026-10-12): no item plans a migration of container-era
    state, a cutover, a rollback to the container, or prod downtime handling until the finished solution
    exists. Continuity is planned only for upgrades of the finished system (M3-CP-CONTINUITY).
  - >
    An item names its dependencies in depends_on; an item may not start while one of them is not done.
    Cross-plan dependencies are written <plan>:<item id>. Exception (user-approved 2026-10-12): an item with
    a `variant_dependencies` field may start the variant that field names as unblocked before the
    dependencies listed against other variants are done; the item is done only when every variant is.
    Used by M2-KCP-STORE and M2-KCP-SLOTS for the `binary-base` vertical slice (execution_order).
  - >
    kcp route (decided by the user 2026-10-11: decide after the M0 spike, carry both paths). An item whose
    decision says "route: in-process" or "route: out-of-process" is built only on the route M0-KCP-SPIKE's
    recorded choice names; the item of the other route is closed done with the evidence "route not chosen:
    <M0-KCP-SPIKE evidence ref>" and nothing is built for it. Items with no route tag are built on either.
    Resolved 2026-10-12: the user chose out-of-process (M0-KCP-SPIKE evidence); M1-K8S-FORK and
    M1-KCP-INPROC are closed under this rule, and no open item depends on them.
  - >
    systemd is for production installs only and the dev run mode is kcp-native now (decided by the user
    2026-10-12, overriding dev-run-mode.md's phasing). Long-lived host processes are HostProcess objects in
    kcp reconciled by an in-binary supervisor (M2-HOSTPROCESS-KIND) onto a placement backend: systemd-user
    (production installs, M2-HOST-UNITS) or proc (dev and tests: a plain supervised process tree under the
    per-instance devsup, M2-HOST-BACKEND-PROC); ComputeVMs, kcp slots and tenant cluster members are placed
    through it. The BOOTSTRAP LAYER (M2-BOOTSTRAP-LAYER) is the one exception, because kcp cannot supervise
    itself: kcp's store, its kine, its slot(s), its front and the core run as installed systemd units in
    production and under devsup in dev, before kcp exists; once kcp is up they are mirrored into it as
    read-only HostProcess records. The `host-backend` option is required with no default (install writes
    systemd-user, every dev verb and test harness passes proc). Accepted dev defaults: gateway kcp store
    sqlite for quick runs, postgres for the market network and prod-like profiles; the k3s node password through a
    per-instance user-namespace bind-mount (no root); AppArmor in dev is report-only; one uid for every role
    in dev. Every item that starts a long-lived process states which backend(s) its tests run on; an item
    whose live tests run only under systemd-user says so.
  - >
    Every org repo works on `main` and is pushed to GitHub as work lands (decided by the user 2026-10-12).
    A worktree branch is merged to its repo's main and pushed when its item (or a red-first test step of it)
    lands; nothing is left committed-but-unpushed, in this repo or in a sibling (atproto-market,
    hono-compute-provider, typescript-helpers, did-key-associator, socialweb-computer-k8s).
  - >
    Order of work: execution_order below (and NEXT.yaml execution_order) names the critical path, the
    first waves of startable items, the parallel worktree split and which items need live hat-8; it is
    advisory and never overrides depends_on.
  - >
    Market network per workstream (decided by the user 2026-10-12; principle above). Every workstream's live tests run
    in the task's OWN market network: a git worktree of this repository (on its own branch) brings up
    its own fully isolated atproto network - fake PLC, relay,
    PDSes, ingress proxy, bidders, requesters - through 0008 M1-MARKET-NETWORK-PARALLEL now and `dev up --profile market-network`
    (M1-DEV-INSTANCE, 0008 M4-MARKET-NETWORK-PORT) later. No workstream live test uses a real account or the
    shared real bidder. The shared real bidder (socialweb-computer-bidder@bobvmbuilder.bsky.social on
    hat-8) and alice are a FINAL SOAK only, run after the workstream's market network tests pass, never as the
    workstream's market network.
  - >
    Linux only (decided by the user 2026-10-11). Every OS-specific body lives in a GOOS-tagged file; darwin
    and windows get stubs returning ErrUnsupported until plans 0012 and 0011 replace them. check.sh proves on
    every run that GOOS=darwin and GOOS=windows build and vet (M0-XOS-GATE).
  - >
    RFP flow is the spine (org-root CLAUDE.md). This plan boots no guest by any path of its own. Live tests
    of unit and control-plane mechanics use stand-in executables in transient units (k3s, kine and postgres
    processes, never a guest). A live proof that needs a market node runs on the market network
    (internal/marketnetwork), where the node exists only because the market network's requester ran runComputeContract
    (RFP -> bid -> accept -> cloud-init user_data) against a local bidder.
ownership:
  owned: >
    All code in socialweb-computer-kcp, the prod deployment on socialweb.computer, the vendored deno-kcp
    market network, the atproto-market requester libraries, and the pinned release kcp v0.33.0 binary carried as
    an embedded asset (the 2026-10-07 decision to vendor kcp's source, staging modules and embeddedetcd is
    superseded by the user's 2026-10-12 route: no vendored kcp source and no kcp patch). hono-compute-provider
    and atproto-market may be changed by commit on main, pushed to GitHub as work lands (decided by the user
    2026-10-12; replaces "never pushed").
  not_owned: >
    The market protocol records and lexicons, and the core architecture: kcp in front of
    k3s --disable-agent clusters at zero nodes, with nodes only ever born through
    requester -> RFP -> bid -> accept -> cloud-init user_data.
research:
  measured_on: "hat-8, 2026-10-07; repo at 13349d6 (main). Lifecycle research and proofs 2026-10-09..11 against f0460fd, see vm_lifecycle_2026_10_11"
