  - id: M1-INSTALL
    milestone: M1
    title: "`socialweb-computer install bidder|gateway` - the one explicit, idempotent root step, with `uninstall`; content-addressed upgrade and rollback of the core binary"
    depends_on: [M1-ASSETS, M1-CLI]
    decision: >
      Decided by the user 2026-10-11: VMs survive a core upgrade; the gateway and bidders each live in the
      user manager of a lingering account; ONE shared lingering account (swc-bidder) for all bidder handles.
      Decided by the user 2026-10-12: production setup is ONE explicit command, `socialweb-computer install
      bidder|gateway` (the root step: account, subuid range, kvm group, linger, delegation drop-in, AppArmor
      profile, node password, every user unit); Unix accounts are never created on demand - the only
      account is the one this step creates; systemd is for production installs only (the dev run mode,
      M1-DEV-INSTANCE, needs nothing from this item; `install` refuses host-backend=proc and writes
      `host-backend: systemd-user` into the account's config.json, the only place a production default is
      set, decided by the user 2026-10-12). Decided by Claude, user may veto (dev-run-mode.md 5.4): `install
      --dry-run` prints the computed step list and changes nothing; an account that exists but has no
      install record is refused unless --adopt-account, so a typo never takes over a human's account; if
      user@<uid> already runs without kvm, install refuses and names the restart (it would stop every VM),
      never restarting it itself. Decided by Claude, user may veto (exploration A-x-upgrade,
      linux-proofs E6): (1) Layout under the
      account's state dir: bin/<sha256>/socialweb-computer, bin/current and bin/previous symlinks,
      runtime/<sha256>/ (M1-ASSETS). A unit's ExecStart names bin/current only for the core unit; anything
      the core starts (cluster member units) names the resolved bin/<sha256>/ path
      (filepath.EvalSymlinks(os.Executable()) once at start), so no rename-over ever changes code inside a
      running chain. (2) `upgrade --binary <path>`: verify the manifest and sha256 (signature later), copy to
      bin/<sha>/, run `<new> self-check` (version --json, asset extract + verify, check-host), refuse on any
      failure, retarget current atomically (symlink rename), record previous, then `systemctl --user
      restart` the core unit (gateway or bidder@<handle>). (3) `rollback` retargets current to previous and
      restarts. (4) GC of bin/<sha>/ follows M1-ASSETS' rule (never current, previous, or a path a loaded
      unit names). (5) `install gateway|bidder [--handle <h>]...` is the ONLY root step. It is idempotent:
      every step reads the current host state, compares it with the desired state and writes only on a
      difference, so a second run writes nothing, runs no side-effecting command and restarts nothing. It
      creates, in this order (each listed in a root-owned install record
      /var/lib/socialweb-computer/install-<account>.json as "created" or "found present", so uninstall
      removes only what install created):
      (a) the account - socialweb for the gateway, swc-bidder for bidders (one shared account for every
      handle) - a system user with no password and no login shell, home = its state dir; no other code path
      creates an account (run bidder, serve gateway kcp and the controllers never call useradd and never
      escalate);
      (b) bidders: ONE contiguous subordinate range for the account in BOTH /etc/subuid and /etc/subgid,
      65536 ids per VM slot x 256 slots (16,777,216 ids; --vm-slots), placed above every existing entry of
      either file, from which 0007 M2-VM-RUNTIME maps each VM unit into its own 65536-id sub-range
      (decided by the user 2026-10-12: per-VM subuid user namespaces);
      (c) bidders: membership of group kvm, BEFORE linger and before user@<uid> first starts (supplementary
      groups are fixed when the user manager starts; adding kvm later needs a user@<uid> restart, which
      kills every VM);
      (d) /etc/systemd/system/user@<uid>.service.d/socialweb-delegate.conf `Delegate=cpu memory pids`
      (written on every host - stock systemd delegates memory+pids only, linux-proofs E0 - so CPUQuota is
      enforced) and a system `systemctl daemon-reload`, before linger;
      (e) where AppArmor restricts unprivileged user namespaces (Ubuntu 24.04+:
      kernel.apparmor_restrict_unprivileged_userns=1), /etc/apparmor.d/socialweb-pasta granting userns to
      <state>/runtime/*/pasta, loaded with apparmor_parser -r (decided by the user 2026-10-11);
      (f) gateway: /etc/rancher/node/password 0600 owned by the account (the k3s invariant);
      (g) the state dir layout and the binary at bin/<sha256>/socialweb-computer with bin/current (and
      bin/previous once an upgrade happened), owned by the account;
      (h) the install-time USER unit files under the account's ~/.config/systemd/user: socialweb.slice (the
      top slice every other unit of the account hangs below by name, outside the app.slice Fedora's
      systemd-oomd watches) and the core unit - gateway: socialweb-computer-gateway.service
      (ExecStart=<state>/bin/current/socialweb-computer serve gateway kcp, Restart=always, default
      KillMode=control-group; finalised by M3-HOST-INSTALL); bidder: the template
      socialweb-computer-bidder@.service (0007 M5-RUN-BIDDER) with one enabled instance per --handle (a
      re-run with another handle adds that instance and changes nothing else); plus the BOOTSTRAP-LAYER unit
      files (decided by the user 2026-10-12: kcp, its kine and its store run as installed systemd units in
      production; the table and the files come from M2-BOOTSTRAP-LAYER, which extends this step) - gateway:
      socialweb-kcp-gw-pg.service, socialweb-kcp-gw-kine@.service and socialweb-kcp-gw@.service (instances
      a and b), socialweb-kcp-gw-front.service; bidder, per handle: socialweb-kcp-<hid>-kine@.service (one
      instance a, kine on sqlite), socialweb-kcp-<hid>@.service (one instance a) and
      socialweb-kcp-<hid>-front.service (decided by the user 2026-10-12: a bidder's kcp is one slot on
      kine-sqlite);
      (i) `loginctl enable-linger <account>` (user@<uid> first starts here, after (b)-(d));
      (j) as the account (`systemctl --user -M <account>@`): daemon-reload, enable --now the core unit(s);
      (k) check-host as the account (M2-HOST-CONTRACT); a failure exits non-zero naming the check, and a
      re-run after the fix completes from there.
      Every OTHER unit the gateway or a bidder runs is a RUNTIME transient unit placed by the in-binary
      supervisor from a HostProcess object (M2-HOSTPROCESS-KIND, decided by the user 2026-10-12) on the
      systemd-user backend over the user manager's private socket (M2-HOST-UNITS), adopted by name, never
      written as a file, gone at reboot or a user-manager restart and re-placed from its object on the core's
      next start; install creates none of them, uninstall stops all of them by the socialweb- prefix.
      Gateway: socialweb-bao-root.service (M2-OPENBAO-SERVER); per cluster socialweb-pg-<key>.service
      (M2-POSTGRES) and socialweb-cluster-<key>.slice with its socialweb-c-<key>-<member>.service members
      (M3-CLUSTER-UNITS). Bidder, per handle (hid = first 10 hex of sha256(handle)): socialweb-bao-<hid>.service
      (0007 M4-BIDDER-VAULT); socialweb-b-<hid>.slice holding socialweb-vm-<hid>-<name>.service per VM (0007
      M2-VM-RUNTIME, a HostProcess child of its ComputeVM). The bootstrap-layer units above are installed
      files, in socialweb-kcp-<owner>.slice, started at user-manager start (so kcp is back after a reboot
      before the core) and started or stopped by instance by the core during a roll. Both: check-host's
      socialweb-probe-<rand>.service, stopped when the check ends. Not units at all: deno processes and the
      TLS proxy, plain children of the core unit (0008 M2-DENOKCP-INPROC). (6) `uninstall gateway|bidder
      [--purge] [--force]` (root): refuses while a VM unit of the account is active unless --force (stopping
      one makes its VM Lost); stops and disables the core unit(s); stops every runtime unit and slice of the
      account by prefix and waits for inactive; removes the unit files; disables linger; removes the drop-in
      (daemon-reload), the AppArmor profile (apparmor_parser -R), the subuid/subgid lines, the kvm membership
      and the node password where the install record says install created them; keeps the state dir and the
      account (the durable state: vault, kcp store, keys) unless --purge, which removes both.
    files: ["internal/install/ (install_linux.go, uninstall_linux.go, record.go, subids.go; windows/darwin stubs ErrUnsupported)", "cmd/socialweb-computer install|uninstall|upgrade|rollback", "deploy/host/apparmor/socialweb-pasta (profile template)", "deploy/host/user@.service.d/socialweb-delegate.conf", "deploy/host/socialweb.slice", "deploy/host/socialweb-computer-gateway.service (first written here, finalised by M3-HOST-INSTALL)", "deploy/bidder/socialweb-computer-bidder@.service (first written here, finalised by 0007 M5-RUN-BIDDER)"]
    test_first: >
      internal/install (fake root filesystem + fake command runner): TestInstallTwiceChangesNothingTheSecondTime
      (the second run records zero writes and zero side-effecting commands, for gateway and bidder),
      TestUninstallPurgeRestoresEveryHostFileInstallTouched (passwd, group, subuid, subgid, the drop-in, the
