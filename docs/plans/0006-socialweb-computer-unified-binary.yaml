      passes proc; AppArmor in dev report-only; one uid for every role in dev). Decided by Claude, user may
      veto (dev-run-mode.md R1-R4, R8, 4.1, 4.7): instance id = <worktree basename, 16 chars>-<first 8 hex of
      sha256(realpath(worktree))>, or --instance <name>; state $XDG_STATE_HOME/socialweb-computer/dev/<id>/
      (default ~/.local/state), sockets $XDG_RUNTIME_DIR/swc/<id8>/ (0700, every socket path < 108 bytes,
      checked), a gitignored symlink <worktree>/.swc-dev -> <state> for discovery, never state inside the
      worktree (git clean, worktree remove and the 108-byte limit). `dev up [--profile quick|market network|prodlike]
      [--instance x] [--fg]`: resolve instance -> flock <state>/instance.lock -> start or adopt the
      instance's devsup (`internal devsup`, setsid so it survives the terminal; --fg keeps it in the
      foreground and Ctrl-C is `dev down`) -> place the bootstrap layer (M2-BOOTSTRAP-LAYER; before it lands,
      `dev up` places only what the caller names, stand-ins in tests) -> wait readiness -> print `dev env`.
      `dev down [--keep-state]` stops everything in reverse order within the largest stop timeout. `dev
      status` and `dev ls` read devsup or, with devsup down, the on-disk unit records. `dev logs <unit>`,
      `dev env` (KUBECONFIG, base workspace, ports, for shells and TS tools), `dev restart core [--binary
      path]` (rebuild loop: the core is replaced, every other unit adopted), `dev check` (R8 host
      prerequisites - /dev/kvm rw, unprivileged userns for pasta, the AppArmor userns restriction on Ubuntu
      24.04+, /dev/net/tun, newuidmap/newgidmap, logind KillUserProcesses - reported, never fixed). Every
      port is 0 except leases from M1-PORT-LEASE-INSTANCE. `dev` refuses uid 0; `install` refuses
      host-backend=proc (M1-INSTALL). Survival (user 2026-10-12, devsup runs the dev tree): units survive a
      core restart, crash or rebuild and are adopted; every unit dies with devsup (`dev down`, crash, kill
      -9, --die-with test pid); a host reboot is Lost(HostRebooted) as in prod. Dev adds no provisioning
      path: guests come up only through runComputeContract against the instance's bidder (RFP spine).
