    2026-10-12 (fourth fold), the user's paradigm correction: kcp is a core part of APPLICATIONS (one kcp per
    application instance, never per machine); the virtual Kubernetes clusters project is the one
    traditional use. New top-level `principle` block (with the port-0 rule) and a market-network-per-workstream state
    rule; host-topology wording about kcp restated per application instance (M1-PORT-LEASE-INSTANCE,
    M1-DEV-INSTANCE, M2-KCP-PORT0, M2-BOOTSTRAP-LAYER - `--kcp-shared-roles` dropped - M2-OPENBAO-SERVER,
    M2-HOSTPROCESS-KIND, M3-SERVE-GATEWAY-KCP, M4-DEV-PARENT-KCP, execution_order); virtual-cluster items
    tagged `kcp_use: traditional-exception`. New: M1-NO-FIXED-PORTS. No item renamed.
    2026-10-12 (fifth fold), from docs/research/2026-10-11-vm-lifecycle/multi-server-to-kcp.md (sections 2-6)
    and the user's answers to its section 7 (user-decisions.md, the 2026-10-12 lines from "(multi-server-to-kcp.md
    section 7)" on), which override the research where they differ: STRICT kcp per application, inside a
    market network too (the research's nested-workspace market network is rejected; a market network is a MarketNetwork application
    composing children that each run their own kcp); every hono-bidder and request-vm-ssh option keeps
    working kcp-native, with sign-in as an identity object; kcp only (no standalone deno CLIs); a fresh kcp per
    requester invocation with a durable state dir; OAuth sessions and keys only in the application's OpenBao;
    cross-app discovery only through values the composer copies; iroh is the only guest transport. New
    `principle.decomposition` (replaces `principle.pending`) and M2-APP-CONTROLLER. Changed: M1-CLI (app verb
    contract, `profile` option), M1-DEV-INSTANCE (`--profile market-network` = a MarketNetwork composing child
    applications with their own kcps), M3-SERVE-GATEWAY-KCP (a Gateway root object), execution_order. No item
    renamed or removed. Plans 0007 and 0008 carry the rest of the fold.
