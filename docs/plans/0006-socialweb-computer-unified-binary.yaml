  - id: M0-PG-SOURCE
    milestone: M0
    title: "Spike: where a pinned relocatable PostgreSQL 18 per linux platform comes from, for the gateway's kcp store and the tenant stores; choice and sha256 pins recorded"
    depends_on: []
    decision: >
      Decided by the user 2026-10-12: an M0 spike with a fallback. The gateway's kcp store (M2-KCP-STORE; a
      bidder's kcp is kine-sqlite and needs no postgres) and every tenant cluster store (M2-POSTGRES) run one
      pinned relocatable PostgreSQL 18 (postgres, initdb, pg_dump; no psql, M2-POSTGRES uses pgx) for
      linux/amd64 and linux/arm64, never the host's package. Candidates measured in a scratch branch on hat-8
      (stand-ins only: initdb + postgres on a unix socket, kine on top, no kcp, no guest): (1) zonky
      embedded-postgres binaries (the io.zonky.test.postgres embedded-postgres-binaries jars for linux-amd64
      and linux-arm64v8: relocatable txz inside a maven jar); (2) theseus-rs/postgresql-binaries (GitHub
      release tarballs per target triple); (3) building from source with the build-host script
      (scripts/build-postgres.sh, the same any-Linux-host script shape as 0007 M1-GUEST-IMAGE; CI calls it
      later). Recorded per candidate: provenance and how upstream builds it, whether a sha256 or signature is
      published, the 18.x minor available, size raw and zstd -19 (feeds M0-SIZE-BUDGET), the glibc floor
      (oldest distro it runs on: Ubuntu 22.04/24.04, Debian 12, Fedora 44 checked by running initdb + postgres
      + pg_dump), ICU and collation provider versions (M2-POSTGRES treats a collation change as major-class),
      whether it runs from any extraction path (relocatable: no baked prefix, share/ and lib/ found relative
      to bin/), --with-systemd absent (readiness by our pgx probe), and the time to initdb + first SELECT 1.
      Decided by Claude, user may veto: prefer a published upstream binary set with a published checksum and
      a glibc floor at or below Ubuntu 22.04; fallback = build from source with scripts/build-postgres.sh on
      any Linux host (pinned source tarball sha256, reproducible flags, ICU vendored or disabled, recorded),
      which is always available. The choice and the per-platform sha256 pins go into versions.json and this
      item's evidence; M1-ASSETS embeds the chosen set.
    files: ["scratch branch only (measurements)", "internal/versions/versions.json (postgres source, version, per-platform sha256)", "scripts/build-postgres.sh (written only if the fallback is chosen)"]
    test_first: "None (measurement). Readings: per candidate the initdb + postgres + pg_dump run on each listed distro (or container image of it, stand-in only), sizes, glibc floor, ICU version, checksum provenance."
    done_when: "the choice recorded with its sha256 pins for linux/amd64 and linux/arm64, the fallback's status recorded, and the user told the choice."
    risks:
      - "A prebuilt set whose glibc floor is newer than a target distro is refused there by check-host; the fallback build sets the floor."
      - "zonky jars are a Java ecosystem artefact; their checksums are maven's, recorded as such."
    status: done
    evidence:
