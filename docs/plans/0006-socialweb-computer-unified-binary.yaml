  - id: M4-DEV-PARENT-KCP
    milestone: M4
    title: "Later: `dev host` - a parent application instance whose root:dev:<instance> workspaces hold each child instance's HostProcess objects (kcp inside kcp; composition by nesting)"
    depends_on: [M2-HOSTPROCESS-KIND, M1-DEV-INSTANCE, M2-BOOTSTRAP-LAYER]
    decision: >
      Principle (user 2026-10-12): this is composition by nesting workspaces. The parent is itself an
      application instance (its kcp, the dev-parent manifest set, a profile) whose application state is its
      children's processes; each child keeps its OWN kcp (its slot is a HostProcess in the parent), and
      children still talk to each other only over the atproto market protocol, never through the parent's
      kcp. Decided by the user 2026-10-12: instances nest as kcp workspaces; one kcp per application instance
      now, a parent kcp for nesting is fine as a later item. Decided by Claude, user may veto (dev-run-mode.md
      4.4 N3): `dev host` runs one parent instance per user (its own bootstrap layer under its own devsup); each child
      instance's bootstrap units, including its kcp slot, become ordinary HostProcess objects in the parent's
      workspace root:dev:<instance> placed by the parent's supervisor on its devsup, so `kubectl get
      hostprocesses -A` on the parent lists every worktree's processes; a dev-instance WorkspaceType with
      limitAllowedChildren keeps instance trees from being nested into each other by mistake. Production is
      unchanged (no parent kcp); the same shape is open later for tenant clusters (members as objects in the
      cluster's home workspace).
    files: ["cmd/socialweb-computer dev host", "internal/devinstance (parent mode)", "deploy/workspacetype-dev-instance.yaml"]
    test_first: "TestAChildInstancesKcpSlotIsAHostProcessInItsParent, TestDeletingAChildInstanceWorkspaceStopsItsProcesses, TestAnInstanceTreeCannotBeNestedUnderAnotherInstance; behind livegate on proc. Red first."
    done_when: "two child instances under one parent on hat-8 listed and stopped through the parent's kcp; readings recorded."
    risks: ["A parent outage stops reconcile for every child (their units keep running under the parent's devsup)."]
    status: done
