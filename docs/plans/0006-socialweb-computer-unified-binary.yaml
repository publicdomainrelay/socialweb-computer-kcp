  - id: M3-CLUSTER-UNITS
    milestone: M3
    kcp_use: "traditional-exception (virtual Kubernetes clusters project; principle)"
    title: Each cluster is a systemd slice of member units in the gateway's user manager, ordered after its postgres unit; a core upgrade restarts none of them
    depends_on: [M2-HOST-UNITS, M2-POSTGRES, M1-INSTALL, M2-HOSTPROCESS-KIND]
    decision: >
      Third fold 2026-10-12 (decided by the user: tenant cluster members are placed through HostProcess; dev
      is kcp-native now): every member below is a HostProcess child of the cluster (placement supervisor)
      reconciled onto systemd-user in production and proc in dev; the slice is a systemd slice on
      systemd-user and a label on proc, and teardown uses Manager.StopSlice on both; port attribution reads
      unit membership through the Manager (cgroup.procs or devsup's process groups), never cgroup files
      directly. Decided by Claude, user may veto (dev-run-mode.md 5).
      Decided by the user 2026-10-11: cluster processes live in the gateway account's user manager; KEEP the
      Postgres CRD and add explicit ordering and readiness between a cluster's postgres unit and the rest of
      the cluster for start, adoption and restart. Decided by the user 2026-10-12 (replaces the 2026-10-11
      "one cluster-group unit with a resident supervisor"): each cluster is a systemd SLICE of member units,
      so blue/green control-plane upgrades (M3-APISERVER-FRONT, M3-CP-SLOTS) need no resident supervisor and
      a core upgrade restarts nothing. Decided by Claude, user may veto (control-plane-handover.md 8.1): the
      slice is socialweb-cluster-<key>.slice (the key unit-name-escaped, so a dash in it adds no slice level)
      holding one transient SERVICE per member, named socialweb-c-<key>-<member>.service: front
      (M3-APISERVER-FRONT), kine@<slot> and k3s@<slot> (slot a until M3-CP-SLOTS adds b), bao, link-apiserver,
      link-openbao, ccm, eso, esowh. Ordering: kine@<slot> and bao are After= and Wants=
      socialweb-pg-<key>.service - NOT Requires or BindsTo, so a postgres crash or restart does not
      cascade-stop the control plane; k3s@<slot> is After=/Wants= its kine@<slot>; ccm, eso and esowh
      After=/Wants= the front (or k3s@a before the front exists). Every member Restart=on-failure (links
      Restart=always, M3-LINK-HANDOVER), PropExecStart(argv, false), CollectMode=inactive. Members whose
      code is the core binary (ccm, front) name the resolved bin/<sha>/ path, so a core upgrade never
      changes code inside a running member. The reconcile loop is the supervisor (ARCHITECTURE section 5
      already says so); there is no `internal cluster-group` verb and no Pdeathsig inside the cluster (units
      own lifetime); plan 0005 M6-LIMITS' guarantee is restated as "every member is a unit of its cluster's
      slice". A host-local record <dataDir>/controlplane.json {activeSlot, slots {a, b: k3s version, kine
      version, ports, unit names, InvocationIDs}, front {port, backend}} is written by the reconciler and read
      at adoption before kcp is consulted. Start (fresh): clusterprovider ensures the Postgres object ->
      Ready{port, instance} -> starts the members in order with the pg port in their params; kine and bao
      still gate on the PostgresUp probe (ErrPostgresUnavailable kept). Adoption (core restart or upgrade)
      per member, by unit name + InvocationID + controlplane.json: active -> adopt, no write; missing or
      failed -> start that member only (record Result first, then ResetFailedUnit); pg missing -> start pg,
      members reconnect; everything missing (reboot, or the user manager restarted) -> cold start in order.
      A bao whose InvocationID changed is unsealed on the next pass (M2-OPENBAO-SERVER rule); its behaviour
      on losing its postgresql storage connection is measured here. Teardown: stop the slice, wait every
      member inactive, then stop pg. Port leases after adoption are attributed from each member unit's
      cgroup.procs, not pid cmdlines (internal/portscan), so a restarted provider never re-leases a live
      member's port. Version changes of members are M3-CP-SLOTS (k3s, kine), M3-LINK-HANDOVER (dumbpipe),
      M2-POSTGRES (postgres); ccm, eso and esowh roll by stop/start (no election, seconds without their
      loops). ARCHITECTURE section 5 "The per-cluster process group" is rewritten in the same change.
