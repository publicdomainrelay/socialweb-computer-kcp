  - id: M2-VM-TREE-AUDIT
    milestone: M2
    title: No socialweb-computer code in a running VM's process tree, audited from the unit's cgroup (systemd-user) or process group (proc)
    depends_on: [M1-ASSETS, M2-HOST-UNITS, M2-HOST-BACKEND-PROC]
    decision: >
      Backend-aware since 2026-10-12 (third fold; decided by Claude, user may veto, dev-run-mode.md 5): the
      audit lists a unit's processes through the Manager - systemd-user: cgroup.procs; proc: the unit's
      process-group members plus the descendants devsup attributes to it - and devsup itself, outside every
      unit's group, is not a member (as systemd is not in a unit's cgroup).
      Decided by the user 2026-10-11: no socialweb-computer code in a running VM's process tree; the VMM is
      launched by the service manager and our code only does one-shot prep (the tiny exec helper execve's
      away). This item builds the instrument, decided by Claude, user may veto: internal/hostsvc/treeaudit
      lists every unit with the VM prefix (socialweb-vm-* and the market network prefix socialweb-market-network-*-vm-*), reads its
      cgroup.procs, opens /proc/<pid>/exe for each process and hashes it, and passes only when the unit is
      active and every process's executable sha256 is one of the pinned VM-unit assets of the current or a
      still-referenced runtime set (pasta, firecracker); socialweb-vmexec, /bin/sh (the trampoline) and the
      core binary are failures once the unit is past Activating. Exposed as `units audit` (exit 1 naming the
      unit and the offending exe) and as a Go helper the live tests of plan 0007 call after every boot,
      restart and upgrade.
