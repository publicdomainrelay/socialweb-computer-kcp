      - "proc conformance: 12/15 red against a stub devsup 03:00:50Z, green 14 + 1 skipped (limits: proc does not enforce them, declared in Capabilities) 03:02:30Z, stable x5; wired into check.sh --fast (exit 0 on merged main)"
      - "live hat-8 03:20:42Z: two instances (kine + one kcp slot each) up in parallel, ready 11.2 s; kine/kcp bound ports read back from /proc 55/82 ms after start; core kill -9 at 03:21:07.729Z re-adopted kine and kcp 120 ms later (same pids/InvocationIDs); dev up on a running instance adopts in 0.2 s; dev down 3.4 s leaves no process/listener/socket/dir; killing devsup takes its units with it and dev down sweeps the records (TestTwoInstancesOnOneHostShareNothing 17.4 s); readings in docs/research/2026-10-11-vm-lifecycle/binary-base-readings.md"
