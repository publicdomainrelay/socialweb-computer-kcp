    (d) the dev run mode is kcp-native now: long-lived host processes are HostProcess objects reconciled by
    an in-binary supervisor on a placement backend (systemd-user for production installs, proc for dev),
    with an explicit bootstrap layer (kcp, its kine and its store, its front and the core: installed
    systemd units in production, devsup in dev) below kcp; (e) M0 spikes with fallbacks (M0-PG-SOURCE here,
