  - id: M3-SERVE-GATEWAY-KCP
    milestone: M3
    title: socialweb-computer serve gateway kcp replaces container-entrypoint.sh, on the host, kcp first
    depends_on: [M2-KCP-PORT0, M2-KCP-SLOTS, M2-KCP-FRONT, M2-KCP-STORE, M2-APPLY, M2-OPENBAO-SERVER, M3-FOLD, M3-CLUSTER-UNITS, M3-BAO-SYNC, M2-BOOTSTRAP-LAYER, M2-HOSTPROCESS-KIND, M2-APP-CONTROLLER]
    decision: >
      Third fold 2026-10-12: the kcp store, kine, front and active slot are the bootstrap layer
      (M2-BOOTSTRAP-LAYER), already started by systemd from installed units (or by devsup in dev) before the
      core runs; the core adopts them by name and only starts one that is missing, then writes their
      HostProcess mirrors and starts the supervisor (M2-HOSTPROCESS-KIND), through which the root vault,
      postgres and cluster members are placed. Runs on either backend with --host-backend required.
      Order fixed 2026-10-11 and revised 2026-10-12 for the kcp slot route (decided by Claude, user may veto;
      the 2026-10-07 order put the root vault, an object in kcp, BEFORE kcp): lock <state>/kcp/ -> the kcp
      store (adopt or start socialweb-kcp-gw-pg, then the active slot's kine; M2-KCP-STORE) -> the kcp front on
      127.0.0.1:6443 (adopt or start socialweb-kcp-gw-front; M2-KCP-FRONT) -> the active kcp slot Ready (read
      kcp-slots.json, adopt the slot by name + InvocationID, or start slot a with the shared material;
      /readyz on its own port; front backend set; M2-KCP-SLOTS) -> the provider, permission-inventory and
      hostprocesses sets (through the front with the shard-admin context) -> the root OpenBaoServer Ready
      (adopt or start the unit, unseal, apply-root) -> bootstrap-cluster when asked -> migrate -> the
      gateway (in-process) -> the TLS front (Go crypto/tls proxy replacing socat, decided by Claude, user may
      veto) -> the clusterprovider (in-process; adopts Postgres units, then each cluster's member units, M3-CLUSTER-UNITS)
      -> the door (a deno child with today's argv and env until 0008:M3-DOOR-DENOPOD moves it into a DenoPod,
      with explicit deno permissions, 0008:M2-SERVICE-TEMPLATE). kcp needs nothing from the vault and nothing
      between bao and apply-root needs kcp (exploration F8), so only a fresh gateway instance's bring-up order
      changes; in a running instance every unit is already up. Any in-process member failing ends the process with exit 1;
      the core unit (Restart=always, StartLimit tuned, M3-HOST-INSTALL) restarts it; deno children die with
      the core unit; units (kcp pg, kines, slots and front, vaults, stores, cluster member units) are adopted
      on the next start rather than restarted. No container-era state dir is opened (fresh deploy, decided
      by the user 2026-10-12).
      Fifth fold 2026-10-12 (multi-server-to-kcp.md 4.5; decided by Claude, user may veto, within the user's
      decisions of 2026-10-12): the gateway is a Gateway root object (M2-APP-CONTROLLER) with profiles prod
      and market network. serve gateway kcp applies it after the sets; its app controller renders the door DenoPod (0008
      M3-DOOR-DENOPOD), the root OpenBaoServer and one MarketIdentity (mode oauthDelegated) per door account,
      whose sessions and the door's requester key live in the root vault (0008 M3-DOOR-STATE-VAULT). The
      door's TEST_* seams (TEST_OWNER_SESSIONS_FILE, TEST_NODE_GUEST_HOST_ALIASES,
      TEST_NODE_USER_DATA_BASE_FILE; door hono-socialweb-computer-k8s/mod.ts:53-67) become values of the market network
      profile instead of env variables. In a market network the gateway is a child application of the MarketNetwork with
      its own kcp. The tenant cluster objects (Cluster, Node, ClusterLink and the tenant side of NodeClaims)
      stay the traditional exception (principle), unchanged by the application model.
    files: ["internal/stack/gatewaykcp/", "cmd/socialweb-gateway and cmd/socialweb-clusterprovider bodies moved into run(ctx, cfg)"]
    test_first: >
      TestServeGatewayKcpStartsKcpBeforeTheRootVaultAndDiesWithAnyInProcessMember (fake members record the
      order) and, behind livegate, TestServeGatewayKcpOnAnEmptyStateDirServesTheDoorAndABootstrapCluster
      followed by TestServeGatewayKcpRestartedOnItsOwnStateDirListsTheSameWorkspacesAndClaims. Red first.
    done_when: "on an empty state dir: door /api/config 200, the bootstrap cluster Ready, scale passes None nodes 0; after a restart the same workspaces, bindings and claims; no shell, kubectl, yq, socat or docker in the process tree."
    risks: ["A panic in the core ends the gateway and the clusterprovider (one address space) but not kcp: its slot, kine, pg and front are their own units and keep serving kcp.socialweb.computer across the core's restart (route decided 2026-10-12)."]
