    kcp-spike.md and kcp-blue-green.md: kcp route decided by the user = out of process as alternating
    blue/green slot units of the release kcp v0.33.0 asset, no kcp patch, no vendored kcp source.
    M0-KCP-SPIKE done; M1-K8S-FORK and M1-KCP-INPROC closed "route not chosen"; M2-KCP-UNIT -> M2-KCP-SLOTS;
    M2-KCP-PORT0 rewritten (port 0 read back from the slot's single listening socket in /proc; the embedded
    etcd and the port-file patches dropped); new M2-KCP-STORE (kine per slot -> a dedicated postgres unit),
