    M1-INSTALL, M2-KCP-UNIT, M2-HOST-CONTRACT, M2-VM-TREE-AUDIT, M3-CP-CONTINUITY.
    2026-10-12, folded from user-decisions.md (2026-10-12 lines) and control-plane-handover.md: no backwards
    compatibility, migration, cutover, rollback or prod-downtime planning until the finished solution exists,
    and the gateway runs no containers, so M5-CUTOVER becomes M5-FRESH-DEPLOY (a plain fresh deploy of the
