      (default 127.0.0.1:0; the gateway's prod config.json sets 127.0.0.1:6443); a port-0 front's bound port
      is read back like a slot's (M2-KCP-PORT0) and written to kcp-slots.json. caddy keeps
      kcp.socialweb.computer -> https://127.0.0.1:6443 unchanged: no caddy admin access for the core, no
      caddy reload by a swap (a reload cuts every upgraded stream, exec/attach included), and kcp's private key
      never leaves kcp's files. Any caddy config this repo renders or ships (scripts/deploy.sh's site, the
      M5-FRESH-DEPLOY config) pins `pki.certificate_authorities.local.install_trust: false` (Caddyfile:
      `skip_install_trust`) and never uses caddy's internal issuer (the kcp-blue-green.md section 6 incident:
      caddy installed a local CA into the system trust store through sudo). This item builds the one front
      type; M3-APISERVER-FRONT reuses it per tenant cluster.
