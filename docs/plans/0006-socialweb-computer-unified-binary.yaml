  - id: M2-KCP-STORE
    milestone: M2
    title: "kcp's own store - the gateway: one kine per slot over a dedicated postgres unit; a bidder: one kine on sqlite; both in the bootstrap layer, before kcp"
    depends_on: [M0-KCP-SPIKE, M1-ASSETS, M0-PG-SOURCE, M2-HOST-UNITS, M2-HOST-BACKEND-PROC]
    variant_dependencies:
      embedded_asset_and_postgres: "M1-ASSETS (embedded kine asset), M0-PG-SOURCE (the gateway's postgres unit), M2-HOST-UNITS (systemd-user placement)"
      dev_and_bidder_kine_sqlite: "M0-KCP-SPIKE, M2-HOST-BACKEND-PROC only - kine on sqlite with kine resolved from an explicit path in a dev build; not gated on M1-ASSETS, M0-PG-SOURCE or M2-HOST-UNITS"
    decision: >
      Dependencies relaxed (user-approved 2026-10-12, state_rules exception): M1-ASSETS and M0-PG-SOURCE gate
      only the embedded-asset and postgres variants. The dev/bidder variant - one kine on sqlite, kine taken
      from an explicit path in a dev build, placed on proc - starts without them as part of the `binary-base`
      vertical slice (execution_order); the item is done when both variants are.
      Decided by the user 2026-10-12: the GATEWAY's kcp store is kine -> a dedicated postgres unit started
      before kcp, NOT a Postgres CRD object (the Postgres objects live in kcp, so kcp's own store cannot be
      reconciled from kcp; kcp-blue-green.md section 3), one kine per slot, and a pg_dump before each kcp
      upgrade. Decided by the user 2026-10-12 (third fold), correcting d6f778e: a BIDDER's kcp is a single
      slot on kine-sqlite (one kine process on <state>/handles/<hid>/kcp/kine.db; sqlite allows one kine), its
      upgrade is a short kcp restart, VMs are unaffected and the controller re-adopts them; d6f778e's "every
      production kcp on kine -> postgres, user may veto" was vetoed by the user. Before a bidder kcp restart
      that changes the kcp or kine asset, the core stops the slot and the kine, copies kine.db (with -wal and
      -shm) to <state>/handles/<hid>/kcp/backups/<ts>/ (size > 0 checked), and starts both again (decided by
      Claude, user may veto). Dev (decided by the user 2026-10-12): a dev instance's gateway-role kcp store is
      kine-sqlite in the quick profile and kine -> postgres in the market network and prodlike profiles; the bidder role
      is always kine-sqlite, as in production. Placement (decided by the user 2026-10-12): every store unit is
      in the BOOTSTRAP LAYER (M2-BOOTSTRAP-LAYER) - an installed user unit on systemd-user, a devsup unit on
      proc - never a HostProcess placement; this item builds the store code and its unit specs, the bootstrap
      layer installs and orders them.
      Gateway units (in socialweb-kcp-gw.slice, adopted by name):
      socialweb-kcp-gw-pg.service runs the pinned relocatable postgres (M0-PG-SOURCE's choice, the
      same asset M2-POSTGRES uses) on <state>/kcp/pg with listen_addresses='' and one unix socket directory
      <state>/kcp/pg/run (no TCP port at all, path < 108 bytes checked; the directory is 0700 to the
      account), KillSignal=SIGINT, Restart=on-failure, readiness by the core's own pgx `SELECT 1` over the
      socket (relocatable builds are not --with-systemd); initdb runs one-shot in the core, never
      ExecStartPre. socialweb-kcp-gw-kine@<slot>.service (slot a|b) runs the kine asset with
      --listen-address 127.0.0.1:0 and the socket DSN, After= and Wants= (not Requires=) the pg unit, so a
      postgres restart does not cascade-stop kcp; its port is read back from its MainPID's single LISTEN
      socket by hostsvc.ListenPort, written here because kine is the first port-0 unit (MainPID from
      systemd, then /proc/<pid>/net/tcp and tcp6 LISTEN rows matched against the socket inodes of
      /proc/<pid>/fd, same uid, no privilege; polled until exactly one LISTEN socket exists, two or more
      refused by name; kine also logs `Kine available at`). Schema-creation race on a fresh
      database (two kines measured to FATA on the first create): the first kine of a fresh store is started
      alone and the second only after the first answers; a kine that still exits on SQLSTATE 23505 is
      restarted once by the core. The small host-postgres library this item writes (internal/pgunit:
      initdb, pg_hba for the socket only, the unit spec, readiness, pg_dump to <state>/kcp/backups/<ts>.sql
      with exit 0 and size > 0 checked) is reused by M2-POSTGRES' controller, so there is one way to run a
      host postgres. pg_dump joins the postgres asset set (M1-ASSETS; M3-CP-SLOTS needs it too).
      Bidder units, per handle (in socialweb-kcp-<hid>.slice): socialweb-kcp-<hid>-kine@a.service runs kine
      with --endpoint sqlite://<state>/handles/<hid>/kcp/kine.db and --listen-address 127.0.0.1:0, port read
      back by ListenPort; no postgres unit, no second kine. ListenPort reads the MainPID from the Manager, so
      it works on both backends (devsup reports the pid on proc).
    files: ["internal/pgunit/ (initdb, hba, unit spec, readiness, dump)", "internal/kcpstore/ (gateway: pg + kine per slot; bidder: one kine on sqlite; unit specs, start order, adoption, sqlite backup copy)", "internal/hostsvc (ListenPort)", "internal/versions/versions.json (pg_dump in the postgres asset set)"]
    test_first: >
      Offline (fake hostsvc): TestKcpStoreStartsBeforeKcpAndOutsideTheCRDReconciler (the start order pg ->
      kine -> slot, and no Postgres object is read or written), TestKineIsWantsNotRequiresOnItsPostgres,
      TestThePgUnitHasNoTcpListener (argv: listen_addresses empty, socket dir under 108 bytes); over a fake
      /proc: TestListenPortReadsTheOneListenSocketOfTheMainPID, TestListenPortRefusesAUnitWithTwoListenSockets,
      TestListenPortIgnoresAnotherProcessesSockets. Behind
      livegate on hat-8 with stand-ins (real postgres and kine processes in transient units, no kcp, no guest):
      TestTwoKinesOnOneFreshDatabaseBothComeUp (red first: the measured FATA when both start at once),
      TestAPostgresRestartDoesNotStopItsKines, TestAPgDumpOfTheKcpStoreIsNonEmptyAndRestores. Bidder and dev
      (offline): TestTheBidderKcpStoreIsOneKineOnSqliteAndNoPostgres, TestTheBidderStoreIsCopiedBeforeAnAssetChangingRestart,
      TestTheDevQuickProfileUsesSqliteAndTheMarketNetworkProfilePostgres; the live stand-in tests also run on proc
      (devsup, check.sh --fast where no postgres asset is needed, behind livegate otherwise).
    done_when: "green on hat-8 on both backends; two kines on one fresh database come up 10 times in a row; a bidder sqlite store survives a slot+kine restart with its workspaces listed; readings recorded."
    risks:
      - "A kine schema migration takes ACCESS EXCLUSIVE (control-plane-handover.md); a kine bump for the gateway's kcp is rolled like a kcp slot (M3-KCP-ROLL) with old and new kine on one database tested first; on a bidder it is part of the short restart."
      - "Per-handle stores on a bidder: kine + one kcp + front per handle, ~0.45 GB (kcp-spike.md: kcp 378-409 MB, kine 54-62 MB); recorded per handle in M2-KCP-PORT0's readings."
      - "A sqlite kine restart is a store outage for the bidder's kcp; accepted, because the bidder's kcp restart is already a short outage that VMs never notice (decided by the user 2026-10-12)."
    status: done
    evidence:
  - id: M2-KCP-FRONT
    milestone: M2
    title: Our own L4 front holds kcp's address (127.0.0.1:6443 on the gateway, port 0 elsewhere) and swaps its backend between slots; caddy is never touched
    depends_on: [M1-CLI, M2-HOST-UNITS, M2-HOST-BACKEND-PROC]
    decision: >
      Third fold 2026-10-12 (decided by Claude, user may veto): the front is a bootstrap-layer unit
      (M2-BOOTSTRAP-LAYER: an installed user unit on systemd-user, a devsup unit on proc), so this item no
      longer waits for M1-INSTALL; the installed unit file is written by M2-BOOTSTRAP-LAYER. A bidder keeps a
      port-0 front for its single slot too: the slot binds a new port on every start (port 0), and the front
      is the stable --shard-base-url and consumer address across the bidder's short kcp restarts. Every
      front outside the production gateway binds 127.0.0.1:0 and reports its port through OnListen
      (M2-KCP-PORT0); the fd store is UnitSpec.FDStore on both backends (devsup holds it on proc).
      Decided by the user 2026-10-12: our own L4 front holds 127.0.0.1:6443 (the same code as the tenant k3s
      fronts) and does the swap after the new slot's own-port /readyz; caddy stays public TLS only, is never
      reconfigured by a swap, and any generated caddy config sets install_trust false. Decided by Claude, user
      may veto (kcp-blue-green.md 5 and 7.3; control-plane-handover.md 4): internal/apiserverfront, pure TCP
      passthrough (TLS stays end to end with kcp, whose serving cert is the shared apiserver.crt), run as
      `internal apiserver-front --owner <owner>` in the bootstrap-layer unit socialweb-kcp-<owner>-front.service
      naming the resolved bin/<sha256>/ path (rewritten only by an explicit front roll), so a core upgrade
      never changes the running front.
