    2026-10-12 (third fold), from user-decisions.md (the 2026-10-12 lines, esp. "dev run mode is KCP-NATIVE
    NOW"), dev-run-mode.md (its options and requirements; its phasing overridden by the user) and the user's
    decisions relayed with this fold: (a) a bidder's kcp is ONE slot on kine-sqlite and its upgrade is a
    short kcp restart; blue/green kcp slots on kine -> postgres are the GATEWAY's only (corrects d6f778e,
