  - id: M2-HOSTPROCESS-KIND
    milestone: M2
    title: "HostProcess objects reconciled by the in-binary supervisor onto a placement backend - each application instance's kcp as its own service manager"
    depends_on: [M2-HOST-BACKEND-PROC, M2-HOST-CONFORMANCE, M2-APPLY, M2-BOOTSTRAP-LAYER]
    decision: >
      Principle (user 2026-10-12): HostProcess is how an application's components become objects of that
      application's own kcp; a supervisor places only its own instance's HostProcesses and never reads another
      instance's. Decided by the user 2026-10-12 (dev run mode is KCP-NATIVE NOW, overriding dev-run-mode.md's "phase 2"):
      long-lived host processes are kcp objects - a HostProcess kind that generalises DenoPod - reconciled
      by an in-binary supervisor; ComputeVMs, kcp slots and tenant cluster members are placed through it;
      systemd-user is the production placement backend and proc the dev one. Decided by Claude, user may
      veto (dev-run-mode.md 3(b)): Kind HostProcess (socialweb.computer/v1alpha1, export hostprocesses,
      apigen-generated, OS-neutral) spec {asset (name + sha256 from versions.json) or exec path, argv, env,
      workDir, output {stdout, stderr files, cap}, limits, restartPolicy (Never | OnFailure | Always),
      stop {signal, graceSeconds}, after/wants (other HostProcess names), slice, privateHostname, fdStore,
      readiness {exec | tcp | http | pgx}, placement (supervisor | bootstrap)} and status {phase (Pending,
      Starting, Running, Stopping, Stopped, Failed, Lost), lostReason (HostRebooted, UnitGone, UnitFailed,
      OOMKilled, IdentityMismatch, ManagerRestarted), runtime {backend, unit, invocationID, pid, startTicks,
      hostBootID, manager}, lastResult {result, exitCode, signal, at}, conditions (Ready, LimitsEnforced)}.
      The supervisor is a pure reconciler in the deno-kcp denopod.go:105-140 style (Observed -> Result{Phase,
      Ops}) with hostsvc.Manager as its placement port, run inside the core (serve gateway kcp, run bidder,
      the dev core); it is the ONLY caller of Manager.Start outside the bootstrap layer. Rules: adopt by unit
      name + InvocationID, never re-create; identity mismatch on an active unit = Lost and stop the unit at
      once (the user's 2026-10-11 VM rule, generalised); a dial/auth/timeout error is Unknown, never Lost; an
      object whose status.runtime.backend differs from the running backend is Lost(IdentityMismatch) naming
      both, never adopted; LimitsEnforced=False on proc. placement bootstrap = a read-only MIRROR of a
      bootstrap-layer unit (M2-BOOTSTRAP-LAYER): status only, deleting it never stops the unit. Owners:
      Postgres (M2-POSTGRES), OpenBaoServer (M2-OPENBAO-SERVER), each cluster member (M3-CLUSTER-UNITS) and
      each ComputeVM (0007 M2-CONTROLLER) own HostProcess children (ownerReferences, created in the owner's
      workspace); the kcp slots are bootstrap mirrors, and a nested instance's kcp slots are ordinary
      HostProcess objects in its parent's kcp (M4-DEV-PARENT-KCP). DenoPod stays its own kind for TypeScript
      services (children of the core that die with it, plan 0008) and HostProcess reuses its reconciler
      shape; whether DenoPods become HostProcesses is not decided here.
