  - id: M3-KCP-ROLL
    milestone: M3
    title: "`units roll kcp` - a new kcp slot beside the old on the same store, the front flips, the old stops, the controller lease handed over"
    depends_on: [M2-KCP-SLOTS, M2-KCP-PORT0, M2-KCP-FRONT, M2-KCP-STORE]
    decision: >
      Scope (decided by the user 2026-10-12, third fold): the blue/green procedure below is the GATEWAY's. On
      a bidder, `units roll kcp` is the short restart of its single slot: copy the sqlite store (M2-KCP-STORE),
      stop the slot (and the kine when its asset changes), retarget the per-owner asset link, start them on
      the same root, wait /readyz on the slot's own port, then the ComputeVM controller re-adopts every VM by
      the Verdict; VM units are never touched and no version-pair rule applies (a restart cannot overlap two
      versions). `dev roll kcp` runs the gateway procedure inside a dev instance (proc backend).
      Decided by the user 2026-10-12: kcp upgrades follow the tenant pattern - start the new kcp, switch our
      own front over, stop the old; pg_dump before each kcp upgrade; lease handover = delete
      kube-system/kcp-controllers after the old slot exits (no ReleaseOnCancel patch). Procedure, decided by
      Claude, user may veto (kcp-blue-green.md 7.4): (1) refuse unless the version rule below allows the pair;
      (2) pg_dump the kcp store (internal/pgunit; exit 0, size > 0); (3) copy the five shared files into the
      idle slot's root; (4) start socialweb-kcp-gw-kine@<new> then socialweb-kcp-gw@<new> with the
      target asset, read both ports (ListenPort); (5) wait /readyz == 200 on the NEW slot's own port with the
      shard-admin token; (6) persist kcp-slots.json (active = new) BEFORE the front flip is acknowledged, then
      flip; (7) SIGTERM the old slot (--shutdown-delay-duration=2s keeps it serving non-watch requests while
      clients move) and wait for its exit; (8) delete Lease kube-system/kcp-controllers in system:admin with
      the shard-admin context through the front; (9) check that a probe object reconciles (a throwaway
      workspace Ready) within 10 s; (10) stop the old kine; keep the old root for a same-pair rollback.
      Idle first: prefer a moment with no exec/attach stream through a mount (a bounded deferral, the
      M3-CP-SLOTS rule). Version rule (kcp-blue-green.md 4 and 9 Q4, decided by Claude 2026-10-12, user may
      veto): a same-asset roll (flags changed, binary rebuilt) is always blue/green; a roll between two kcp
      releases is blue/green only when versions.json records the pair as storage-compatible - equal
      served/storage versions of every kcp CRD and APIResourceSchema and equal phase-0/1 bootstrap schemas
      (config/root-phase0, config/root), computed by scripts/kcp-compat.sh from the two release tags' source
      on the build host when the new asset is pinned (kcp source is read there, never vendored) and recorded
      as kcpCompat {from, to, storageCompatible, diff sha256}; any other pair is refused, and the only path is
      `units roll kcp --planned-outage`: pg_dump, stop the old slot, start the new slot on the same store,
      wait /readyz (kcp down for one start, ~9 s measured on a near-empty store), with the outage recorded.
      Rollback: the same procedure toward the previous asset, allowed only for a storage-compatible pair;
      otherwise restoring the pg_dump is the rollback of last resort. A kine bump for kcp rolls the same way
      (new kine with the new slot).
    files: ["internal/kcpserver/roll.go", "cmd/socialweb-computer units roll kcp", "scripts/kcp-compat.sh (build host, at pin time)", "internal/versions/versions.json (kcpCompat records)"]
    test_first: >
      Offline (fake hostsvc, fake kcp client): TestRollKcpRefusesAPairWithDifferentStorageVersions,
      TestRollKcpTakesAPgDumpFirst, TestKcpSlotsJsonIsPersistedBeforeTheFrontFlip,
      TestTheLeaseIsDeletedOnlyAfterTheOldSlotExited, TestReadinessIsReadOnTheNewSlotsOwnPortNeverThroughACopiedKubeconfig
      (the spike's run-1 hazard), TestAPlannedOutageRollIsTheOnlyPathForAnIncompatiblePair. Behind livegate
      on hat-8 with stand-ins (real kcp slots on kine -> postgres behind the front, no guest):
      TestRollKcpLeavesNoControllerGapLongerThan5s (red first with step 8 removed: the measured 61 s),
      TestRollKcpFailsNoReadyzPollThroughTheFront (shard-admin /readyz every 200 ms: 0 failures),
      TestAnInformerThroughTheFrontSeesEveryEventAcrossARoll (watch reconnects to the new slot, no event
      missed); bidder: TestABidderKcpRollIsARestartThatTouchesNoVMUnit (offline, fake Manager) and, behind
      livegate with stand-in VM units, the restart's kcp-down seconds recorded. The gateway live tests run on
      systemd-user and on proc (dev roll kcp). Red first.
    done_when: "green on hat-8; a same-asset roll's readings on a prod-shaped object count recorded (poll failures 0, old-slot exit seconds, lease handover seconds, probe Ready seconds, UTC)."
    risks:
      - "No published kcp version-skew policy for replicas of one shard; the storage-compatibility record is our own check, and a pair it misjudges is caught only by the probe step - hence the pg_dump first."
      - "N+1 rewrites kcp's own phase-0/1 objects at start while N still leads controllers for the seconds before the flip and the lease delete; harmless only for storage-compatible pairs, which is why other pairs take the planned outage."
    status: done
