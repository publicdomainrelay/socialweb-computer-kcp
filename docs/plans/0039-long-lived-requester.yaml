      endpoint, the handle's /.well-known/atproto-did, the relay crawl and the bidders' record reads reach the
      local PDS: `--ingress-xrpc-host xrpc.fedproxy.com` (the did:key ingress relay, the standalone default),
      `--ingress-provider opentunnel --ingress-opentunnel-*`, or `--ingress-public-host <host>` behind the user's
      own edge. Requester ingress (spec.requesterIngress; every identity): submitBid, submitEvent and getSecrets
      (the agent's ATIRC_TOKEN reaches the guest through getSecrets): `--requester-ingress-provider
      webrtc|xrpc-subscription|opentunnel|iroh`, `--requester-ingress-webrtc-stun`; comms Firehose has none and
      then needs `--secrets-fallback Sealed`. A remote-PDS identity needs only the requester ingress. Add any
      option-map rows the requester lacks for these flags; the ready file reports both public URLs.
