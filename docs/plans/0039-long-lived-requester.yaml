plan: "0039"
title: "A long-lived requester from the CLI: run requester in the foreground with a ready file, install requester as a systemd unit, the gateway composed into it, atirc agents from it, and a mixed-prod acceptance against a user-configured bidder"
status: todo
source: >
  2026-11-01 atirc, owner (verbatim): "split quickstart into quickstart-local.md and quickstart-prod.md, then write
  a plan for how we are going to address all the Not Supported Today items so that we could bring up a
  mixed-prod.yaml assume the user has access to a bidder they will configure (via
  examples/infra/vouch-bidder-operator.yaml and examples/infra/vouch.yaml and etc.). There is no reason we cannot
  bring up a kcp and apply resources to make a long lived requester from our CLI, we want this requester to be
  able to be run in the foreground and report random port bound to written out to file so we can wait for bound
  port and kubectl file to access it. We also want to support and document how we would kubectl apply
  HostProcess or whatever to have it installed as a systemd unit in slice in sepcified user created if asked for
  new user - similar to how we do bidder installs. There's also no reason we couldn't compose the gateway into
  that requester so that it can create k8s clusters and run the k3s control plane for them. also for the atirc
  agent we have ingress options and should show how to configure them for a local PDS so that that works or
  leverage a remote PDS for an existing account. write plan then make it happen and validate, including
  acceptance test(s) as needed." Lead: linux-kcp. Plan author: linux-kcp-plan39. The Not Supported items are
  the tables at the end of docs/quickstart-local.md and docs/quickstart-prod.md.
principle: >
  A long-lived requester is one more application instance: a kcp of its own, the MarketRequester root applied
  into it, every listener on port 0, state as kcp objects under one state dir. It is the root that
  `run request` composes today, kept up instead of torn down per contract, so `kubectl apply` of Infra,
  EphemeralInfra and ComputeContract against it runs the same RFP flow against prod bidders. The default
  policies always run (requester-tangled-vouch; bidder-tangled-vouch on the bidders); nothing here sets
  `policy: open`. No user record is ever deleted by these paths. A user is created only by the one explicit
  root step (install); everything else runs as USER without root.
grounding: >
  Read from the code at main 0ac9a0c3.
  (1) `run request` (cmd/socialweb-computer/request.go, requestRun.start, standalone branch): bringUp with
  profile quick and role devinstance.RoleRequester into requests/<name>, then request.OpenKcp(...).ApplyRoot of a
  MarketRequesterSpec, signIn, WaitReady, WriteInvocation; one ComputeContract per invocation; the owner lock
  requests/<name>/owner.lock. Standalone defaults (request.go:528-537): network.plcDirectoryUrl
  https://plc.directory, network.ingressProxyHost xrpc.fedproxy.com, spec.ingress compose.DefaultIngressConfig().
  (2) `run bidder` (cmd/socialweb-computer/bidder.go) is the long-lived model: standalone() bringUp + serve()
  (ApplyRoot with retry, signIn through appcli.IdentityRenderer without a deadline under --fg, WaitReady, a JSON
  summary on stdout, then block until Ctrl-C and downInstance keeping state); installedCore() is the
  --host-backend systemd-user path that bidder.RunCore (internal/stack/bidder/core.go) runs under the unit.
  (3) `install bidder` (internal/install/install.go Install): steps account (useradd --system, --adopt-account
  for an existing one, install-<account>.json record), subids, kvm, delegation, apparmor, nodePassword,
  stateLayout, guestImage, unitFiles (templates/socialweb-computer-bidder@.service: Type=notify, Slice=
  socialweb.slice, CONFIG_PATH_SOCIALWEB_COMPUTER=<state>/config.json, ExecStart run bidder --handle %i --fg),
  linger, enable, bringUp, checkHost; config() writes config.json (host-backend systemd-user, state-dir,
  profile prod-qr, bidder-policy default); roles come from internal/hostcontract (gateway, bidder only) and
  internal/bootstrap/table (Gateway(), Bidder()); upgrade.go infers gateway or bidder.
  (4) HostProcess (api/v1alpha1/types_hostprocess.go) has unit, exec/argv, env, slice, readiness, placement
  supervisor|bootstrap and no account field: it runs in the user manager of the core that places it. HostInstall
  (internal/controllers/hostinstall) only observes the install record.
  (5) pkg/embedded (plan 0038) runs the requester in process on memory storage and vaultmemory, comms Firehose,
  no ingress, a snapshot the app must store encrypted; it is the iOS and wasm shape, not a Linux host shape.
  (6) The Gateway root (internal/app/gateway/gateway.go) composes its own Pds, Requester, GatewayAPI and the
  cluster provider (ClusterStateDir <state>/clusterprovider, k3s and kine HostProcesses), with
  GatewayNodeMarket{HomeWorkspace, ContractWorkspace} (gateway.go:231-240): the NodeClaim controller
  (internal/controllers/nodeclaim) writes the cluster's Infra nodes-<hex> into the contract workspace. Profiles
  prod and market-network only. The core registers the Infra and NodeClaim controllers for every root
  (internal/stack/componentcore/controllers.go:146-152).
  (7) atirc mint (internal/market/requester/atirc.go serviceAtircIssuer): fails "the requester identity signs no
  service auth" when q.serviceAuth is nil; requester.go:643-650 sets it only for IdentityModeOAuth
  (oauthServiceAuth) or, when not LocalSigner, from the owner MarketIdentity (pdsAccount and oauthSessionProxy;
  the link marketrequester.go:407). localRepo sets LocalSigner (requester.go:377), so a local-PDS requester never
  signs, although the Pds component provides pds.CapabilityServiceAuth (internal/controllers/pds/provide.go:77) and
  the bidder already links its guest to it (internal/app/marketbidder/marketbidder.go:634). A localRepo handle is
  compose.PdsHandle: <workspace>.requester.local (internal/app/compose/pds.go:56), which nobody resolves.
  (8) RequesterOAuthScope (internal/atproto/oauth/scope.go:69) has no repo:sh.tangled.graph.vouch, so vouch.yaml
  through an OAuth requester repo is refused by the PDS; OptionalScopes holds only rpc:chat.atirc.revoke.
  (9) NetworkApp has no computeKinds (MarketBidderSpec has, types_application.go:669); marketnetwork
  children.go:630 builds the MarketBidderSpec from NetworkApp; dev up has no --compute-kinds.
  (10) The vouch examples use deletionPolicy Delete (AtprotoRecord default); vouch-bidder-operator.yaml needs the
  network's operator repo link (link-records-operator), which an installed bidder does not compose.
  (11) Schema revisions now: MarketRequester 37 (38 burned on prod by a reverted build), Requester 29, Gateway 38,
  MarketNetwork 31.
decisions:
  name_and_base: >
    The verb is `socialweb-computer run requester` (beside `run bidder`), on the bringUp path of `run request`
    standalone (HostProcess kcp, real OpenBao, ingress), not pkg/embedded: a Linux host has sockets, an ingress
    gives getSecrets without the sealed fallback, and OpenBao keeps secrets out of a snapshot file. Owner decision
    D1 below.
  ready_file: >
    `run requester --ready-file <path>` (default <state-dir>/requesters/<name>/ready.json) is written once the
    MarketRequester root is Ready, by write to <path>.tmp then rename, mode 0600, and rewritten on every restart
    and on a change of any field. JSON {schema: 1, name, pid, startedAt, kcpUrl (the bound front address),
    kubeconfig (path of the admin kubeconfig), workspace, did, handle, identityMode, pdsUrl, ingress {pds,
    requester} (public URLs from the Exposure status), gateway {workspace} when composed}. No token, key or
    password, only paths. Removed on a clean stop. A script waits with `until [ -s ready.json ]`.
  install_vs_hostprocess: >
    `install requester` is the path that creates a user (the one explicit root step, as install bidder); a
    HostProcess manifest is the documented same-account path (no root, no new user) into a core the account
    already runs. Both run the same process: `socialweb-computer run requester --fg`. HostProcess has no account
    field and cannot create a user, so it cannot be the new-user path. Owner decision D2.
  gateway_compose: >
    `run requester --with-gateway` applies a Gateway root with a new profile `requester` into the same kcp. The
    Gateway gains spec.requesterRef {workspace, name}: with it the root composes no Pds, Requester or identity
    of its own, sets GatewayNodeMarket.ContractWorkspace to the MarketRequester's workspace, and the
    MarketRequester's Requester rents the nodes under the user's own DID and policy. GatewayAPI is not composed
    in profile requester; a Cluster is a kubectl apply. Owner decision D3.
  agent_identity: >
    OAuth (QR or browser): mints today. Remote PDS existing account (pdsAccount, app password): mints through
    the owner MarketIdentity service auth; prove it live. Local PDS (localRepo): mints only when the DID is on
    plc.directory, the PDS is public through an ingress, the handle is one the user controls and resolves, and
    the Requester links service auth to its own Pds component; a .local handle is refused before the RFP of an
    agent contract. Owner decision D4.
state_rules:
  - "Read AGENTS.md first. status is one of todo, doing, done, blocked. The lead flips statuses."
  - "No Go tests (AGENTS.md, plan 0027). Proof is the build gates and the live runs in done_when; the policy spec tests stay green."
  - "Schema changes bump the Revision in api/v1alpha1/resources.go past every burned revision (MarketRequester 38 is burned) and run go generate; generated output is never hand-merged; only one track holds api/ at a time."
  - "Live runs against prod bidders and irc.fedfork.com are the lead's (acceptance README rules); task agents prove on their own market network, with a local bidder and a requester of their own."
  - "Default policies only. No deletion of user records: every AtprotoRecord in these paths is deletionPolicy Retain."
  - "A decision that closes moves into docs/ARCHITECTURE.md (section 14 when the item opens, 15 when it closes)."
open_decisions:
  - id: D1
    question: "Base the long-lived requester on the run request bringUp (HostProcess kcp, OpenBao, ingress) or on pkg/embedded (in process, memory storage, Firehose only)?"
    recommended: "bringUp, verb `run requester`. pkg/embedded stays the app shape (iOS, wasm)."
  - id: D2
    question: "Systemd install: `install requester` (root, creates the account) or a kubectl-applied HostProcess?"
    recommended: "install requester for a new user, mirroring install bidder (default account swc-requester, --account to name one, --adopt-account for an existing one); HostProcess documented for the same account with no root."
  - id: D3
    question: "Gateway in the requester: a Gateway root that reuses the MarketRequester's Requester (spec.requesterRef), or a second root with its own Requester on the same account through oauthSessionProxy?"
    recommended: "spec.requesterRef: one identity, one OAuth session (plan 0030), one policy engine, one ingress; no second sign-in."
  - id: D4
    question: "Local PDS atirc agent: what must irc.fedfork.com resolve? (ask atirc-dev: does chat.atirc.mint check only the service-auth JWT against the DID document from plc.directory, or also the handle bidirectionally?)"
    recommended: "require did:plc on plc.directory, the PDS public through the ingress, and --atproto-handle on a domain the user controls (DNS TXT _atproto or https /.well-known/atproto-did on the PDS ingress public host); refuse a .local handle for spec.agent before the RFP."
  - id: D5
    question: "vouch-bidder-operator.yaml on a user-configured (installed) bidder: how does the bidder kcp write the operator's repo?"
    recommended: "an optional operator sign-in in the bidder kcp: MarketIdentity operator (oauthQr, scope repo:sh.tangled.graph.vouch only) and the AtprotoRepo operator with the same link label as the market network (apps.socialweb.computer/record-repo: operator), so the example applies unchanged; until then the operator writes the record with goat."
  - id: D6
    question: "The agent bundle of a kubectl-applied contract: who writes the ATIRC_TOKEN placeholder entry?"
    recommended: "the Requester itself, when a spec.agent contract's spec.secretsRef path holds no bundle (one entry at agent.envFile, mode 0600), so the page, the iOS app and the CLI need no bao step; the quickstart's bao commands stay valid."
  - id: D7
    question: "The vouch record through an OAuth requester repo needs repo:sh.tangled.graph.vouch. Add it to RequesterOAuthScope?"
    recommended: "yes, as an optional scope (oauth.OptionalScopes), so no identity is forced to sign in again on rollout (status.pendingAction signInAgain ScopeUpgrade instead); typescript-helpers mirrors it; goat stays the fallback."
  - id: D8
    question: "deletionPolicy of the vouch examples?"
    recommended: "Retain everywhere (local examples too): kubectl delete never deletes a user's vouch record."
  - id: D9
    question: "Sign-in of an installed requester (no TTY)?"
    recommended: "oauthQr as the default profile (the pendingAction url from the MarketIdentity status, scripts/oauth-signin.ts), as a prod-qr bidder; an app password goes once from stdin into the requester's root OpenBao (a SecretRef), never into config.json, a flag or a HostProcess argument."
