items:
  - id: A-RUN-REQUESTER
    title: "run requester: a long-lived foreground MarketRequester root in a kcp of its own, a ready file, restart survival, every identity mode"
    track: T1-cli-requester
    depends_on: []
    files:
      - cmd/socialweb-computer/requester.go
      - cmd/socialweb-computer/main.go
      - cmd/socialweb-computer/request.go
      - internal/stack/request/request.go
      - internal/stack/request/ready.go
      - internal/stack/request/ssh.go
      - deploy/apps/option-map.yaml
      - AGENTS.md
      - docs/quickstart-prod.md
    work: >
      New verb `run requester` with options name, state-dir, ready-file, fg, ready-timeout, network-timeout,
      host-backend, the kcp/kine/bao/dumbpipe paths, log-level, and the same passthrough after `--` as `run
      request` (identity: --atproto-oauth-qr, --atproto-oauth, --atproto-identity-mode pdsAccount
      --atproto-handle --atproto-pds-url with the password from the environment, localRepo with --identity
      <name>; comms; ingress; secrets-fallback). Move the MarketRequesterSpec part of requestRun.passthrough into a
      function both verbs call (no copy). State dir <state-dir>/requesters/<name> (never requests/, which holds
      invocations), one owner flock. Bring up with bringUp (profile quick, role requester), ApplyRoot, sign in
      through appcli.IdentityRenderer (no deadline under --fg), WaitReady, write the ready file (decisions
      ready_file), print the JSON summary, then block until Ctrl-C and stop the instance keeping state, as
      run bidder --fg. A second start on the same state dir adopts the units and reuses the DID, the vault and
      every contract. Helpers on the running instance: `run requester env <name>` (KUBECONFIG and the
      workspace, like dev env), `run requester ssh <name> --contract <cc> [--transport webrtc]` (the run
      request ssh code over any Held contract). No Infra-specific verb: kubectl apply.
    done_when: >
      As USER, `run requester --name lr1 --state-dir S -- --atproto-oauth-qr` signs in from the pendingAction url
      and writes S/requesters/lr1/ready.json; `until [ -s ready.json ]` returns; `kubectl --kubeconfig
      $(jq -r .kubeconfig ready.json) get marketrequesters.socialweb.computer app` prints Ready and the DID; the
      kcpUrl port is not a fixed port and equals the bound front; `kubectl apply -f examples/infra/vm.yaml` (bidder
      pinned) reaches Deployed on a prod bidder and `run requester ssh lr1 --contract infra-quickstart-vm-vm1`
      prints quickstart-vm-ok; Ctrl-C, start again: the same DID, the ready file rewritten with the new kcpUrl,
      the contract still Held, ssh again works; the same with a pdsAccount identity (app password) and with a
      localRepo --identity; no token or password in the ready file, the summary or any log.
    risks:
      - "bringUp of profile quick is tuned for short invocations (ready timeouts, die-with); a long-lived instance must survive the CLI's terminal closing only under --fg semantics, and nothing must be torn down on a transient kcp error."
      - "Two verbs sharing one passthrough: a refactor of request.go is shared with live run request users; keep run request output identical."
      - "Held contracts across a restart: the requester adopts by status; prove a release after a restart revokes atirc tokens first (cloudinit.RequestRevokeWait)."
    status: todo

  - id: B-INSTALL-REQUESTER
    title: "install requester: account (created when asked), slice, user unit, config.json, linger, upgrade and uninstall, as install bidder"
    track: T2-install
    depends_on: [A-RUN-REQUESTER]
    files:
      - internal/hostcontract/hostcontract.go
      - internal/checkhostmain
      - internal/bootstrap/table/table.go
      - internal/install/install.go
      - internal/install/bootstrap.go
      - internal/install/upgrade.go
      - internal/install/uninstall.go
      - internal/install/templates/socialweb-computer-requester@.service
      - internal/stack/request/core.go
      - cmd/socialweb-computer/install.go
      - cmd/socialweb-computer/main.go
      - cmd/socialweb-computer/requester.go
      - docs/quickstart-prod.md
    work: >
      hostcontract.RoleRequester ("requester"), check-host -role requester (no kvm; subids and delegation only
      with --with-gateway). install.DefaultAccount requester -> swc-requester; `--account <name>` creates that
      account when no record and no user exists, `--adopt-account` takes an existing one (ErrForeignAccount
      otherwise), as today. `--name` (repeatable, like --handle) names each requester instance; unit
      socialweb-computer-requester@<name>.service: Type=notify, Slice=socialweb.slice, WorkingDirectory=<state>,
      CONFIG_PATH_SOCIALWEB_COMPUTER=<state>/config.json, ExecStart <state>/bin/current/socialweb-computer run
      requester --name %i --fg, Restart=always, Delegate=yes. Steps: account, subids and delegation (gateway
      only), nodePassword (gateway only), stateLayout, unitFiles, config (host-backend systemd-user, state-dir,
      identity mode, handle, ingress, comms, with-gateway; never a password), linger, enable, bringUp (wait for
      the ready file), checkHost. `run requester --host-backend systemd-user` runs request.RunCore under the unit
      (the bidder.RunCore pattern) and sends READY=1 after the ready file. upgrade and rollback learn the role;
      uninstall removes the units, keeps the state unless --purge. Sign-in per D9.
    done_when: >
      On a test host as root: `install requester --account swc-req-t1 --name me --dry-run` prints the step list;
      without --dry-run the account is created (install-swc-req-t1.json records Created), the unit is active in
      socialweb.slice of that user, <state>/requesters/me/ready.json appears after the scripted QR sign-in, and
      `sudo -u swc-req-t1 kubectl --kubeconfig <ready.kubeconfig> get marketrequesters.socialweb.computer app`
      is Ready; a second install is all FOUND; `upgrade --binary <new> --sha256 <sum>` restarts the unit and the
      DID and Held contracts survive; reboot keeps it (linger); `uninstall requester --account swc-req-t1`
      removes the units and leaves the state.
    risks:
      - "install is prod-shaped code shared with install bidder and install gateway; a regression there breaks prod upgrades. Prove install bidder --dry-run output is unchanged."
      - "upgrade.go infers the role from the record; a requester record must never be read as a bidder."
      - "systemd user manager Type=notify through the run requester process: READY=1 must come only after the ready file, or the unit start times out on a slow OAuth sign-in (TimeoutStartSec, as BidderStartGrace)."
    status: todo

  - id: B2-HOSTPROCESS-PATH
    title: "Same-account install through a kubectl-applied HostProcess, documented and proven"
    track: T2-install
    depends_on: [A-RUN-REQUESTER]
    files:
      - examples/infra/requester-hostprocess.yaml
      - docs/quickstart-prod.md
    work: >
      An example HostProcess (placement supervisor, unit swc-requester-<name>, exec socialweb-computer, argv run
      requester --name <name> --state-dir <dir> --fg, slice socialweb.slice, restartPolicy Always, readiness exec
      test -s <dir>/requesters/<name>/ready.json) applied into a core the account already runs (an installed
      requester or a dev host instance). Prove that no root prunes a HostProcess outside its set (compose.SetWorkloads
      renders only set members) and that the core adopts it across its own restart (unit name and InvocationID).
    done_when: >
      kubectl apply of the example into a running core of the same account places the unit in socialweb.slice,
      HostProcess status Running with the ready-file readiness, the ready file names a working kubeconfig; dev
      restart of that core leaves the unit adopted unchanged; kubectl delete stops it and keeps its state dir.
    risks:
      - "If a root prunes foreign HostProcesses, this path needs a label or a set entry; read compose.CheckWorkloads first."
    status: todo

  - id: C-GATEWAY-COMPOSE
    title: "The gateway in the requester's kcp: profile requester, spec.requesterRef, Cluster by kubectl, k3s control plane and nodes rented by the same requester"
    track: T3-gateway
    depends_on: [A-RUN-REQUESTER]
    files:
      - api/v1alpha1/types_application.go
      - api/v1alpha1/resources.go
      - internal/app/gateway/gateway.go
      - internal/app/gateway/vault.go
      - internal/controllers/nodeclaim/controller.go
      - internal/controllers/nodeclaim/infra.go
      - cmd/socialweb-computer/requestergateway.go
      - deploy/sets
      - docs/quickstart-prod.md
    work: >
      GatewaySpec.RequesterRef *commonv1.ObjectRef (Gateway Revision 39) and ProfileGatewayRequester
      "requester". With requesterRef the root skips PlanAccount, the Pds, the Requester and GatewayAPI, composes
      the cluster provider (ClusterStateDir under the requester's state dir) and GatewayNodeMarket with
      HomeWorkspace = the gateway workspace and ContractWorkspace = the requester workspace; the NodeClaim
      controller writes nodes-<hex> Infra there, whose ComputeContracts the MarketRequester's Requester runs
      with the user's DID and the default policy; vault links for the node join secrets go to the requester's
      vault (contracts/*). `run requester --with-gateway` applies the Gateway root into workspace gateway of the
      same kcp and adds gateway.workspace to the ready file; `run requester kubeconfig <name> --cluster <c>`
      prints the tenant admin kubeconfig path.
    done_when: >
      run requester --with-gateway (OAuth identity): kubectl apply of a Cluster {account: me, running: true} in the
      gateway workspace goes Ready with the k3s control plane as HostProcesses of the requester's core;
      `kubectl --kubeconfig $(run requester kubeconfig lr1 --cluster c1) apply -f examples/infra/k8s-cluster.yaml`
      makes a NodeClaim, Infra nodes-<hex> appears in the requester workspace, a node rented from the
      user-configured prod bidder joins Ready, the pod logs quickstart-k8s-ok; deleting the Deployment scales the
      node to zero (about 2 min idle) and the contract is Released; a requester restart keeps the cluster.
    risks:
      - "k3s in a user namespace needs subids and cgroup delegation on the host: run requester --with-gateway must preflight what install gateway checks (check-host -role gateway subset)."
      - "The nodes-<hex> Infra record mirror writes computer.socialweb.infra to the owner repo: needs the repo link from the gateway root to the requester's repo; Retain only."
      - "Two roots in one kcp share one core: CheckWorkloads per root; profile requester must not render the gateway set's web app or association-watch."
      - "Gateway Revision 39 must not collide with a burned revision on prod; read deploy/apiresourceschema-revisions.txt first."
    status: todo

  - id: D-AGENT-IDENTITY
    title: "atirc agents from the long-lived requester: OAuth and remote-PDS identities proven, and a local-PDS identity that signs service auth"
    track: T4-identity
    depends_on: [A-RUN-REQUESTER]
    files:
      - internal/market/requester/requester.go
      - internal/market/requester/atirc.go
      - internal/market/requester/secrets.go
      - internal/app/marketrequester/marketrequester.go
      - internal/services/requester/wiring.go
      - docs/quickstart-prod.md
    work: >
      OAuth: no code; prove from run requester. pdsAccount: prove the owner MarketIdentity service auth mints
      (an app password may call getServiceAuth for chat.atirc.mint) and that revoke works by the token itself.
      localRepo: when the identity's DID is on the public PLC (spec.network.plcDirectoryUrl
      https://plc.directory) and its Pds component is public (ingress Exposure Ready), the MarketRequester local
      path adds compose.ServiceAuthLink(requester, the Pds component, did) and the Requester selects that service
      auth (requester.go:643-650: a third case, local Pds service auth, logged requester_service_auth signing
      local-pds); otherwise it stays nil. A spec.agent contract whose requester handle ends in .local, or whose
