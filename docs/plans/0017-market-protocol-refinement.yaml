decided:
  - "Opened by the lead at the user's request 2026-10-16. The cap of 100 is the user's number ('100 or something'); the policy engine choosing which bidders get the RFP is a future plan."

  - "2026-10-18 the user answered M0: (1) online = a heartbeat record in the bidder's own repo every 60 s, TTL 5 min. (2)+(3) no RFP recipient cap and no fill order in this plan: tabled as an open item with no plan attached (ARCHITECTURE section 14). Relay/firehose watchers already see created rfp records, so submitRfp over XRPC is only a direct-speed path and the path for bidders that do not watch the firehose; a future policy-engine plan decides which bidders get submitRfp and in what priority. M2-RFP-RECIPIENT-CAP and ACC17-BOUNDED-FANOUT are removed."