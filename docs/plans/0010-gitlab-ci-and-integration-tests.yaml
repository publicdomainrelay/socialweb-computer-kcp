plan: 0010-gitlab-ci-and-integration-tests
written: 2026-10-11
revised: >
  2026-10-12, R0-REASSESS first pass (proposed by Claude; the user answers questions_for_user, then the
  lead marks decisions "decided by the user"). Re-read against plans 0006-0009 and 0013, AGENTS.md and
  main at 23e715ca. What changed since 2026-10-11: no tests until prod works, then integration tests
  only (AGENTS.md "Tests: no tests"); prod deployments preserve nothing (0006 M5-FRESH-DEPLOY);
  every application has its own kcp and the market network is one MarketNetwork application driven by
  `socialweb-computer dev up|status|down` and `run request` (0006 M2-APP-CONTROLLER, 0008
  M4-MARKET-NETWORK-PORT, M4-RUN-REQUEST); the guest kernel is built from a pinned config with every
  netfilter option built in (0007 M1-GUEST-IMAGE); market k3s schedulers run with leader election on
  (0006 M3-CP-SLOTS); a restarted kcp bidder rebuilds its contracts from its ComputeVMs (0007
  M4-CONTRACT-RESTORE); the GitLab server at gitlab.dorper-matrix.ts.net:8443 now hosts this
  repository, and CI moves there. Result (the user restored the GitLab-in-docker fixture, G1-GITLAB-FIXTURE, on 2026-10-12); plan 0010 becomes
  the plan for GitLab CI of this repository and for the integration tests that come after prod, plus
  the two small gaps no other plan owns (the debug node ssh path, the acceptance leftovers).
status: done
queued: >
  G1-CI-GATE and G4-NO-DEBUG-SSH have no dependency on prod and may start once R0-REASSESS is answered.
  G1-CI-RELEASE follows G1-CI-GATE. Every G2 and G3 item waits for 0006 M5-FRESH-DEPLOY (prod works:
  a tenant k3s cluster on the new gateway scales to zero and gets nodes as market RFP VMs from the hat-8
  bobvmbuilder bidder). G4-CLEANUP runs right after 0006 M5-FRESH-DEPLOY.
source: >
  The gaps found on 2026-10-11 when plans 0001-0005 were reviewed together after plan 0005 closed
  (all 40 items and ACC-ZERO/ACC-MESH/ACC-NOSSH done on prod). The user asked that they be written down
  as plan 0010, assuming a GitLab server run in a docker container as the test fixture, with the
  first item a re-assessment that asks the user questions before anything executes.
relation_to_other_plans: >
  Proposed folds (the lead edits the other plans; this revision does not touch them): GAP-3 (restart
  leak) is owned by 0007 M6-LIVE-RECOVERY and M6-BIDDER-UPGRADE; GAP-4 (kernel and rootfs) is closed
  by 0007 M1-GUEST-IMAGE and proved by 0007 M6-NOSSH-JOIN; GAP-5 (dead substrate code) joins 0006
  M5-RETIRE; GAP-7 (leaderElect) is void after 0006 M3-CP-SLOTS. The 0007 M6 items still name
  internal/marketnetwork/live_test.go, which 0008 M4-MARKET-NETWORK-PORT deleted; under the no-tests
  rule they are manual live readings before prod, and their regression form is G2-IT-BIDDER-RESTART
  here, after prod. The G2 harness is the market network that 0009 (ACC9-EXACTLY-ONCE) and 0013
  (M4-SOAK-READING) also read from; when those plans land, their acceptance checks are added to the G2
  suite as integration tests.
state_rules:
  - TypeScript lives in this repository (decided by the user 2026-10-12): the closure's ten repositories were vendored with their history under ts/<repository>/ and the originals are frozen; a path this plan names under ts/ is changed here, never in the original.
  - No tests until prod works (user, 2026-10-12). The only tests this plan writes are the G2 integration tests, after 0006 M5-FRESH-DEPLOY. A manual live run is proof, not a test.
  - Every live run uses its own market network (dev up with a unique instance name, port 0, VM slots of test-0001) and cleans up what it started. Never the prod bidder or alice, except the G3-PROD-CANARY, which only reads prod through the product's own front door.
  - Real names only (AGENTS.md). Commit and push only socialweb-computer-kcp. The lead flips status; the git history is the evidence.
  - status is one of todo, doing, done, blocked.
ownership:
  owned: >
    All code in socialweb-computer-kcp, its CI configuration on gitlab.dorper-matrix.ts.net:8443, the
    integration tests, and the CI runner this plan registers.
  not_owned: >
    The market protocol records and lexicons, and the core architecture: kcp in front of
    k3s --disable-agent clusters at zero nodes, nodes only through requester -> RFP -> bid -> accept
    -> cloud-init user_data, never hand-provisioned, never reached by ssh. The GitLab server itself
    (installed and run by the user). Changes there are asked first.
gaps:
  - id: GAP-1
    text: >
      No repeatable end-to-end acceptance. Pipelines 78/79 were driven by hand; nothing re-runs
      them on a change, so a regression on prod goes unnoticed. Plan 0001 P4
      (deploy/gitlab-ci-proof.sh) was never written.
    reassessed: Still real. Owned here as G2 (integration tests on a market network) and G3 (CI runs them; a prod canary).
  - id: GAP-2
    text: >
      One real bidder. bob on hat-8 is the whole market on prod. Several bidders competing, a bidder
      failing mid-contract and failover to another bidder are unproven live.
    reassessed: Still real. A market network now runs N bidders, each its own application with its own kcp, so failover is proved there (G2-IT-FAILOVER). A second prod bidder waits for a second host (question).
  - id: GAP-3
    text: >
      A bidder restart leaks its guests (vm.delete then 404s). 14 exited fc-* containers from
      2026-10-07 remain on hat-8. Plan 0007 owns the defect today.
    reassessed: Smaller. 0007 M4-CONTRACT-RESTORE (done) rebuilds contracts from ComputeVMs; 0007 M6-LIVE-RECOVERY and M6-BIDDER-UPGRADE prove it live before prod. The fc-* containers belong to the old bidder that 0006 M5-FRESH-DEPLOY stops (G4-CLEANUP).
  - id: GAP-4
    text: >
      The guest boots the build host's Fedora kernel under an Ubuntu 24.04 rootfs. The mismatch
      caused M5-NETPOL (CONFIG_MODPROBE_PATH); nothing checks the kernel/rootfs contract (modprobe
      path, module tree for the running kernel, netfilter modules kube-router needs) at build time.
    reassessed: Closed by 0007 M1-GUEST-IMAGE. The host /boot kernel is no longer an input; deploy/guest-kernel/socialweb.config sets CONFIG_MODULES=n and builds in NFT_LOG, NFT_LIMIT, NFT_COMPAT, XT_NFLOG, XT_LIMIT, XT_SET and IP_SET, so there is no module tree to mismatch. 0007 M6-NOSSH-JOIN and G2-IT-SCALE-TO-ZERO prove it.
  - id: GAP-5
    text: >
      The retired local substrates were swept by name only: internal/nodefirecracker and the
      substrate network and address vocabulary remain in the tree.
    reassessed: Still real (internal/nodefirecracker imported by internal/checkhostmain; SOCIALWEB_CLUSTERPROVIDER_SUBSTRATE and the retired-substrate refusals in internal/providermain; internal/nodevm, internal/noderecord). With no back-compat it is dead code. Proposed fold into 0006 M5-RETIRE, which deletes the container path in one change.
  - id: GAP-6
    text: >
      NetworkPolicy coverage is one case: cross-node deny-all ingress. Egress, namespaceSelector,
      ipBlock, and a DNS-allow policy beside default-deny are untested.
    reassessed: Still real, but it is a test, so it waits for prod. Folded into G2-IT-SCALE-TO-ZERO.
  - id: GAP-7
    text: >
      Market clusters run kube-scheduler with leaderElect false. Safe while each cluster has exactly
      one k3s server; nothing refuses the config if a second server ever appears.
    reassessed: Void. 0006 M3-CP-SLOTS turned scheduler leader election on for every market cluster (internal/clusterstack/scheduler.go leaderElect true); the guard it asked for has nothing left to guard.
  - id: GAP-8
    text: >
      The debug ssh path (DEBUG_SOCIALWEB_NODE_SSH_DIR) is in the shipped code and gated only by
      deploy configuration. Zero ssh on prod is a property of container.env, not of the build.
    reassessed: Still real, now in the web app (socialweb-computer-k8s/hono-socialweb-computer-k8s option debug-node-ssh-dir, deploy/apps/option-map.yaml, sshAuthorizedKeys in socialweb-computer-k8s-node-market). Owned here as G4-NO-DEBUG-SSH.
  - id: GAP-9
    text: >
      The GitLab used for acceptance (hat-10, Tailscale funnel) was installed by hand and is not a
      fixture this repo can recreate; plan 0001's "spin a VM and run GitLab" recipe was never run by
      this repo.
    reassessed: Open again (user 2026-10-12). The GitLab server at gitlab.dorper-matrix.ts.net:8443 hosts this repository and its CI; the acceptance and integration runs still need a GitLab this repository can recreate as a fixture. Owned here as G1-GITLAB-FIXTURE.
  - id: GAP-10
    text: >
      Acceptance leftovers on prod and the lab: runner 6 on hat-10, clusters acc-gitlab-0001 and
      acc-gitlab-0002, branches acc-0005 and acc-clone in kcp-ci-probe, 14 exited fc-* containers on
      hat-8.
    reassessed: Smaller. The clusters go with the old gateway at 0006 M5-FRESH-DEPLOY (nothing is carried over). Runner 6, the acc-* branches and the fc-* containers remain; G4-CLEANUP.
acceptance:
  checks:
    - id: ACC-REPEAT
      text: >
        The G2 integration suite runs in GitLab CI on main (G3-CI-INTEGRATION), each test in its own
        market network, and is green twice in a row; the prod canary timer run (G3-PROD-CANARY) scales
        a prod tenant cluster from zero on a market RFP VM from the hat-8 bidder, runs its job, and
        scales back to zero, green twice in a row.
      status: done
      evidence: []
    - id: ACC-FAILOVER
      text: >
        In a market network with two bidders, one killed mid-contract: the requester re-requests the
        node, the other bidder wins it, it joins, the job still passes, and the dead bidder's ComputeVM
        is released when it comes back.
      status: done
      evidence: []
decided:
  - "Decided by Claude 2026-10-12 from the R0 recommendations, under the user's standing rule to decide in line with earlier answers; the user may veto any line."
  - "Q1 CI runner: one gitlab-runner, shell executor, as a user unit of a dedicated unprivileged account on hat-8, tagged socialweb-computer-kcp, registered to this project only."
  - "Q2 CI before prod: NO. The user said not to worry about CI until the work is moved over and prod works; G1-CI-GATE starts after 0006 M5-FRESH-DEPLOY, then the lead babysits CI."
  - "Q3 Release artifacts: yes, after G1-CI-GATE; releases and guest images publish to the project's GitLab package registry."
  - "Q4 GitHub: delete .github/workflows/typescript.yml; no GitHub push mirror (the user moved pushes to GitLab, 2026-10-12)."
  - "Q5 Integration tests: Go tests in test/integration (build tag integration) driving the socialweb-computer verbs; run request keeps runComputeContract, so the RFP flow stays the only path."
  - "Q6 Prod canary identity: alice, signed in from ~/.aliceoa_bsky_social_source on the deploy host (AGENTS.md Prod deployments)."
  - "Q7 Canary schedule: nightly and once after every prod deploy."
  - "Q8 Second prod bidder: failover proved in the market network only; a second real bidder when a second host exists."
  - "Q9 Debug node ssh: delete it (zero ssh to guests; no back-compat)."
  - "Q10 Leftovers: delete them right after 0006 M5-FRESH-DEPLOY (prod keeps nothing)."
  - "Q11 Folds confirmed: GAP-3 into 0007 M6-LIVE-RECOVERY and M6-BIDDER-UPGRADE, GAP-5 into 0006 M5-RETIRE (file list extended), GAP-4 and GAP-7 closed; the 0007 M6 items' internal/marketnetwork/live_test.go is read as a manual live run."
  - "User 2026-10-12: G1-GITLAB-FIXTURE is restored (it should not have been dropped); GAP-9 stays open."
  - "Q12 Plan name: renamed to 0010-gitlab-ci-and-integration-tests.yaml with NEXT.yaml P10."
questions_for_user: []
items:
  - id: R0-REASSESS
    milestone: R0
    title: Re-assess every item and the best way to approach it, then ask the user and revise this plan
    decision: >
      Decided by the user 2026-10-11: this is the first item and nothing else in the plan starts
      before it is done. First pass done 2026-10-12 (this revision): every gap re-read (gaps[].reassessed),
      every item kept, rewritten, folded or dropped (below and in dropped_items), and the open
      decisions asked in questions_for_user. Remaining: the user answers, the lead rewrites each
      answered decision as "decided by the user <date>", empties questions_for_user and applies the
      folds to 0006 and 0007.
    done_when: questions_for_user is empty and the folds are in plans 0006 and 0007.
    status: done
    evidence:
  - id: G1-GITLAB-FIXTURE
    milestone: G1
    title: GitLab CE in a docker container as a reproducible test fixture
    depends_on: ["0006:M5-FRESH-DEPLOY"]
    decision: >
      Restored by the user 2026-10-12 (R0 had dropped it). A reproducible GitLab, separate from the GitLab
      server that hosts this repository, is the fixture the integration tests and acceptance runs use as the
      workload on tenant clusters: a script under scripts/ starts gitlab/gitlab-ce pinned by digest with a
      generated root password (0600 file, never printed), waits for readiness, creates the test project from
      a template repository holding the acceptance .gitlab-ci.yml, and prints its URL and a runner
      registration token. It runs on the test host, never on the gateway (the gateway runs no containers).
      TLS from a local CA the guests trust through user_data, or plain http on the reachable address,
      decided when the item starts. Covers GAP-9.
    files: ["scripts/gitlab-fixture.sh", "deploy/gitlab-fixture/ (template project)"]
    done_when: one command brings up a fresh GitLab fixture and a project whose pipeline a runner on a tenant cluster picks up; a second command tears it down with nothing left.
    risks: ["GitLab CE needs several GiB of RAM; it runs on hat-8, not on the gateway host."]
    status: done
    evidence:
  - id: G1-CI-GATE
    milestone: G1
    title: GitLab CI runs the build gate for this repository
    depends_on: ["R0-REASSESS", "0006:M5-FRESH-DEPLOY"]
    decision: >
      Proposed by Claude (Q1, Q2, Q4): .gitlab-ci.yml at the repository root on
      gitlab.dorper-matrix.ts.net:8443. One job on every push to task/* and main runs the gate of
      agent-rules: go build ./..., go vet ./..., deno task check, deno install --frozen, deploy/check.sh
      --fast and the release closure (go run ./cmd/socialweb-tsbundle -release). Caches (GOCACHE,
      GOMODCACHE, DENO_DIR) live under the runner account's ~/.tmp, never /tmp. The runner is one
      gitlab-runner, shell executor, as a user unit of a dedicated unprivileged account on hat-8, tagged
      socialweb-computer-kcp and locked to this project; its registration token is sourced from a 0600
      file and never printed. The lead's merge reads the pipeline instead of rerunning the gate by hand.
      .github/workflows/typescript.yml is deleted (its deno test step contradicts the no-tests rule).
    files: [".gitlab-ci.yml", "scripts/ci-runner-install.sh", ".github/workflows/typescript.yml (deleted)"]
    done_when: a push to a task branch shows a green pipeline on the GitLab server running the full gate; the GitHub workflow is gone.
    risks: ["deploy/check.sh --fast runs the cross-OS builds; on a shared hat-8 runner its cost competes with agents' live runs. One concurrent job until measured."]
    status: done
    evidence:
  - id: G1-CI-RELEASE
    milestone: G1
    title: CI builds and publishes the release binary and the guest images
    depends_on: ["G1-CI-GATE"]
    decision: >
      Proposed by Claude (Q3): on main, a manual or tag-triggered job runs
      scripts/build-socialweb-computer.sh (two clean-checkout builds, byte-identical or refused) and
      scripts/build-guest-image.sh (as 0007 M1-GUEST-IMAGE planned: "CI will shell out to the same
      script later"), and uploads release/<commit>/ binaries, guest images and SHA256SUMS to the
      project's generic package registry. internal/versions/versions.json pins the guest image URLs
      there. scripts/deploy.sh and `upgrade --binary --sha256` take a commit and fetch from the
      registry.
    files: [".gitlab-ci.yml", "scripts/deploy.sh", "internal/versions/versions.json"]
    done_when: a release job publishes one commit's binaries, images and SHA256SUMS; a bidder host fetches and verifies an image from the registry URL.
    risks: ["The guest image build needs debugfs and a kernel toolchain on the runner host; the runner account gets them, bidders still need none."]
    status: done
    evidence: []
  - id: G2-IT-HARNESS
    milestone: G2
    title: The integration harness - one market network per test, driven by the socialweb-computer verbs
    depends_on: ["0006:M5-FRESH-DEPLOY"]
    decision: >
      Proposed by Claude (Q5): Go package test/integration behind build tag `integration`. Each test
      starts its own market network application: `socialweb-computer dev up --profile market-network
      --bidders N [--with-gateway]` with an instance name unique to the test and run, so tests run in
      parallel on one host; every address comes from kcp status (port 0); requesters are `run request
      --network <instance>`. On failure the harness prints the root status of each application (phase,
      conditions, status.execution once 0009 M1-EXECUTION-STATUS lands) and the DenoPod logs; on exit it
      runs `dev down` and checks that no unit, cgroup, VM work dir or ComputeVM of the instance is left.
      VMs use the shared test-0001 account and its per-account slot lock. No guest is started other than
      through the RFP flow.
    files: ["test/integration/harness.go"]
    done_when: an empty test brings a market network up and down twice in parallel and leaves nothing behind.
    risks: []
    status: done
    evidence:
  - id: G2-IT-REQUEST-SECRETS
    milestone: G2
    title: Integration test - run request with --secrets gets a VM through the RFP flow
    depends_on: ["G2-IT-HARNESS"]
    decision: >
      Proposed by Claude: one bidder. `run request --secrets <file>`: RFP -> bid -> accept -> cloud-init
      user_data; the ComputeContract reaches Running; the guest fetches its secrets bundle (reported in
      the contract status); ssh over the iroh ticket with StrictHostKeyChecking=yes against the
      guest-reported vm.hostKeys; `run release` gives vm.delete 200 and the ComputeVM, unit and work dir
      are gone.
    files: ["test/integration/request_secrets_test.go"]
    done_when: the test passes in CI (G3-CI-INTEGRATION).
    risks: []
    status: done
    evidence:
  - id: G2-IT-SCALE-TO-ZERO
    milestone: G2
    title: Integration test - a tenant k3s cluster scales from zero on market RFP VMs and back, with the NetworkPolicy matrix
    depends_on: ["G2-IT-HARNESS"]
    decision: >
      Proposed by Claude: market network with --with-gateway and two bidders. A tenant cluster created
      through the gateway's web app API idles at 0 nodes; two pods with anti-affinity produce two
      NodeClaims, two market RFP VMs join with no ssh; pod A on node A reaches pod B on node B, DNS
      resolves through CoreDNS; the NetworkPolicy matrix (was G2-NETPOL-MATRIX, GAP-6): deny-all ingress,
      egress deny, egress allow to one ipBlock, namespaceSelector allow, default-deny plus DNS-allow,
      each cross-node and each read with and without the policy; then the pods go, the nodes scale in one
      by one to 0, vm.delete 200 for each, the control plane stays Ready. Zero ssh sessions to guests in
      the web app, clusterprovider and bidder logs. This is plan 0005's acceptance (ACC-ZERO, ACC-MESH,
      ACC-NOSSH) as a repeatable test, replacing plan 0001 P4 and G1-ACCEPT-SCRIPT.
    files: ["test/integration/scale_to_zero_test.go"]
    done_when: the test passes in CI.
    risks: ["A tenant job image pull from the internet makes the test depend on the registry; pin the test images by digest."]
    status: done
    evidence:
  - id: G2-IT-BIDDER-RESTART
    milestone: G2
    title: Integration test - a bidder kill and restart keep its VMs and still release them
    depends_on: ["G2-IT-HARNESS", "0007:M6-LIVE-RECOVERY"]
    decision: >
      Proposed by Claude, reduced by the lead 2026-10-15 to the cases a `dev up` instance can run
      (`upgrade --binary` works only on an installed host): the regression form of 0007 M6-LIVE-RECOVERY
      cases (a)-(c) (was G3-RESTART-LEAK, GAP-3): rent a guest, then kill -9 the bidder's DenoPod, `dev
      restart` it, and kill -9 the bidder's core; after each the VM unit's InvocationID, firecracker pid
      and start ticks are unchanged, the ComputeVM is Running with the same guest address and onNetwork
      record, the issuer URL is the same; release gives vm.delete 200 and nothing is left. Case (d)
      (user-manager restart) and the `upgrade --binary` leg (0007 M6-BIDDER-UPGRADE) stay manual readings
      in 0007: (d) stops every unit of the account, and the upgrade needs an installed host.
    files: ["test/integration/bidder_restart_test.go"]
    done_when: the test passes in CI.
    risks: []
    status: done
    evidence: []
  - id: G2-IT-FAILOVER
    milestone: G2
    title: Integration test - two bidders, one dies mid-contract, the other takes the node
    depends_on: ["G2-IT-HARNESS"]
    decision: >
      Proposed by Claude (was G3-MULTI-BIDDER, GAP-2, ACC-FAILOVER; Q8): market network with
      --with-gateway and two bidders, each its own MarketBidder application with its own kcp. Both win
      contracts over a series of RFPs. Then one bidder's core and DenoPods are stopped after accept and
      before the node joins: the NodeClaim goes Lost after its join grace, the requester sends a new RFP,
      the other bidder wins, the node joins and the pod runs; when the stopped bidder comes back it
      releases the orphaned ComputeVM (0007 M4-CONTRACT-RESTORE) and the old receipt is released. No
      market protocol change; if one turns out to be needed, it is asked first.
    files: ["test/integration/failover_test.go"]
    done_when: the test passes in CI.
    risks: ["firstFree means the faster bidder wins most RFPs; the test sets the requester policy so both bidders win before the kill."]
    status: done
    evidence: []
  - id: G3-CI-INTEGRATION
    milestone: G3
    title: GitLab CI runs the integration suite
    depends_on: ["G1-CI-GATE", "G2-IT-REQUEST-SECRETS", "G2-IT-SCALE-TO-ZERO", "G2-IT-BIDDER-RESTART", "G2-IT-FAILOVER"]
    decision: >
      Proposed by Claude: a job on the hat-8 runner (kvm, test-0001 slots) runs `go test -tags integration
      ./test/integration/...` on every merge to main and nightly, tests in parallel, each in its own
      market network built from the commit under test with scripts/build-socialweb-computer.sh --dev.
      A failed run keeps the harness output as a pipeline artifact. Merges to main wait for it once it is
      green twice in a row.
    files: [".gitlab-ci.yml"]
    done_when: two consecutive green runs on main (ACC-REPEAT, first half).
    risks: ["16 VM slots are shared with agents' live runs; the job takes at most 6 and waits for slots."]
    status: done
    evidence: []
  - id: G3-PROD-CANARY
    milestone: G3
    title: A nightly canary, a scheduled GitHub Actions job, that runs a Job on a prod tenant cluster that scales from zero
    depends_on: ["0006:M5-FRESH-DEPLOY", "G1-CI-GATE"]
    decision: >
      Changed by the user 2026-10-17: the canary uses an ephemeral identity, not alice's bsky.social account.
      Each run makes a fresh key in the job, registers a did:plc whose PDS is a one-account PDS with an OAuth
      server (createOAuthLocalPds in ts/atproto-market/lib/atproto-helpers), served in the job behind the
      did-key-ingress-proxy (xrpc.fedproxy.com), mints the gateway's service-auth tokens locally, and tombstones
      the DID on PLC at the end, also on a failure. The gateway asks a cluster owner only for a did:plc or
      did:web whose #atproto key signs the token; the nodes are rented by the gateway's own requester, so the
      owner needs no handle, PDS or vouch. With --web-signin (on in the workflow) the identity also signs in to the
      web app over atproto OAuth and lists its cluster through the session; xrpc.fedproxy.com relays the form
      bodies and the DPoP-Nonce header that needs. No repository secret is needed.
      Changed by the user 2026-10-17: the canary is the scheduled GitHub Actions workflow
      `.github/workflows/prod-canary.yml` on a GitHub-hosted runner (hat-8 was offline), not a timer on a host.
      The text below is the earlier decision.
      Decided by the lead 2026-10-15 (the user may veto): the canary is a user systemd timer on hat-8, run as
      johnandersen777 (scripts/prod-canary.ts and deploy/canary/), not a GitLab pipeline; the credential files
      stay on that host and no secret goes to GitHub or GitLab. Each run creates canary-YYYYMMDD, applies a
      Job, waits for Succeeded, deletes the cluster and checks it is unlisted and the bidder's ComputeVM is
      gone, through the gateway's XRPC only. The pipeline, runner and long-lived cluster below are the
      superseded first proposal.
      Proposed by Claude (Q6, Q7; was G1-RUNNER and the prod half of G1-ACCEPT-SCRIPT): one long-lived
      canary tenant cluster on the prod gateway, created through the web app as the canary identity
      (headless sign-in from the credential file on the deploy host, never printed). A gitlab-runner with
      the kubernetes executor, its KUBECONFIG from the web app download, runs as a pod in that cluster
      or as a user unit beside the hat-8 CI runner, registered with a tag unique to the canary so no
      other runner takes its jobs (the M6-RUNNER1 lesson). A scheduled pipeline (nightly and after each
      prod deploy) runs one job on it: the cluster scales from 0 to a market RFP VM from the hat-8
      bobvmbuilder bidder, the job clones this repository from the GitLab server and passes, the cluster
      scales back to 0 with the control plane Ready. The job writes its readings (UTC times of claim,
      join, job, scale-in) as a pipeline artifact. This is the only part of this plan that touches prod,
      and only through the product's own front door.
    files: ["scripts/prod-canary.ts", "deploy/canary/"]
    done_when: two consecutive green canary runs on prod (ACC-REPEAT, second half).
    risks: ["A canary failure pages nobody yet; the pipeline status on the GitLab server is the signal."]
    status: done
    evidence: []
  - id: G4-NO-DEBUG-SSH
    milestone: G4
    title: Delete the debug node ssh path from the web app
    depends_on: ["R0-REASSESS"]
