      peers exchange records over the firehose only, and the prod 3-node proof
      reaches one hat-7 ComputeVM, Ready, then scale zero.

implementation_checklist:
  - "1. Add one publicMarketURL() source in the bidder service; offering and authorizer hostname both use it."
  - "2. Wire appctl bidder.go to pass that same host into ServiceAuth.Hostname; log both values at startup."
  - "3. Make requester resolveBidderEndpoint accept a DID ref, resolve its serviceEndpoint, and derive did:web from the same host form (port preserved)."
  - "4. Select requester service-auth authority by identity mode: oauth session only in oauth mode, local repo key otherwise; never ownerServiceAuth in localRepo RequireApproval."
  - "5. Add RequesterAssociate to appctl association and choose the service by role; write challenge = operator, keyId = subject."
  - "6. Fix deploy/apps/gateway/records.yaml and deploy/apps/market-bidder/records.yaml to the canonical direction and role service."
  - "7. Make identitycontroller, trust, policyengine trust and ssh transport require the role-specific service and canonical direction."
  - "8. Remove the manual approvedAssociations patch path from the acceptance story; document it as a workaround only."
  - "9. Run the live proof on a fresh gateway and bidder, then write the integration test."

acceptance_matrix:
  - check: "Requester associated"
    proof: "Requester MarketIdentity phase Ready, Condition Associated True, approvedAssociations contains the operator DID, and the record service is requester_associate."
  - check: "Bidder offering host equals verifier host"
    proof: "The offering endpointUrl host and the bidder ServiceAuth.Hostname are equal in status/log, and the requester audience derived from the offering equals both."
  - check: "submitRfp 200"
    proof: "Requester submits an RFP directly or through the offered service ref and receives 200, not 401 invalid service-auth token."
  - check: "3 NodeClaims become a hat-7 ComputeVM"
    proof: "Three NodeClaims are accepted, one ComputeVM is provisioned on the hat-7 bidder through the RFP flow, and the tenant nodes report Ready."
  - check: "Scale to zero"
    proof: "The tenant cluster scales back to zero, the guest is released, and the bidder reports the contract complete."
  - check: "No secrets in status"
    proof: "MarketIdentity, Application, NodeClaim and ComputeVM statuses contain no passwords, tokens, private keys or session material."

