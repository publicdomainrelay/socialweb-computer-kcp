test_matrix:
  accounts:
    - managed-associated (local PDS)
    - managed-unassociated (local PDS)
    - existing-pds-account (remote PDS)
    - existing-oauth-browser (remote account)
    - existing-oauth-qr (remote account)
    - existing-oauth-delegated (remote account)
  transports:
    - XRPC
    - Firehose subscribeRepos
    - Firehose JetStream
    - Both
  faults:
    - duplicate XRPC + firehose delivery
    - process restart between delivery and apply
    - out-of-order accept before bid/receipt
    - relay reconnect/cursor resume
    - missing ingress for Firehose
    - revoked association claim
    - expired OAuth session
  live:
    - this host: associated
    - hat-9: associated
    - hat-7: unassociated
    - socialweb.computer: prod gateway, Alice sign-in and tenant kubeconfig

acceptance_matrix:
  rule: >
    W0-MATRIX freezes these rows. Every row names a live host or a fixture
    that already exists or is still required. A row with neither is blocked,
    never silently skipped.
  proof_sources: |
    this host: the local bidder host, associated (W5-HOSTS)
    hat-9: associated bidder host (W5-HOSTS)
    hat-7: unassociated bidder host (W5-HOSTS)
    prod gateway: socialweb.computer gateway, Alice sign-in (W5-PROD)
    dev market network w3comms: disposable dev/CI market network
    test/integration: the integration suite under test/integration
  fixtures:
    local-pds: a Pds component with account, session and repo, on a loopback port, no ingress
    remote-pds: a RemotePDS with URL, DID and auth refs, including a fail-closed missing-auth case
    oauth-store: a token store with refresh, expiry and revoked-session cases
    qr-transfer: the com.fedfork.atprotoOauthQR transfer endpoint with nonce and burn-after-read
    relay-subscribeRepos: an external relay serving JSON and CBOR subscribeRepos frames
    jetstream: an external JetStream endpoint serving the same normalized events
    duplicate-injector: delivers one uri|#|cid twice over XRPC and the firehose
    restart-injector: stops the process between delivery and apply, then resumes the cursor
  rows:
    - account: managed-associated
      identity: localRepo + RequireApproval
      pds: local Pds
      roles: [bidder, requester]
      transports: [XRPC, Firehose subscribeRepos, JetStream, Both]
      fixtures: [local-pds, relay-subscribeRepos, jetstream, duplicate-injector, restart-injector]
      proof: [test/integration, this host, hat-9, dev market network w3comms]
      test: TestMarketAccountAndTransportMatrix/managed-associated
    - account: managed-unassociated
      identity: localRepo + Skip
      pds: local Pds
      roles: [bidder, requester]
      transports: [XRPC, Firehose subscribeRepos, JetStream, Both]
      fixtures: [local-pds, relay-subscribeRepos, jetstream, duplicate-injector]
      proof: [test/integration, this host, hat-7, dev market network w3comms]
      test: TestMarketAccountAndTransportMatrix/managed-unassociated
    - account: existing-pds-account
      identity: pdsAccount
      pds: RemotePDS
      roles: [bidder, requester]
      transports: [XRPC, Firehose subscribeRepos, JetStream, Both]
      fixtures: [remote-pds, relay-subscribeRepos, jetstream]
      proof: [test/integration, this host, dev market network w3comms]
      test: TestMarketAccountAndTransportMatrix/existing-pds-account
    - account: existing-oauth-browser
      identity: oauthBrowser
      pds: RemotePDS
      roles: [bidder, requester]
      transports: [XRPC, Firehose subscribeRepos, JetStream, Both]
      fixtures: [remote-pds, oauth-store, relay-subscribeRepos, jetstream]
      proof: [test/integration, this host, prod gateway]
      test: TestMarketAccountAndTransportMatrix/existing-oauth-browser
    - account: existing-oauth-qr
      identity: oauthQr
      pds: RemotePDS
      roles: [bidder, requester]
      transports: [XRPC, Firehose subscribeRepos, JetStream, Both]
      fixtures: [remote-pds, qr-transfer, oauth-store, relay-subscribeRepos, jetstream]
      proof: [test/integration, this host, prod gateway]
      test: TestMarketAccountAndTransportMatrix/existing-oauth-qr
    - account: existing-oauth-delegated
      identity: oauthDelegated
      pds: RemotePDS
      roles: [bidder, requester]
      transports: [XRPC, Firehose subscribeRepos, JetStream, Both]
      fixtures: [remote-pds, oauth-store, relay-subscribeRepos, jetstream]
      proof: [test/integration, this host]
      test: TestMarketAccountAndTransportMatrix/existing-oauth-delegated
  faults:
    - fault: duplicate delivery (XRPC + firehose)
      fixtures: [duplicate-injector]
      proof: [test/integration, this host, dev market network w3comms]
      test: TestMarketDuplicateDeliveryCreatesOneObject
    - fault: process restart between delivery and apply
      fixtures: [restart-injector]
      proof: [test/integration, this host, dev market network w3comms]
      test: TestMarketRestartResumesCursorsAndDedupe
    - fault: out-of-order accept before bid/receipt and out-of-order event
      fixtures: [duplicate-injector]
      proof: [test/integration, this host, dev market network w3comms]
      test: TestMarketOutOfOrderAcceptConverges
    - fault: missing source fails closed (Firehose without ingress or EventStream)
      fixtures: [local-pds]
      proof: [test/integration, this host, dev market network w3comms]
      test: TestMarketFirehoseFailsClosedWithoutIngress
    - fault: missing auth fails closed (RemotePDS without auth ref)
      fixtures: [remote-pds]
      proof: [test/integration, this host, prod gateway]
      test: TestMarketRemotePDSMissingAuthFailsClosed
    - fault: relay reconnect and cursor resume
      fixtures: [relay-subscribeRepos, jetstream]
      proof: [test/integration, this host]
      test: TestMarketRelayReconnectResumesCursor
    - fault: revoked association claim
      fixtures: [relay-subscribeRepos]
      proof: [test/integration, this host, hat-9]
      test: TestMarketAssociationRevocationRemovesApproval
    - fault: expired OAuth session
      fixtures: [oauth-store]
      proof: [test/integration, this host, prod gateway]
      test: TestMarketExpiredSessionReportsSignInAgain

risks: |
  Existing-account mode writes market records into the real account repo. Keep
  it explicit opt-in and document the risk.

  OAuth QR depends on the external qr.fedfork.com/did-key-associator protocol.
  Keep qrOrigin configurable and isolate the poller.

  Firehose for a local PDS needs ingress/relay crawl. Do not silently call XRPC
  when the selected mode cannot be satisfied.

  Dedupe keys for updates need one rule: URI+CID for versions, URI for one-shot
  side effects. Write it down and test both.

  AtprotoRecordWatch status can grow; keep only bounded watched records and
  per-source cursors.

  RemotePDS auth refs and session refresh are security-sensitive; test
  fail-closed and never log tokens.

  Legacy inverted bidder association records must remain readable while new
  writes are canonical.

decisions:
  account_default: "managed associated (localRepo + RequireApproval)"
  comms_default: "Both when relay/firehose sources are configured; XRPC otherwise"
  existing_account: "explicit opt-in; market records live in the real account repo"
  qr_origin: "configurable; reuse qr.fedfork.com initially"
  association_shape: "canonical challenge=operator,keyId=subject; legacy read fallback"
  dedupe: "StateSync deterministic objects; uri|#|cid for versions; URI for one-shot effects"
  abstraction: "AtprotoRepo binding plus MarketIdentity account; no separate AtprotoAccount CR"
