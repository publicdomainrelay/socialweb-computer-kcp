    wave: W4
    track: cleanup
    parallel_with: [W4-MIGRATION, W4-DOCS]
    depends_on: [W4-APP-ROOTS]
    status: done
    evidence: []
    decision: >
      Delete BidderIdentityMode, dead CheckSignIn OAuth branch, direct
