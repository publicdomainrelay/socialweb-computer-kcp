    from:
      - "user decision 2026-10-11 minimum systemd"
  - name: netsh
    kind: executable
    fate: host-prerequisite
    owner: 0011 M0-REVISIT
    why: a Windows OS component read by internal/hostos portrange_windows.go; compiled only for GOOS=windows, outside this Linux plan
