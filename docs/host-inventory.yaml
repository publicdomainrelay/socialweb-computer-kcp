note: >
  Plan 0006 M1-HOST-INVENTORY. Everything the control-plane container (deploy/control-plane-container/
  Dockerfile, stages tools, controlplane and k8s), the bidder's firecracker runner image
  (ts/hono-compute-provider/hono-firecracker-standalone/Dockerfile) and the code's exec call sites supplied,
  each with exactly one fate on a bare Linux host. Call sites scanned: exec.Command, exec.CommandContext,
  exec.LookPath and syscall.Exec in non-test Go of this repo, and new Deno.Command in non-test TypeScript of
  this repo: socialweb-computer-k8s and every vendored repository under ts/. A computed first
  argument is listed under indirect with every executable it resolves to.
  The runner image, its Dockerfile, the container's nodeimage stage, cmd/socialweb-nodeboot,
  cmd/socialweb-nodeimage and cmd/socialweb-nodeinit are deleted (0006 M3-FOLD); a "from" naming one of
  them records where the executable used to come from.
  Fates that name a
  decision not yet in a plan item say so in why ("decided by Claude, user may veto").

fates:
  linked: compiled into the socialweb-computer core binary as a package or verb (go:embed for data files); nothing separate ships
  embedded-server: an embedded per-GOOS_GOARCH asset (M1-ASSETS) run as its own long-running unit or HostProcess; driven_by names the CRD, or the core's local state, that starts it
  embedded-child: an embedded asset run as a child of the core unit (deno and the TypeScript closure it runs)
  embedded-tool: an embedded asset run to completion by the core or a unit's start stage
  replaced-by-go: the job moves into Go in the core binary; the executable is never needed
  download-asset: fetched and sha256-verified, never installed from a package manager (served by the door, or a guest image pinned in versions.json and built by scripts/build-guest-image.sh)
  host-file: written by `socialweb-computer install` (root, once), never by hand
  host-prerequisite: the host must supply it and check-host probes it by name; the only fate that comes from the host
  build-host: needed only on a build or development host (guest image build, market network tooling), never on a gateway, bidder or requester runtime host
  removed-legacy: deleted by design or legacy that is not ported; no runtime host needs it

entries:
  - name: socialweb-gateway
    kind: executable
    fate: linked
    owner: 0006 M1-CLI, M3-SERVE-GATEWAY-KCP
    why: the gateway becomes `socialweb-computer serve gateway`
    from:
      - "image k8s COPY"
  - name: socialweb-clusterprovider
    kind: executable
    fate: linked
    owner: 0006 M1-CLI, M3-SERVE-GATEWAY-KCP
    why: the cluster provider becomes a verb of the core binary
    from:
      - "image k8s COPY"
  - name: socialweb-cloud-controller-manager
    kind: executable
    fate: linked
    owner: 0006 M1-CLI, M3-CLUSTER-UNITS
    why: a core-binary verb run as a member unit of each cluster's slice
    from:
      - "image k8s COPY"
      - "HostProcess member unit argv via clusterstack CloudControllerManagerArgv"
  - name: socialweb-vault
    kind: executable
    fate: linked
    owner: 0006 M1-CLI, M2-OPENBAO-SERVER
    why: apply-root and prepare-root become core verbs
    from:
      - "image k8s COPY"
  - name: socialweb-tenantcredential
    kind: executable
    fate: linked
    owner: 0006 M1-CLI
    why: an internal re-exec verb of the core binary
    from:
      - "image k8s COPY"
  - name: socialweb-computer-kcp-check-host
    kind: executable
    fate: linked
    owner: 0006 M1-CLI, M2-HOST-CONTRACT
    why: becomes `socialweb-computer check-host`; its SELinux probe execs its own copy, which is the core binary
    from:
      - "image controlplane COPY"
      - "image nodeimage COPY"
      - "check-host checks.go copyPath"
  - name: container-entrypoint
    kind: executable
    fate: linked
    owner: 0006 M2-BOOTSTRAP-LAYER, M3-SERVE-GATEWAY-KCP, M5-RETIRE
    why: its sequence (root bao, kcp, apply-root, bootstrap applies, gateway, clusterprovider, socat, door) becomes the core's bootstrap layer and kcp-reconciled units; the shell script is deleted with the container path
    from:
      - "image k8s COPY of deploy/container-entrypoint.sh"
  - name: kcp
    kind: executable
    fate: embedded-server
    driven_by: the core, from local state (alternating blue/green slot units behind the core's own L4 front)
    owner: 0006 M2-KCP-SLOTS, M1-ASSETS
    why: the unpatched release v0.33.0 as a zstd asset, out of process (user decision 2026-10-12, kcp-spike.md route B)
    from:
      - "image controlplane COPY"
      - "check-host checks.go path"
  - name: kine
    kind: executable
    fate: embedded-server
    driven_by: Cluster (a member unit of each cluster's slice); the core for kcp's own store
    owner: 0006 M3-CLUSTER-UNITS, M2-KCP-STORE, M1-ASSETS
    why: each cluster's store is kine over its own postgres; kcp's store is kine over a dedicated postgres unit
    from:
      - "image controlplane COPY"
      - "check-host checks.go"
      - "HostProcess member unit argv via clusterstack KineArgv"
  - name: postgres
    kind: executable
    fate: embedded-server
    driven_by: Postgres CRD (each cluster's postgres); the core for kcp's own postgres unit
    owner: 0006 M2-POSTGRES, M2-KCP-STORE, M0-PG-SOURCE, M1-ASSETS
    why: a relocatable PostgreSQL 18 set; the build (prebuilt vs from source) is M0-PG-SOURCE's pending choice
    from:
      - "image controlplane dnf postgresql-server"
      - "internal/clusterprovider/postgres.go"
      - "check-host postgres.go"
  - name: bao
    kind: executable
    fate: embedded-server
    driven_by: OpenBaoServer CRD (root and bidder vaults); Cluster for the per-cluster bao member unit
    owner: 0006 M2-OPENBAO-SERVER, M3-CLUSTER-UNITS, M1-ASSETS
    why: OpenBao v2.6.2 as an asset
    from:
      - "image controlplane COPY"
      - "HostProcess member unit argv via clusterstack OpenBaoArgv"
  - name: k3s
    kind: executable
    fate: embedded-server
    driven_by: Cluster (a member unit of each cluster's slice, blue/green slots behind the per-cluster front)
    owner: 0006 M3-CLUSTER-UNITS, M3-CP-SLOTS, M1-ASSETS
    why: the tenant control plane
    from:
      - "image controlplane COPY"
      - "image nodeimage COPY"
      - "check-host checks.go"
      - "socialweb-nodeimage k3sdata.go"
      - "HostProcess member unit argv"
  - name: external-secrets
    kind: executable
    fate: embedded-server
    driven_by: Cluster (controller and webhook, two member units of each cluster's slice)
    owner: 0006 M3-CLUSTER-UNITS, M1-ASSETS
    why: the digest-pinned upstream binary, now an asset instead of an image copy
    from:
      - "image controlplane COPY"
      - "HostProcess member unit argv via clusterstack ExternalSecretsArgv"
  - name: dumbpipe
    kind: executable
    fate: embedded-server
    driven_by: ClusterLink (member units of each cluster's slice); the requester instance's tunnel HostProcess
    owner: 0006 M3-CLUSTER-UNITS, M1-ASSETS, 0008 M4-RUN-REQUEST
    why: the iroh transport, the only guest transport kept (user decision 2026-10-12); the requester's `which dumbpipe` lookup goes with the asset
    from:
      - "image k8s curl download"
      - "HostProcess member unit argv via clusterlink.Argv"
      - "ts/atproto-market requester-xrpc ensureDumbpipe"
  - name: firecracker
    kind: executable
    fate: embedded-server
    driven_by: ComputeVM (the VM unit, launched directly by the service manager)
    owner: 0007 M2-VM-RUNTIME, 0006 M1-ASSETS
    why: no runner container; the VMM is the VM unit's own process
    from:
      - "runner image COPY"
      - "check-host checks.go"
      - "internal/vmruntime firecracker_linux.go VM unit argv (socialweb-vmexec execs it)"
  - name: pasta
    kind: executable
    fate: embedded-server
    driven_by: ComputeVM (the VM unit's network stage, in the VM's own user and network namespace)
    owner: 0007 M2-VM-RUNTIME, 0006 M1-ASSETS, M1-INSTALL (AppArmor profile)
    why: from passt; the constant pasta gateway replaces the network-index allocator
    from:
      - "runner image dnf passt"
      - "check-host checks.go"
      - "internal/vmruntime firecracker_linux.go VM unit argv"
  - name: deno
    kind: executable
    fate: embedded-child
    owner: 0008 M1-DENO, M1-TS-CLOSURE, 0006 M1-ASSETS
    why: deno 2.9.3 run by the core as the DenoPod runtime (door, bidder, requester); internal/denorun builds every argv; cmd/socialweb-tsbundle fills and probes the closure with it at build time
    from:
      - "image k8s curl download"
      - "internal/denorun/denorun.go"
      - "internal/tsbundle/tsbuild/build.go"
  - name: initdb
    kind: executable
    fate: embedded-tool
    owner: 0006 M2-POSTGRES, M0-PG-SOURCE
    why: part of the relocatable postgres set, run once per data dir
    from:
      - "image controlplane dnf postgresql-server"
      - "internal/clusterprovider/postgres.go"
      - "check-host postgres.go"
  - name: pg_dump
    kind: executable
    fate: embedded-tool
    owner: 0006 M2-KCP-STORE, M3-CP-SLOTS, M0-PG-SOURCE
    why: the dump taken before each kcp or k3s upgrade; joins the postgres asset set
    from:
      - "plan 0006 M2-KCP-STORE"
  - name: socialweb-vmexec
    kind: executable
    fate: embedded-tool
    owner: 0007 M2-VM-RUNTIME
    why: the VM unit's one-shot stage inside pasta's namespace (tap, bridge, pinned neighbor over netlink) that execs firecracker; no socialweb-computer code stays in the VM's process tree
    from:
      - "cmd/socialweb-vmexec"
  - name: socialweb-computer
    kind: executable
    fate: linked
    owner: 0007 M2-VM-RUNTIME
    why: the firecracker provider's vmruntime microvm runs `socialweb-computer internal vm` (one-shot prep, unit start, inspect, stop); the kcp provider's guests are booted by the ComputeVM controller in the core of the bidder's own instance (0007 M2-CONTROLLER)
    from:
      - "ts/hono-compute-provider microvm-vmruntime"
  - name: swc-userns-stage
    kind: executable
    fate: embedded-tool
    owner: 0007 M0-VM-USERNS, M2-VM-RUNTIME
    why: first word of each VM unit's ExecStart; creates the per-VM subuid user namespace through newuidmap/newgidmap and execs pasta; static, built reproducibly by scripts/build-userns-stage.sh, pinned in versions.json
    from:
      - "deploy/swc-userns-stage/stage.c"
      - "internal/vmruntime (VM unit ExecStart)"
  - name: psql
    kind: executable
    fate: replaced-by-go
    owner: 0006 M2-POSTGRES
    why: bootstrap rows and readiness go through pgx
    from:
      - "image controlplane dnf postgresql"
      - "internal/clusterprovider/bootstraprows.go"
      - "internal/clusterprovider/postgres.go"
      - "check-host postgres.go"
  - name: kubectl
    kind: executable
    fate: replaced-by-go
    owner: 0006 M2-APPLY
    why: every apply goes through internal/kcpapply (dynamic client, server-side apply)
    from:
      - "image controlplane COPY"
      - "check-host checks.go"
      - "deploy/container-entrypoint.sh"
      - "deploy/install-provider.sh"
  - name: yq
    kind: executable
    fate: replaced-by-go
    owner: 0006 M2-APPLY, M2-TEMPLATE
    why: manifest rendering and patching move into kcpapply and the template layer
    from:
      - "image k8s dnf yq"
  - name: socat
    kind: executable
    fate: replaced-by-go
    owner: 0006 M3-SERVE-GATEWAY-KCP
    why: the TLS terminator becomes a crypto/tls proxy in the core
    from:
      - "image k8s dnf socat"
      - "deploy/container-entrypoint.sh"
  - name: openssl
    kind: executable
    fate: replaced-by-go
    owner: 0006 M3-SERVE-GATEWAY-KCP
    why: certificates are minted with crypto/x509
    from:
      - "image k8s dnf openssl"
  - name: ip
    kind: executable
    fate: replaced-by-go
    owner: 0007 M2-VM-RUNTIME
    why: netlink in socialweb-vmexec; the identical per-guest address plan needs no host address scan
    from:
      - "image k8s dnf iproute"
      - "runner image dnf iproute"
      - "internal/nodevm/namespace.go"
  - name: which
    kind: executable
    fate: replaced-by-go
    owner: 0006 M1-ASSETS
    why: assets are resolved by their extracted path, never searched on PATH; the requester's which dumbpipe goes
    from:
      - "image k8s dnf which"
      - "ts/atproto-market requester-xrpc ensureDumbpipe"
  - name: unzip
    kind: executable
    fate: replaced-by-go
    owner: 0006 M1-ASSETS
    why: only unpacked the deno release in the image build; assets are zstd blobs the core extracts
    from:
      - "image k8s dnf unzip"
  - name: curl
    kind: executable
    fate: replaced-by-go
    owner: 0006 M1-ASSETS
    why: only fetched deno, dumbpipe and the ESO bundle at image build time; those are embedded assets now
    from:
      - "image esobundle and k8s RUN curl"
  - name: ssh-keygen
    kind: executable
    fate: replaced-by-go
    owner: 0007 M4-HOST-KEYS, 0008 M4-RUN-REQUEST
    why: ed25519 keypairs are minted in-process with golang.org/x/crypto/ssh and kept in the application's own OpenBao (every key lives there, user decision 2026-10-12); decided by Claude, user may veto
    from:
      - "ts/atproto-market requester-xrpc generateKeypair"
      - "ts/hono-compute-provider systemctl-shim"
  - name: ssh
    kind: executable
    fate: host-prerequisite
    owner: 0008 M4-RUN-REQUEST, M4-RUN-GATEWAY-SSH
    why: the person's own OpenSSH client for the interactive session on a requester host (ProxyCommand over dumbpipe); not needed on gateway or bidder hosts
    from:
      - "ts/atproto-market requester-xrpc"
      - "image k8s dnf openssh-clients"
  - name: newuidmap
    kind: executable
    fate: host-prerequisite
    owner: 0007 M2-VM-RUNTIME, 0006 M2-HOST-CONTRACT
    why: the distro's setuid helper (rootless podman's) maps each VM's subuid range; a setuid helper is never shipped as an asset; bidders only
    from:
      - "user decision 2026-10-12 per-VM subuid user namespaces"
  - name: newgidmap
    kind: executable
    fate: host-prerequisite
    owner: 0007 M2-VM-RUNTIME, 0006 M2-HOST-CONTRACT
    why: as newuidmap, for the subgid range; bidders only
    from:
      - "user decision 2026-10-12 per-VM subuid user namespaces"
  - name: useradd
    kind: executable
    fate: host-prerequisite
    owner: 0006 M1-INSTALL
    why: the distro's shadow tool creates the one system account (socialweb or swc-bidder); only install, run as root, ever execs it
    from:
      - "user decision 2026-10-12 accounts are created only by install"
  - name: userdel
    kind: executable
    fate: host-prerequisite
    owner: 0006 M1-INSTALL
    why: uninstall --purge deletes the account install created, and only that one
    from:
      - "user decision 2026-10-12 install with uninstall"
  - name: gpasswd
    kind: executable
    fate: host-prerequisite
    owner: 0006 M1-INSTALL
    why: adds the bidder account to kvm before linger, and uninstall removes the membership install added
    from:
      - "user decision 2026-10-12 kvm before linger"
  - name: apparmor_parser
    kind: executable
    fate: host-prerequisite
    owner: 0006 M1-INSTALL, M2-HOST-CONTRACT
    why: loads and unloads the socialweb-pasta profile only where AppArmor restricts unprivileged user namespaces (Ubuntu 24.04+)
    from:
      - "user decision 2026-10-11 AppArmor profile for the embedded pasta"
  - name: unshare
    kind: executable
    fate: host-prerequisite
    owner: 0007 M0-VM-USERNS, 0006 M2-HOST-CONTRACT
    why: util-linux unshare >= 2.38, required only if M0-VM-USERNS chooses it for the userns stage; check-host already probes it; cmd/socialweb-tsbundle starts every closure entry under unshare -rn at build time
    from:
      - "check-host checks.go"
      - "internal/tsbundle/tsbuild/build.go"
      - "cmd/socialweb-tsbundle/main.go"
  - name: systemd
    kind: executable
    fate: host-prerequisite
    owner: 0006 M2-HOST-UNITS, M2-HOST-CONTRACT
