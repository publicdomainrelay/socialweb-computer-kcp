# System integration tests: the acceptance runbooks (docs/acceptance) run against a target (staging or prod).
# No unit tests. Members: testkit (the harness), system (one test file per runbook).
[workspace]
resolver = "3"
members = ["testkit", "system"]

[workspace.package]
edition = "2024"
license = "Unlicense"
publish = false

[workspace.dependencies]
testkit = { path = "testkit" }
anyhow = "1"
# atlibs-host: app-password sessions saved in a state dir (no createSession per run), service auth, PDS/PLC reads.
atlibs-host = { git = "https://knotless.dev/johnandersen777.bsky.social/atlibs", rev = "9adbae84c59fa7c30916489b6f110f9f36bc2bb0" }
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["latest"] }
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "ring"] }
# 0.12: the reqwest atlibs-host implements its Fetch for.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
