# System integration tests: the acceptance runbooks (docs/acceptance) run against a target (staging or prod).
# No unit tests. Members: testkit (the harness), system (one test file per runbook), vmm (the VMM wrapper on a KVM host),
# host (swc-test-host: runs the test compositions). modules/ is its own workspace (wasm32).
[workspace]
resolver = "3"
members = ["testkit", "system", "vmm", "host"]
default-members = ["testkit", "system", "host"]
exclude = ["modules"]

[workspace.package]
edition = "2024"
license = "Unlicense"
publish = false

[workspace.dependencies]
testkit = { path = "testkit" }
anyhow = "1"
# atlibs-host, atlibs-iroh, atlibs-kube, atlibs-ssh, identlink: the atlibs pin set (atlibs pins.json, one copy of
# each; AGENTS.md: pins.sh check). atlibs-host: app-password sessions saved in a state dir (no createSession per
# run), service auth, PDS/PLC reads.
atlibs-host = { git = "https://knotless.dev/johnandersen777.bsky.social/atlibs", rev = "5e3fd8de0bcbb4e2d3784bc295d5fb55134f7238" }
# iroh tickets of offering / onNetwork addresses; its raw `dumbpipe connect` is the iroh stream
atlibs-iroh = { git = "https://knotless.dev/johnandersen777.bsky.social/atlibs-iroh", rev = "f30defda283bc63ee8102d494f94b572bce4cb7c" }
atlibs-kube = { git = "https://knotless.dev/johnandersen777.bsky.social/atlibs-kube", rev = "d8b92c6980956de3c79aa21ca132fbaf78a5ca20" }
atlibs-ssh = { git = "https://knotless.dev/johnandersen777.bsky.social/atlibs-ssh", rev = "d0462d3a44696a1c85daf115b9657d5fd2b085a5" }
# ident.link walks over verified sync.getRecord, the market's computed rkeys
identlink = { git = "https://knotless.dev/johnandersen777.bsky.social/atlibs-identlink", rev = "aa7cacc3b355b217d7087cb3a95eb61ab16c8ad7", features = ["native"] }
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["latest"] }
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "ring"] }
# 0.12: the reqwest atlibs-host implements its Fetch for.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
