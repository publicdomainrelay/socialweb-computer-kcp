# The test compositions' modules (wasm32-unknown-unknown): `cargo build --release --target wasm32-unknown-unknown`.
# Each member is one module: its module.json beside its Cargo.toml.
[workspace]
resolver = "3"
members = ["steps", "assert", "acc-0004", "acc-0001", "acc-0013", "acc-0005", "acc-0003", "acc-0002", "acc-0006", "acc-0007", "acc-0008", "acc-0009", "acc-0011", "acc-0012", "acc-0014", "acc-0015", "acc-0016", "acc-0017", "staging", "knotless"]

[workspace.package]
edition = "2024"
license = "Unlicense"
publish = false

[workspace.dependencies]
abi = { git = "https://knotless.dev/johnandersen777.bsky.social/atlibs", rev = "0d1b9b6ec3d2bf8a8912ab246200c9f675a6a8ed" }
serde_json = "1"
steps = { path = "steps" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
