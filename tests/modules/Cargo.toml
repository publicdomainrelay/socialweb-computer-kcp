# The test compositions' modules (wasm32-unknown-unknown): `cargo build --release --target wasm32-unknown-unknown`.
# Each member is one module: its module.json beside its Cargo.toml.
[workspace]
resolver = "3"
members = ["steps", "assert", "acc-0004", "acc-0001", "acc-0013", "acc-0005", "acc-0003", "acc-0002"]

[workspace.package]
edition = "2024"
license = "Unlicense"
publish = false

[workspace.dependencies]
abi = { git = "https://knotless.dev/johnandersen777.bsky.social/atlibs", rev = "52542c7d5a8edc8f0bb7fab5f0c9683ac2a69a21" }
serde_json = "1"
steps = { path = "steps" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
