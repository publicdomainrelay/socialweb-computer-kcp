apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-1.atircnodes.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: AtircNode
    listKind: AtircNodeList
    plural: atircnodes
    singular: atircnode
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              handle:
                type: string
              nick:
                type: string
              channels:
                type: array
                items:
                  type: string
              peers:
                type: array
                items:
                  type: string
              jetstream:
                type: string
              ircPort:
                type: integer
                format: int32
              configDir:
                type: string
              passwordEnvFile:
                type: string
              noPublish:
                type: boolean
            required:
              - handle
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              phase:
                type: string
                enum:
                  - Pending
                  - Starting
                  - Running
                  - Failed
              message:
                type: string
              identity:
                type: string
              configDir:
                type: string
              hostProcess:
                type: string
              runtime:
                type: object
                properties:
                  backend:
                    type: string
                  unit:
                    type: string
                  invocationID:
                    type: string
                  pid:
                    type: integer
                    format: int64
                  startTicks:
                    type: integer
                    format: int64
                  hostBootID:
                    type: string
                  manager:
                    type: string
                  activeSince:
                    type: string
                required:
                  - backend
                  - unit
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Identity
          type: string
          jsonPath: .status.identity
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: PID
          type: integer
          jsonPath: .status.runtime.pid
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
