name: relay
entry: hono-atproto-relay
stateDir: "{{.StateDir}}/relay-relay"
memory: 512Mi
serviceAccount: deno-runner
tls: serve
trust: ["{{.GuestTLSDir}}/ca.crt"]
args: ["--port", "0", "--hostname", "127.0.0.1", "--kv-path", "{{.StateDir}}/relay-relay/kv.sqlite3"]
env:
  PORT: "0"
  HOSTNAME: relay.default.relay.svc.kcp.local
permissions:
  net: true
  env: true
  sys: true
probe:
  host: relay.default.relay.svc.kcp.local
  path: /xrpc/_health
