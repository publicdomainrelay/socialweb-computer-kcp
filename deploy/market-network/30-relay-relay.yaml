name: relay
entry: hono-atproto-relay
edge: "a market network front: it binds port 0 once and keeps that port across a core restart (ports.json)"
stateDir: "{{.StateDir}}/relay-relay"
memory: 1Gi
serviceAccount: deno-runner
tls: serve
trust: ["{{.GuestTLSDir}}/ca.crt"]
args: ["--port", "{{.Ports.Relay}}", "--hostname", "127.0.0.1", "--kv-path", "{{.StateDir}}/relay-relay/kv.sqlite3"]
env:
  PORT: "{{.Ports.Relay}}"
  HOSTNAME: relay.default.relay.svc.kcp.local
permissions:
  net: true
  env: true
  sys: true
probe:
  host: relay.default.relay.svc.kcp.local
  path: /xrpc/_health
