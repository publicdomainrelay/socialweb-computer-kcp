name: pds
entry: hono-pds
edge: "a market network front: it binds port 0 once and keeps that port across a core restart (ports.json)"
stateDir: "{{.StateDir}}/bob-pds"
memory: 2Gi
serviceAccount: deno-runner
tls: serve
args: ["--port", "{{.Ports.BobPds}}", "--hostname", "127.0.0.1", "--kv-path", "{{.StateDir}}/bob-pds/kv.sqlite3"]
env:
  PORT: "{{.Ports.BobPds}}"
  HOSTNAME: "127.0.0.1"
  PDS_PUBLIC_HOSTNAME: pds.default.bob.svc.kcp.local
  PDS_PLC_DIRECTORY_URL: https://plc.default.global.svc.kcp.local
  PDS_CRAWLERS: https://relay.default.relay.svc.kcp.local
  PDS_SUBSCRIBE_REPOS_FORMAT: json
  PDS_PRIVATE_KEY_HEX: "{{.BobPDSPrivateKeyHex}}"
  PDS_WRITE_LIMIT_FILE: "{{.StateDir}}/bob-pds/write-limit.json"
permissions:
  net: true
  env: true
  sys: true
probe:
  host: pds.default.bob.svc.kcp.local
  path: /xrpc/_health
