apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-10.marketnetworks.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: MarketNetwork
    listKind: MarketNetworkList
    plural: marketnetworks
    singular: marketnetwork
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              profile:
                type: string
              guestLabel:
                type: string
              apps:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                      enum:
                        - MarketBidder
                        - MarketRequester
                        - Gateway
                        - SshGateway
                    profile:
                      type: string
                    policy:
                      type: string
                    firecracker:
                      type: object
                      properties:
                        workRoot:
                          type: string
                        vmruntimeCommand:
                          type: array
                          items:
                            type: string
                      required:
                        - workRoot
                        - vmruntimeCommand
                    kcp:
                      type: object
                      properties:
                        handle:
                          type: string
                        vmHostBackend:
                          type: string
                        guestImageSource:
                          type: string
                        stopGraceSeconds:
                          type: integer
                          format: int32
                      required:
                        - guestImageSource
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                        required:
                          - name
                    quota:
                      type: object
                      properties:
                        bids:
                          type: integer
                          format: int32
                        computeVMs:
                          type: integer
                          format: int32
                        computeContracts:
                          type: integer
                          format: int32
                        nodeClaims:
                          type: integer
                          format: int32
                        policyWorkflowRuns:
                          type: integer
                          format: int32
                        denoRuns:
                          type: integer
                          format: int32
                    ownerSessionsFile:
                      type: string
                    clusterProvider:
                      type: object
                      properties:
                        scaleHold:
                          type: string
                        scaleMaxNodes:
                          type: integer
                          format: int32
                        scalePodsPerNode:
                          type: integer
                          format: int32
                    stopped:
                      type: boolean
                  required:
                    - name
                    - kind
                    - profile
            required:
              - profile
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              phase:
                type: string
                enum:
                  - Pending
                  - Provisioning
                  - Ready
                  - Deleting
                  - Failed
              message:
                type: string
              network:
                type: object
                properties:
                  plcDirectoryUrl:
                    type: string
                  ingressProxyHost:
                    type: string
                  relayUrls:
                    type: array
                    items:
                      type: string
                  firehoseUrls:
                    type: array
                    items:
                      type: string
                  qrOrigin:
                    type: string
                  guestTlsUrl:
                    type: string
                  caBundleRef:
                    type: string
                  hosts:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        address:
                          type: string
                      required:
                        - name
                        - address
                required:
                  - plcDirectoryUrl
                  - ingressProxyHost
                  - relayUrls
                  - firehoseUrls
                  - qrOrigin
              bidderPdsUrl:
                type: string
              components:
                type: array
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    workspace:
                      type: string
                    phase:
                      type: string
                    ready:
                      type: boolean
                  required:
                    - kind
                    - name
                    - workspace
                    - ready
              listeners:
                type: array
                items:
                  type: object
                  properties:
                    component:
                      type: string
                    name:
                      type: string
                    kind:
                      type: string
                    address:
                      type: string
                  required:
                    - component
                    - name
                    - kind
                    - address
              apps:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                      enum:
                        - MarketBidder
                        - MarketRequester
                        - Gateway
                        - SshGateway
                    instance:
                      type: string
                    kcpUrl:
                      type: string
                    workspace:
                      type: string
                    phase:
                      type: string
                      enum:
                        - Pending
                        - Provisioning
                        - Ready
                        - Deleting
                        - Failed
                    message:
                      type: string
                    did:
                      type: string
                    components:
                      type: array
                      items:
                        type: object
                        properties:
                          kind:
                            type: string
                          name:
                            type: string
                          workspace:
                            type: string
                          phase:
                            type: string
                          ready:
                            type: boolean
                        required:
                          - kind
                          - name
                          - workspace
                          - ready
                    listeners:
                      type: array
                      items:
                        type: object
                        properties:
                          component:
                            type: string
                          name:
                            type: string
                          kind:
                            type: string
                          address:
                            type: string
                        required:
                          - component
                          - name
                          - kind
                          - address
                  required:
                    - name
                    - kind
              stateDir:
                type: object
                properties:
                  path:
                    type: string
                  bytes:
                    type: integer
                    format: int64
                  files:
                    type: integer
                    format: int64
                  sampledAt:
                    type: string
                required:
                  - path
                  - bytes
                  - files
                  - sampledAt
              gc:
                type: object
                properties:
                  sampledAt:
                    type: string
                  objects:
                    type: integer
                    format: int64
                  orphanTotal:
                    type: integer
                    format: int64
                  orphans:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        count:
                          type: integer
                          format: int64
                        examples:
                          type: array
                          items:
                            type: string
                      required:
                        - kind
                        - count
                  stuckTotal:
                    type: integer
                    format: int64
                  terminating:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        finalizer:
                          type: string
                        controller:
                          type: string
                        count:
                          type: integer
                          format: int64
                        examples:
                          type: array
                          items:
                            type: string
                      required:
                        - kind
                        - finalizer
                        - controller
                        - count
                required:
                  - sampledAt
                  - objects
                  - orphanTotal
                  - stuckTotal
              ttl:
                type: object
                properties:
                  sampledAt:
                    type: string
                  tracked:
                    type: integer
                    format: int64
                  deletedTotal:
                    type: integer
                    format: int64
                  deleted:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        count:
                          type: integer
                          format: int64
                        lastAt:
                          type: string
                      required:
                        - kind
                        - count
                required:
                  - sampledAt
                  - tracked
                  - deletedTotal
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Profile
          type: string
          jsonPath: .spec.profile
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: PLC
          type: string
          jsonPath: .status.network.plcDirectoryUrl
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
