name: ssh-gateway
entry: hono-socialweb-computer-ssh
stateDir: "{{.StateDir}}"
memory: 512Mi
serviceAccount: deno-runner
tls: none
args: ["--ssh-port", "0", "--ssh-hostname", "127.0.0.1", "--http-port", "0", "--serve-addr", "127.0.0.1", "--state-dir", "{{.StateDir}}", "--web-dir", "{{.WebDir}}", "--iroh-dial-socket", "{{.IrohDial.Socket}}", "--openbao-server", "{{.Vault.Server}}", "--openbao-client", "{{.Vault.Client}}", "--openbao-kcp-workspace", "{{.Kcp.Workspace}}"{{.ExtraArgs}}]
projected:
  - {name: kcp-token, serviceAccountToken: {name: ssh-gateway, workspace: "{{.Kcp.Workspace}}"}}
  - {name: kcp-ca, kcpCA: {}}
  - {name: vault, openBaoClient: {server: "{{.Vault.Server}}", client: "{{.Vault.Client}}", workspace: "{{.Kcp.Workspace}}"}}
permissions:
  net: true
  env: {{.EnvAllow}}
  sys: [hostname]
  read: ["{{.StateDir}}"{{.ExtraRead}}]
probe:
  host: ssh-gateway.default.{{.ServiceSuffix}}
  path: /healthz
