name: bidder
entry: hono-bidder
stateDir: "{{.StateDir}}"
memory: 1536Mi
serviceAccount: deno-runner
tls: trust
trust: [{{.Trust}}]
args: ["--market-identity-name", "bidder", "--market-identity-kcp-server", "{{.Kcp.Server}}", "--market-identity-kcp-workspace", "{{.Kcp.Workspace}}", "--identity-vault-openbao-server", "{{.Vault.Server}}", "--identity-vault-openbao-client", "{{.Vault.Client}}", "--identity-vault-kcp-server", "{{.Vault.KcpServer}}", "--state-dir", "{{.StateDir}}", "--repo-pds-url", "http://pds.default.{{.ServiceSuffix}}", "--serve-port", "0", "--plc-directory-url", "{{.PlcDirectoryUrl}}", "--ingress-proxy-host", "{{.IngressProxyHost}}", "--policy", "{{.Policy}}", "--policy-engine-url", "http://policy-engine.default.{{.ServiceSuffix}}"{{.ProviderArgs}}{{.ExtraArgs}}]
projected:
  - {name: kcp-token, serviceAccountToken: {name: bidder, workspace: "{{.Kcp.Workspace}}"}}
  - {name: kcp-ca, kcpCA: {}}
  - {name: vault, openBaoClient: {server: "{{.Vault.Server}}", client: "{{.Vault.Client}}", workspace: "{{.Kcp.Workspace}}"}}
env:
  PORT: "0"
  SERVE_PORT: "0"
permissions:
  net: true
  env: [SERVE_PORT, PORT, PORT_FILE, LISTENERS_FILE, STATUS_FILE, KCP_NAMESPACE, KCP_WORKSPACE, PATH, HOME, BUNDLED_ACTIONS_DIR]
  sys: [hostname]
  read: [{{.Read}}]
probe:
  host: bidder.default.{{.ServiceSuffix}}
  path: /oauth-client-metadata.json
