apiVersion: socialweb.computer/v1alpha1
kind: AtprotoRecord
metadata:
  name: association
spec:
  repo: pds
  collection: com.publicdomainrelay.temp.badgeBlueKeys
  rkey: association
  onMissingReference: Delete
  record:
    challenge: {valueFrom: {kind: MarketIdentity, name: bidder, fieldPath: "spec.approvedAssociations[0]"}}
    keyId: {valueFrom: {kind: MarketIdentity, name: bidder, fieldPath: status.did}}
    service: bidder_associate
    name: bidder
    createdAt: {valueFrom: {kind: MarketIdentity, name: bidder, fieldPath: metadata.creationTimestamp}}
