apiVersion: socialweb.computer/v1alpha1
kind: OpenBaoServer
metadata:
  name: bidder
spec:
  asset:
    name: bao
    sha256: ""
  clients:
    - name: bidder
      kvMount: bidder
      policies: ["bidder-oidc-rotate"]
    - name: computevm
      policies: ["computevm-guest-user-data", "computevm-guest-login"]
    - name: guest-kcp
      policies: ["bidder-guest-kcp"]
    - name: pds
      policies: ["bidder-repo-key"]
  declared:
    policies:
      - name: bidder-guest-kcp
        rules:
          - path: bidder/data/relay-keypair/kcp
            capabilities: ["create", "read", "update"]
          - path: identity/oidc/config
            capabilities: ["create", "read", "update"]
          - path: auth/sshsig/role/*
            capabilities: ["read"]
      - name: bidder-repo-key
        rules:
          - path: bidder/data/identity/bidder/keys
            capabilities: ["read"]
      - name: bidder-oidc-rotate
        rules:
          - path: identity/oidc/key/guest/rotate
            capabilities: ["update"]
      - name: computevm-guest-user-data
        rules:
          - path: bidder/data/guests/+/user-data
            capabilities: ["read"]
      - name: computevm-guest-login
        rules:
          - path: auth/sshsig/role/*
            capabilities: ["create", "read", "update", "delete"]
    identityOIDC:
      key: guest
  plugins:
    - name: sshsig
      type: auth
      asset:
        name: openbao-plugin-auth-sshsig
        sha256: ""
      mountPath: sshsig
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bidder
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bidder
rules:
  - apiGroups: ["socialweb.computer"]
    resources: ["openbaoservers"]
    verbs: ["get", "list"]
  - apiGroups: ["socialweb.computer"]
    resources: ["computevms"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["socialweb.computer"]
    resources: ["computevms/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["socialweb.computer"]
    resources: ["bids"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["socialweb.computer"]
    resources: ["bids/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["socialweb.computer"]
    resources: ["guestidentitygrants"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["socialweb.computer"]
    resources: ["marketidentities"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["socialweb.computer"]
    resources: ["marketidentities/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["socialweb.computer"]
    resources: ["atprotorecordwatches"]
    resourceNames: ["association"]
    verbs: ["get"]
  - apiGroups: ["socialweb.computer"]
    resources: ["marketbidders", "marketbidders/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bidder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bidder
subjects:
  - kind: ServiceAccount
    name: bidder
    namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guest-kcp
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guest-kcp
rules:
  - apiGroups: ["socialweb.computer"]
    resources: ["openbaoservers"]
    verbs: ["get", "list"]
  - apiGroups: ["socialweb.computer"]
    resources: ["computevms"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["socialweb.computer"]
    resources: ["computevms/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guest-kcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guest-kcp
subjects:
  - kind: ServiceAccount
    name: guest-kcp
    namespace: default
