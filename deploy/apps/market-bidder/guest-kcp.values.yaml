name: guest-kcp
entry: hono-bidder-guest
stateDir: "{{.Guest.StateDir}}"
memory: 1Gi
serviceAccount: deno-runner
tls: trust
trust: [{{.Trust}}]
args: ["--role", "kcp", "--vault-openbao-server", "{{.Vault.Server}}", "--vault-openbao-client", "{{.Guest.VaultClient}}", "--vault-kcp-server", "{{.Vault.KcpServer}}", "--kcp-server", "{{.Kcp.Server}}", "--kcp-workspace", "{{.Kcp.Workspace}}", "--handle", "{{.Guest.Handle}}", "--plc-directory-url", "{{.PlcDirectoryUrl}}", "--ingress-proxy-host", "{{.IngressProxyHost}}", "--serve-port", "0"{{.Guest.ExtraArgs}}]
projected:
  - {name: kcp-token, serviceAccountToken: {name: guest-kcp, workspace: "{{.Kcp.Workspace}}"}}
  - {name: kcp-ca, kcpCA: {}}
  - {name: vault, openBaoClient: {server: "{{.Vault.Server}}", client: "{{.Guest.VaultClient}}", workspace: "{{.Kcp.Workspace}}"}}
env:
  PORT: "0"
  SERVE_PORT: "0"
permissions:
  net: true
  env: [SERVE_PORT, PORT, PORT_FILE, LISTENERS_FILE, STATUS_FILE, KCP_NAMESPACE]
  sys: [hostname]
  read: [{{.Guest.Read}}]
probe:
  host: guest-kcp.default.{{.ServiceSuffix}}
  path: /v1/identity/oidc/.well-known/openid-configuration
