name: requester
entry: request-vm-ssh
stateDir: "{{.StateDir}}"
memory: 1Gi
serviceAccount: deno-runner
tls: trust
trust: ["{{.CABundle}}"]
args: ["--port", "0", "--pds-state-path", "{{.StateDir}}/pds", "--market-identity-kcp-workspace", "{{.Kcp.Workspace}}", "--compute-contract-kcp-workspace", "{{.Kcp.Workspace}}", "--identity-vault-openbao-server", "{{.Vault.Server}}", "--identity-vault-openbao-client", "{{.Vault.Client}}", "--identity-vault-kcp-workspace", "{{.Kcp.Workspace}}", "--guest-curl-home", "/root", "--policy-engine-url", "http://policy-engine.default.{{.ServiceSuffix}}"{{.ExtraArgs}}]
projected:
  - {name: kcp-token, serviceAccountToken: {name: requester, workspace: "{{.Kcp.Workspace}}"}}
  - {name: kcp-ca, kcpCA: {}}
  - {name: vault, openBaoClient: {server: "{{.Vault.Server}}", client: "{{.Vault.Client}}", workspace: "{{.Kcp.Workspace}}"}}
  - {name: network-ca, file: {path: "{{.CABundle}}"}}
env:
  SERVE_PORT: "0"
permissions:
  net: true
  env: [SERVE_PORT, PORT, PORT_FILE, LISTENERS_FILE, STATUS_FILE, PATH, HOME, BUNDLED_ACTIONS_DIR]
  sys: [hostname]
  read: ["{{.CABundle}}"]
probe:
  host: requester.default.{{.ServiceSuffix}}
  path: /xrpc/_health
