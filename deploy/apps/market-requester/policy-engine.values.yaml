name: policy-engine
entry: hono-policy-engine
memory: 512Mi
stateDir: "{{.StateDir}}/policy-engine"
tls: none
args: ["--port", "0", "--bundled-actions-dir", "${SOCIALWEB_TS_ROOT}/ts/policy-engine/lib/policies/gha-lite/bundled-actions"]
env:
  PORT: "0"
permissions:
  net: true
  env: [PORT, PORT_FILE, LISTENERS_FILE, STATUS_FILE]
probe:
  host: policy-engine.default.{{.ServiceSuffix}}
  path: /health
