name: requester
entry: request-vm-ssh
stateDir: "{{.Requester.StateDir}}"
memory: 1Gi
tls: {{.TLS}}
trust: {{.Trust}}
args: ["--port", "0", "--serve-addr", "127.0.0.1", "--compute-contract-kcp-server", "{{.KcpServer}}", "--compute-contract-kcp-workspace", "{{.IdentityWorkspace}}", "--identity-vault-kcp-server", "{{.KcpServer}}", "--identity-vault-kcp-workspace", "{{.GatewayWorkspace}}", "--identity-vault-openbao-server", "{{.Requester.Vault.Server}}", "--identity-vault-openbao-client", "{{.Requester.Vault.Client}}", "--identity-vault-mount", "requester", "--market-identity-kcp-server", "{{.KcpServer}}", "--market-identity-kcp-workspace", "{{.IdentityWorkspace}}", "--repo-pds-url", "http://pds.default.{{.ServiceSuffix}}", "--skip-rbac"{{.Requester.ExtraArgs}}]
projected:
  - {name: kcp-token, serviceAccountToken: {name: requester}}
  - {name: kcp-ca, kcpCA: {}}
  - {name: vault, openBaoClient: {server: "{{.Requester.Vault.Server}}", client: "{{.Requester.Vault.Client}}", workspace: "{{.GatewayWorkspace}}"}}
{{.Requester.ExtraProjected}}permissions:
  net: true
  env: [PORT_FILE, LISTENERS_FILE, STATUS_FILE, PATH, HOME, BUNDLED_ACTIONS_DIR]
  sys: [hostname]
  read: ["{{.Requester.StateDir}}"{{.Requester.ExtraRead}}]
probe:
  host: requester.default.{{.ServiceSuffix}}
  path: /xrpc/_health
