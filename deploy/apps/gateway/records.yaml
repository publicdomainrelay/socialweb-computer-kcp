apiVersion: socialweb.computer/v1alpha1
kind: AtprotoRecord
metadata:
  name: association
spec:
  repo: pds
  collection: com.publicdomainrelay.temp.badgeBlueKeys
  rkey: association
  onMissingReference: Delete
  record:
    challenge: {valueFrom: {kind: MarketIdentity, name: requester, fieldPath: "spec.approvedAssociations[0]"}}
    keyId: {valueFrom: {kind: MarketIdentity, name: requester, fieldPath: status.did}}
    service: requester_associate
    name: requester
    createdAt: {valueFrom: {kind: MarketIdentity, name: requester, fieldPath: metadata.creationTimestamp}}
