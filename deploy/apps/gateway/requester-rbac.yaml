apiVersion: v1
kind: ServiceAccount
metadata:
  name: requester
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-requester
rules:
  - apiGroups: ["socialweb.computer"]
    resources: ["computecontracts"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["socialweb.computer"]
    resources: ["computecontracts/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["socialweb.computer"]
    resources: ["marketidentities"]
    resourceNames: ["requester"]
    verbs: ["get", "watch", "patch"]
  - apiGroups: ["socialweb.computer"]
    resources: ["atprotorecordwatches"]
    resourceNames: ["association"]
    verbs: ["get"]
  - apiGroups: ["socialweb.computer"]
    resources: ["marketidentities/status"]
    resourceNames: ["requester"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-requester
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gateway-requester
subjects:
  - kind: ServiceAccount
    name: requester
    namespace: default
