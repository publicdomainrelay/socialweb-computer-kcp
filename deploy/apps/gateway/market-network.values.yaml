name: socialweb-computer-k8s
entry: hono-socialweb-computer-k8s
stateDir: "{{.StateDir}}"
memory: 1Gi
tls: {{.TLS}}
trust: {{.Trust}}
args: ["--http-port", "0", "--serve-addr", "127.0.0.1", "--state-dir", "{{.StateDir}}", "--web-dir", "{{.WebDir}}", "--kcp-server", "{{.KcpServer}}", "--gateway-kcp-workspace", "{{.GatewayWorkspace}}", "--gateway-kcp-name", "{{.GatewayName}}", "--openbao-server", "{{.Vault.Server}}", "--openbao-client", "{{.Vault.Client}}", "--openbao-server-workspace", "{{.GatewayWorkspace}}", "--market-identity-workspace", "{{.IdentityWorkspace}}", "--kcp-workspace", "{{.IdentityWorkspace}}", "--contract-kcp-workspace", "{{.IdentityWorkspace}}", "--required-downloads", "socialweb-meshd-x86_64,socialweb-meshd-aarch64"{{.ExtraArgs}}{{.TestArgs}}]
projected:
  - {name: kcp-token, serviceAccountToken: {name: socialweb-computer-k8s}}
  - {name: kcp-ca, kcpCA: {}}
  - {name: vault, openBaoClient: {server: "{{.Vault.Server}}", client: "{{.Vault.Client}}", workspace: "{{.GatewayWorkspace}}"}}
{{.ExtraProjected}}permissions:
  net: true
  env: [PORT_FILE, LISTENERS_FILE, STATUS_FILE, KCP_NAMESPACE, KCP_WORKSPACE, PATH, HOME, BUNDLED_ACTIONS_DIR]
  sys: [hostname]
  read: ["{{.StateDir}}"{{.ExtraRead}}{{.TestRead}}]
probe:
  host: socialweb-computer-k8s.default.{{.ServiceSuffix}}
  path: /healthz
