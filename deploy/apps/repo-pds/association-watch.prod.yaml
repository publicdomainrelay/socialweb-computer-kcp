apiVersion: socialweb.computer/v1alpha1
kind: AtprotoRecordWatch
metadata:
  name: association
spec:
  repo: pds
  collection: link.ident.endorsement
  match:
    - {fieldPath: agent, valueFrom: {kind: MarketIdentity, name: "{{.Pds.Identity}}", fieldPath: status.did}}
  source:
    eventSourceRefs: [{{.Pds.WatchEventSources}}]
