apiVersion: v1
kind: ServiceAccount
metadata:
  name: pds
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pds
rules:
  - apiGroups: ["socialweb.computer"]
    resources: ["openbaoservers"]
    verbs: ["get", "list"]
  - apiGroups: ["socialweb.computer"]
    resources: ["marketidentities"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["socialweb.computer"]
    resources: ["atprotorecords"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["socialweb.computer"]
    resources: ["atprotorecords/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["socialweb.computer"]
    resources: ["atprotorecordwatches"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["socialweb.computer"]
    resources: ["atprotorecordwatches/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pds
subjects:
  - kind: ServiceAccount
    name: pds
    namespace: default
