apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pds-components
rules:
  - apiGroups: ["deno.computer"]
    resources: ["denopods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pds-components
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pds-components
subjects:
  - kind: Group
    name: "system:cluster:{{.BaseCluster}}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pds-components-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kcp:workspace:access
subjects:
  - kind: Group
    name: "system:cluster:{{.BaseCluster}}"
