apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pds-components
rules:
  - nonResourceURLs: ["/"]
    verbs: ["access"]
  - apiGroups: ["deno.computer"]
    resources: ["denopods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pds-components
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pds-components
subjects:
  - kind: User
    name: "system:kcp:serviceaccount:{{.BaseCluster}}:default:pds"
