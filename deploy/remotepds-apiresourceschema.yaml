apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-1.remotepds.pds.socialweb.computer
spec:
  group: pds.socialweb.computer
  names:
    kind: RemotePDS
    listKind: RemotePDSList
    plural: remotepds
    singular: remotepds
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              url:
                type: string
              did:
                type: string
              tls:
                type: object
                properties:
                  enabled:
                    type: boolean
                  caBundleRef:
                    type: string
                  serverName:
                    type: string
              auth:
                type: object
                properties:
                  accountRef:
                    type: string
                  accessTokenRef:
                    type: string
                  refreshTokenRef:
                    type: string
                  dpopKeyRef:
                    type: string
              capabilities:
                type: array
                items:
                  type: string
              suspend:
                type: boolean
            required:
              - url
              - did
          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                  - Pending
                  - Ready
                  - Failed
              ready:
                type: boolean
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              endpoint:
                type: string
              lastCheckedAt:
                type: string
                format: date-time
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
