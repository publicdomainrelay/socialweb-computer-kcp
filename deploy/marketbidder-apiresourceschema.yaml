apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-12.marketbidders.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: MarketBidder
    listKind: MarketBidderList
    plural: marketbidders
    singular: marketbidder
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              profile:
                type: string
              network:
                type: object
                properties:
                  plcDirectoryUrl:
                    type: string
                  ingressProxyHost:
                    type: string
                  relayUrls:
                    type: array
                    items:
                      type: string
                  firehoseUrls:
                    type: array
                    items:
                      type: string
                  qrOrigin:
                    type: string
                  guestTlsUrl:
                    type: string
                  caBundleRef:
                    type: string
                  hosts:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        address:
                          type: string
                      required:
                        - name
                        - address
                required:
                  - plcDirectoryUrl
                  - ingressProxyHost
                  - relayUrls
                  - firehoseUrls
                  - qrOrigin
              identity:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                      - oauthQr
                      - oauthBrowser
                      - pdsAccount
                      - localRepo
                      - oauthDelegated
                  handle:
                    type: string
                  pdsUrl:
                    type: string
                  association:
                    type: string
                    enum:
                      - RequireApproval
                      - Skip
                required:
                  - mode
              policy:
                type: string
              firecracker:
                type: object
                properties:
                  workRoot:
                    type: string
                  vmruntimeCommand:
                    type: array
                    items:
                      type: string
                required:
                  - workRoot
                  - vmruntimeCommand
              kcp:
                type: object
                properties:
                  handle:
                    type: string
                  vmHostBackend:
                    type: string
                  guestImageSource:
                    type: string
                  stopGraceSeconds:
                    type: integer
                    format: int32
                required:
                  - guestImageSource
              signingKeyRotation:
                type: integer
                format: int32
              options:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                  required:
                    - name
              quota:
                type: object
                properties:
                  bids:
                    type: integer
                    format: int32
                  computeVMs:
                    type: integer
                    format: int32
                  computeContracts:
                    type: integer
                    format: int32
                  nodeClaims:
                    type: integer
                    format: int32
                  policyWorkflowRuns:
                    type: integer
                    format: int32
                  denoRuns:
                    type: integer
                    format: int32
              operator:
                type: string
            required:
              - profile
              - identity
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              phase:
                type: string
                enum:
                  - Pending
                  - Provisioning
                  - Ready
                  - Deleting
                  - Failed
              message:
                type: string
              profile:
                type: string
              did:
                type: string
              components:
                type: array
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    workspace:
                      type: string
                    phase:
                      type: string
                    ready:
                      type: boolean
                  required:
                    - kind
                    - name
                    - workspace
                    - ready
              listeners:
                type: array
                items:
                  type: object
                  properties:
                    component:
                      type: string
                    name:
                      type: string
                    kind:
                      type: string
                    address:
                      type: string
                  required:
                    - component
                    - name
                    - kind
                    - address
              stateDir:
                type: object
                properties:
                  path:
                    type: string
                  bytes:
                    type: integer
                    format: int64
                  files:
                    type: integer
                    format: int64
                  sampledAt:
                    type: string
                required:
                  - path
                  - bytes
                  - files
                  - sampledAt
              store:
                type: object
                properties:
                  kind:
                    type: string
                  path:
                    type: string
                  bytes:
                    type: integer
                    format: int64
                  freeBytes:
                    type: integer
                    format: int64
                  rows:
                    type: integer
                    format: int64
                  deadTuples:
                    type: integer
                    format: int64
                  autoVacuum:
                    type: string
                  vacuums:
                    type: integer
                    format: int64
                  reclaimedBytes:
                    type: integer
                    format: int64
                  lastVacuumAt:
                    type: string
                  sampledAt:
                    type: string
                required:
                  - kind
                  - bytes
                  - sampledAt
              gc:
                type: object
                properties:
                  sampledAt:
                    type: string
                  objects:
                    type: integer
                    format: int64
                  orphanTotal:
                    type: integer
                    format: int64
                  orphans:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        count:
                          type: integer
                          format: int64
                        examples:
                          type: array
                          items:
                            type: string
                      required:
                        - kind
                        - count
                  stuckTotal:
                    type: integer
                    format: int64
                  terminating:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        finalizer:
                          type: string
                        controller:
                          type: string
                        count:
                          type: integer
                          format: int64
                        examples:
                          type: array
                          items:
                            type: string
                      required:
                        - kind
                        - finalizer
                        - controller
                        - count
                required:
                  - sampledAt
                  - objects
                  - orphanTotal
                  - stuckTotal
              ttl:
                type: object
                properties:
                  sampledAt:
                    type: string
                  tracked:
                    type: integer
                    format: int64
                  deletedTotal:
                    type: integer
                    format: int64
                  deleted:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        count:
                          type: integer
                          format: int64
                        lastAt:
                          type: string
                      required:
                        - kind
                        - count
                required:
                  - sampledAt
                  - tracked
                  - deletedTotal
              quotas:
                type: array
                items:
                  type: object
                  properties:
                    workspace:
                      type: string
                    resource:
                      type: string
                    hard:
                      type: integer
                      format: int64
                    used:
                      type: integer
                      format: int64
                  required:
                    - workspace
                    - resource
                    - hard
                    - used
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              market:
                type: object
                properties:
                  rfpsSeen:
                    type: integer
                    format: int64
                  rfpsScoped:
                    type: integer
                    format: int64
                  declinedByReason:
                    type: array
                    items:
                      type: object
                      properties:
                        reason:
                          type: string
                        count:
                          type: integer
                          format: int64
                      required:
                        - reason
                        - count
                  bids:
                    type: integer
                    format: int64
                  wins:
                    type: integer
                    format: int64
                  contractsActive:
                    type: integer
                    format: int64
                  streams:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        cursor:
                          type: integer
                          format: int64
                        lagMs:
                          type: integer
                          format: int64
                        lastEventAt:
                          type: string
                      required:
                        - source
                  recentDeclines:
                    type: array
                    items:
                      type: object
                      properties:
                        rfpUri:
                          type: string
                        reason:
                          type: string
                        at:
                          type: string
                      required:
                        - rfpUri
                        - reason
                        - at
                  rfpToBid:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int64
                      p50Us:
                        type: integer
                        format: int64
                      p95Us:
                        type: integer
                        format: int64
                      maxUs:
                        type: integer
                        format: int64
                    required:
                      - count
                      - p50Us
                      - p95Us
                      - maxUs
                  kcpWait:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int64
                      p50Us:
                        type: integer
                        format: int64
                      p95Us:
                        type: integer
                        format: int64
                      maxUs:
                        type: integer
                        format: int64
                    required:
                      - count
                      - p50Us
                      - p95Us
                      - maxUs
                  pdsWrites:
                    type: object
                    properties:
                      since:
                        type: string
                      writes:
                        type: integer
                        format: int64
                      points:
                        type: integer
                        format: int64
                      rateLimited:
                        type: integer
                        format: int64
                      reserve:
                        type: integer
                        format: int64
                      byCollection:
                        type: array
                        items:
                          type: object
                          properties:
                            collection:
                              type: string
                            writes:
                              type: integer
                              format: int64
                            points:
                              type: integer
                              format: int64
                          required:
                            - collection
                            - writes
                            - points
                      perHour:
                        type: array
                        items:
                          type: object
                          properties:
                            hour:
                              type: string
                            points:
                              type: integer
                              format: int64
                          required:
                            - hour
                            - points
                      limits:
                        type: array
                        items:
                          type: object
                          properties:
                            pds:
                              type: string
                            limit:
                              type: integer
                              format: int64
                            remaining:
                              type: integer
                              format: int64
                            resetAt:
                              type: string
                            pausedUntil:
                              type: string
                            observedAt:
                              type: string
                          required:
                            - pds
                            - observedAt
                    required:
                      - since
                      - writes
                      - points
                      - reserve
                  updatedAt:
                    type: string
      additionalPrinterColumns:
        - name: Profile
          type: string
          jsonPath: .spec.profile
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: DID
          type: string
          jsonPath: .status.did
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
