  - id: P11-M2
    title: QUEUED - the Windows bidder as an SCM service, its installer, the versions/<sha> upgrade, a windows/amd64 release.
    body: >
      QUEUED as P11-M0. Plan 0011 items M2-BIDDER-SERVICE-WINDOWS, M2-INSTALLER-WINDOWS,
      M2-BINARY-UPGRADE-WINDOWS, M2-RELEASE-WINDOWS.
    instrument: >
      The service installs and upgrades on the Windows host with a running VM untouched; a reproducible
