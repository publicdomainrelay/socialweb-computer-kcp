    principle_note: >
      Organizing principle of P6-P8 (user 2026-10-12; plan 0006 `principle`, ARCHITECTURE section 0): kcp is
      a core part of each APPLICATION - an application instance (bidder handle, run request, gateway, market
      market network, dev instance) = its own kcp + a manifest set + a profile; state = kcp objects; components =
      DenoPods/HostProcesses; modes = profiles; composition = applying sets / nesting workspaces;
      applications meet only over the atproto market protocol, never by sharing a kcp; port 0 behind the
      edge with addresses in kcp (check: 0006 M1-NO-FIXED-PORTS); every workstream tests in its own market
      market network, bobvmbuilder + alice are a final soak only. The one traditional use is the virtual clusters
