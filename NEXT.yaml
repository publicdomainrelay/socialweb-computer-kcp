  - id: P6-M1
    title: OPEN - CLI (with the dev tree and a required host-backend), host inventory, rustfs/t4 leftovers removed, per-OS assets, instance-keyed leases, `dev up|down|status` per worktree, the one `install`/`uninstall` root command.
    body: >
      OPEN as P6-M0. Plan 0006 items M1-CLI, M1-HOST-INVENTORY, M1-STORE-CLEANUP (the tenant store is kine
      over the cluster's own postgres; vaultlayout central-store, socialweb-vault central-store options,
      versions.json rustfs/t4 entries deleted), M1-ASSETS, M1-PORT-LEASE-INSTANCE (new 2026-10-12: leases
      keyed by (instance, cluster, purpose), one per-user lease file in dev), M1-NO-FIXED-PORTS (new
      2026-10-12, fourth fold: a check.sh --fast test fails on any fixed port in a manifest or default behind
      the edge; edge exceptions in deploy/edge-ports.yaml, today's literals in a ratchet that only shrinks),
      M1-DEV-INSTANCE (new 2026-10-12:
      `socialweb-computer dev up|down|status|ls|logs|env|check|restart` per worktree, instance id from the
      worktree path, XDG state keyed by instance, one devsup per instance, port 0, no root), M1-INSTALL.
      M1-K8S-FORK and M1-KCP-INPROC closed 2026-10-12, route not chosen. Assets are embedded per GOOS_GOARCH
      and collected only when no loaded unit names them (dev: one per-user cache, `dev gc`); the core installs
      to bin/<sha256>/ with current/previous symlinks. Decided by the user 2026-10-12: `socialweb-computer
      install bidder|gateway` is the one explicit, idempotent root step, with `uninstall`: account (never
      created on demand elsewhere), bidder subuid/subgid range for per-VM user namespaces, kvm before linger,
      delegation drop-in, AppArmor profile for the embedded pasta, node password, socialweb.slice, the core
      unit files and the BOOTSTRAP-LAYER unit files (kcp store, kine, slot(s), front; M2-BOOTSTRAP-LAYER),
      linger, `host-backend: systemd-user` in the account's config.json; every other unit (vaults, cluster
      members, VM units) is a HostProcess placed at runtime. The dev run mode is kcp-native now (decided by
      the user 2026-10-12): host-backend required with no default (install writes systemd-user, dev passes
      proc), gateway dev store sqlite (quick) or postgres (market network/prodlike), k3s node password by a per-instance
      userns bind-mount, AppArmor report-only in dev, one uid for every role in dev. Fifth fold 2026-10-12:
      M1-CLI states the application-verb contract (apply the root object with --profile, watch, render
      pending actions; no verb opens a listener or spawns deno; options.json gains `profile`; its scan test
      lands with M2-APP-CONTROLLER so the binary-base slice is not widened); M1-DEV-INSTANCE's `--profile market-network`
      is a MarketNetwork composing child applications with their own kcps (exits 2 naming M2-APP-CONTROLLER
      until it lands).
    instrument: >
      Every executable the code runs has a fate in the host inventory; no rustfs or t4 name outside the
      store measurement in stack.go; an extracted asset that no longer matches its pin is replaced, not run;
      install run twice changes nothing the second time, uninstall --purge restores every host file it
      touched, every installed unit file verifies; upgrade refuses a bad manifest and rollback retargets
      current; serve without --host-backend exits 2; two instances leasing from one file never share a port;
      two worktrees on hat-8 run `dev up` / `dev down` in parallel and share nothing.
  - id: P6-M2
    title: OPEN - user-manager units adopted never re-created, the host contract, the VM tree audit, kcp on port 0, postgres (with its upgrade paths) and OpenBao CRDs, apply from Go.
    body: >
      OPEN as P6-M0. M2-HOST-UNITS DONE 2026-10-12 (internal/hostsvc merged; lingering-account proof left to
      M2-HOST-CONTRACT). Plan 0006 items M2-HOST-UNITS (was
      M2-HOST-SCOPES), M2-HOST-CONTRACT (adds the subuid range, newuidmap and ACL checks), M2-VM-TREE-AUDIT,
      M2-KCP-STORE (one kine per slot over a dedicated postgres unit on a unix socket, started before kcp,
