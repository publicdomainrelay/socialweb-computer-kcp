  - id: P11-M3
    title: QUEUED - a live rent on Windows through the RFP flow; survival, release, reboot = Lost.
    body: >
      QUEUED as P11-M0. Plan 0011 items M3-LIVE-RENT, M3-LIVE-SURVIVE, M3-LIVE-REBOOT-LOST (then M4-DOCS):
      a guest rented through requester -> RFP -> bid -> accept -> cloud-init on the Windows bidder, surviving a
      bidder kill and upgrade, released by vm.delete, and Lost after a host reboot.
    instrument: >
      The three live readings recorded with UTC timestamps and zero ssh sessions.
  - id: P12-M0
    title: QUEUED - macOS bidder spikes (plan 0012 M0).
    body: >
      QUEUED behind plans 0006 and 0007 (complete on Linux with ACC6-* and ACC7-* recorded) and the plan 0008
      items 0012 names. Plan 0012 (docs/plans/0012-macos-bidder-vz.yaml) items M0-REVISIT, M0-HOST-BASELINE,
      M0-VFKIT-ASSET, M0-SCRATCH-BACKEND, M0-VZ-LIFETIME, M0-LAUNCHD-DOMAIN (headless, no login),
      M0-REBOOT-LOST-POWER (reboot = Lost, power and FileVault), M0-PROC-IDENTITY (kinfo_proc),
      M0-NETWORK-VZ (VZ NAT vs gvproxy), M0-ARCH-MODULES (arm64), M0-RESOURCES (admission), M0-GATE.
    instrument: >
      M0-REVISIT's amendments recorded with the SHAs read; each spike's macOS reading recorded; M0-GATE's
      go/no-go recorded.
  - id: P12-M1
    title: QUEUED - vfkit launchd backend, the launchd broker, launchd host units, darwin network, arm64 guest image, darwin DenoPod runner, admission.
    body: >
      QUEUED as P12-M0. Plan 0012 items M1-VMHOST-VZ, M1-LAUNCHD-BROKER, M1-HOSTUNIT-LAUNCHD,
      M1-NETWORK-DARWIN, M1-GUEST-IMAGE-ARM64, M1-DENOPOD-RUNNER-DARWIN, M1-ADMISSION-DARWIN.
    instrument: >
      Each item's tests green on the Mac; the cross-OS gate still green on Linux.
  - id: P12-M2
    title: QUEUED - the macOS bidder as a LaunchDaemon, its installer, the upgrade, a darwin/arm64 release.
    body: >
      QUEUED as P12-M0. Plan 0012 items M2-BIDDER-DAEMON-DARWIN, M2-INSTALLER-DARWIN,
      M2-BINARY-UPGRADE-DARWIN, M2-RELEASE-DARWIN.
    instrument: >
      The daemon installs and upgrades on the Mac with a running VM untouched; a reproducible darwin/arm64
      build within its budget.
  - id: P12-M3
    title: QUEUED - a live rent on macOS with no login through the RFP flow; survival, logout, release, reboot = Lost.
    body: >
      QUEUED as P12-M0. Plan 0012 items M3-LIVE-RENT, M3-LIVE-SURVIVE, M3-LIVE-REBOOT-LOST (then M4-DOCS): a
      guest rented through requester -> RFP -> bid -> accept -> cloud-init on a Mac with nobody logged in,
      surviving a bidder kill, an upgrade and a logout, released by vm.delete, and Lost after a reboot.
    instrument: >
      The live readings recorded with UTC timestamps and zero ssh sessions.
  - id: PORT-1
    title: OPEN - the kcp process piles up loopback connections to the fixed-port front of an old tenant cluster until the gateway host has no ephemeral port left.
    body: >
      Opened 2026-10-15 from a live reading on the prod gateway host. `listen tcp 127.0.0.1:0` failed
      host-wide with "address already in use" because about 28000 loopback connections from the kcp
      process were open to the fixed-port front of each of two old tenant clusters (canary on port
      20000, goat-demo on port 20018), which exhausted the ephemeral range for every port 0 listener on
      the host. The relay in internal/apiserverfront/front.go closes both ends when either end closes,
      so the connections are not held by the front; they are held on the kcp side, as dials from kcp to
      the front of an old cluster. Deleting the two clusters released the
      ports and the host recovered. The origin is not found: which kcp component dials the front
      (the mount, the kubeconfig mount child, a controller informer) and why it opens a new connection
      instead of reusing or closing one is open. Every listener on the host binds port 0, so one cluster
      front that leaks connections takes the whole host down, which makes this a host-wide failure
      with a per-cluster cause.
    instrument: >
      The count of established loopback connections from the kcp process to each cluster front on the
      gateway host, read with `ss -tn state established '( dport = :<front port> )'`, stays flat across
      one hour with the cluster idle, for a healthy cluster and for a cluster whose apiserver is stopped;
      and the count of sockets in the ephemeral range (`ss -tan | wc -l` against
      `net.ipv4.ip_local_port_range`) shows headroom while a cluster is deleted and recreated.

