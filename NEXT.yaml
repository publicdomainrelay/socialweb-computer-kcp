    instrument: >
      Two clean builds byte-identical; the binary within the budget in versions.json.
  - id: P6-M5
    title: OPEN - the finished binary deployed fresh to prod (the user runs it); the container path deleted.
    body: >
      OPEN as P6-M0. Plan 0006 items M5-FRESH-DEPLOY (was M5-CUTOVER; decided by the user 2026-10-12: no
      backwards compatibility, migration, cutover, rollback or prod-downtime planning until the finished
      solution exists; the gateway runs no containers; install + upgrade on an empty state dir, no volume
      copy, no rollback script), M5-RETIRE (delete deploy/control-plane-container, container-entrypoint.sh,
      run-container.sh and the docker pieces of scripts/deploy.sh; no waiting period) and the acceptance
      checks ACC6-ONE-BINARY, ACC6-STATE, ACC6-UPGRADE, ACC6-CP-SWAP, ACC6-BAO-SYNC, ACC6-REPRO, ACC6-XOS,
      ACC6-DEV (new 2026-10-12: two dev instances in parallel on hat-8, no root, no systemd).
    instrument: >
      After the fresh deploy: door /api/config 200, the bootstrap cluster Ready, None nodes 0, no container
      on the host; after M5-RETIRE nothing in the repo invokes docker, kubectl or socat outside test assets.
  - id: P7-M1
    title: OPEN - the per-VM userns spike, compute-provider-kcp's shape, the lifecycle on record, the firecracker learnings inventoried, guest images from a build-host script, the new-NSID checklist and a working QR deploy.
    body: >
      OPEN: the plan 0005 gate is satisfied (ACC-ZERO, ACC-MESH, ACC-NOSSH done); items start per their
      depends_on, incl. the plan 0006 and 0008 items they name. Plan 0007 (docs/plans/0007-compute-provider-kcp.yaml), revised 2026-10-11 and 2026-10-12 from
      docs/research/2026-10-11-vm-lifecycle/, items M0-VM-USERNS (new 2026-10-12: spike with fallback -
      firecracker opening /dev/kvm in a per-VM subuid userns with pasta; a single-threaded stage of ours vs
      util-linux unshare >= 2.38; newuidmap/newgidmap host prerequisites; stand-ins plus one RFP-flow guest),
      M1-DECIDE, M1-FC-INVENTORY, M1-API (OS-neutral status, no network index: every guest has the identical
      address plan), M1-COMMON-EXTRACT, M1-GUEST-IMAGE (kernel + rootfs per hypervisor x arch built by
      scripts/build-guest-image.sh on any Linux host - CI shells out to it later, no CI service now, decided
      by the user 2026-10-12 - pinned by sha256, fetched and verified), M1-QR-DEPLOY (new 2026-10-12:
      did-key-associator/scripts/deploy.sh ships hono-backend/mod.ts alone though it imports
      ../typescript-helpers and ./cli-args-env.json, so running it would take the QR backend down; only
      static files were deployed 2026-10-12, backup /root/qr-static-backup/20261012T014155Z; fix = a
      self-contained compiled backend, a --static-only mode and a --dry-run), M1-PROTOCOL-CHECKLIST (new
      2026-10-12: a new NSID needs, in order, the lexicon, the typescript-helpers role-set scope, the
      regenerated did-key-associator client scope deployed to qr.fedfork.com, and every account re-signed in
      through the QR - refresh keeps old scopes, 403 ScopeMissingError otherwise; a check test holds every
      written lexicon in its role set). compute-provider-firecracker is the gold standard; both providers stay.
      Fifth fold 2026-10-12, EARLY by the user's order: M1-MARKET-IDENTITY (no dependency; the research's
      M4-MARKET-IDENTITY) - kind MarketIdentity (modes oauthQr, oauthBrowser, pdsAccount, localRepo = the
      ephemeral-PDS mode kept for bidder and requester, oauthDelegated for door accounts); every interactive
      step (QR, association y/N, browser OAuth, session expiry) becomes status.pendingAction that the
      foreground CLI renders, approvals are spec patches; no key, token or code in the object (vault refs
      only); tests complete sign-in through hono-pds's session minting (createSessionInjector). M1-FC-INVENTORY
      and M1-COMMON-EXTRACT record the guest JSR registry as not inherited (stripped, 0008).
    instrument: >
      Every exported function and logger event of the firecracker provider maps to a requirement entry;
      ComputeVM fixtures round-trip through Go and TypeScript with no backend enum; enriched user_data
      byte-identical across the extraction; an image whose sha256 differs is refused; the userns stage chosen
      with readings; the compiled QR backend starts from an empty dir; every NSID the bidder or requester
      writes is in its role set; a market network bidder runs without --skip-qr, its association approved through its
      MarketIdentity.
  - id: P7-M2
    title: OPEN - the VM runtime with no socialweb code in the VM's tree, parity with the firecracker provider, the Verdict controller, no leaked VM or work dir.
    body: >
      OPEN as P7-M1. Live E8 (2026-10-12, RFP flow): SendCtrlAltDel -> firecracker exit 0.21 s on an idle
      guest; today's provider never noticed a VMM that exited (nodeboot parents and the runner container
      stayed up) and never removes destroyed guests' work dirs (32 dirs, 63 GB on hat-8); M2-VM-RUNTIME and
      M2-CONTROLLER must make both impossible (Watch -> Lost within seconds; finalizer only after the work
      dir is gone; orphan work dirs collected). Plan 0007 items M2-VM-RUNTIME (replaces the deleted M2-UNPRIVILEGED-RUNNER: one
      transient service per VM, pasta -> /bin/sh trampoline -> socialweb-vmexec execve's firecracker
      --config-file; graceful stop = SendCtrlAltDel, a grace window measured live, then KillSignal=SIGKILL;
      arm64 straight to SIGKILL; console to a capped file in the work dir; decided by the user 2026-10-12:
      each VM unit in its own subuid sub-range of the account's reserved range so a VMM escape owns nothing,
      and a separate pure-Go cidata seed drive with in-guest root growth, no debugfs/e2fsck/resize2fs on
      hosts), M2-BACKPORT (parity at the VMSpec, seed drive and fc.json; the host-side key scan is deleted,
      not ported), M2-CONTROLLER (tri-state Verdict: identity mismatch
      = Lost + StopUnit now, unreachable bus or socket = Unknown, boot id changed = Lost). Third fold
      2026-10-12 (decided by the user): every VM unit is a HostProcess child of its ComputeVM placed on
      systemd-user (production) or proc (dev); the userns stage is M0-VM-USERNS's choice; a bidder kcp
      restart stops no VM and the controller re-adopts every VM after it.
    instrument: >
      Parity tests green on both providers; a stand-in VMM unit's tree is pasta + the stand-in only and its
      stop ends within TimeoutStopSec; a stand-in VMM that exits on its own ends its unit and is Lost within
      2 s; one offline test per Verdict row; a Lost guest is never booted again; 32 seeded orphan work dirs
      are gone after one pass past the grace; two stand-in VM units map disjoint subuid sub-ranges and the
      VMM uid owns no bidder file.
  - id: P7-M3
    title: OPEN - the TypeScript provider, the bidder flag that selects it, a NODE-LOSS clock our own outage never feeds; a market network bidder on its own PDS account, per-instance OIDC issuers, the bidder composer.
    body: >
      OPEN as P7-M1. Plan 0007 items M3-TS-PROVIDER (no guest JSR registry since the fifth fold),
      M3-BIDDER-FLAG (adds the handle and the constant guest host address), M3-NODE-LOSS-CLOCK (NotReady
      counts from max(lastTransitionTime, pathUpSince): a cluster cold start, link or front restart never
      releases a node whose path returns; no depends_on, can start now). Fifth fold 2026-10-12 (startable
      now unless noted): M3-BIDDER-ACCOUNT-PDS (today the market network bidder ignores bob's PDS pod, the
      handle+password path builds a local repo and --atproto-pds-url is read nowhere; it becomes a
      remote-PDS session), M3-OIDC-ISSUER-INSTANCE (oidc-issuer-hono's module-global issuer state moves into
      the instance), M3-BIDDER-COMPOSER (after M1-MARKET-IDENTITY and 0008 M1-STRIP-LEGACY-TRANSPORTS:
      hono-bidder's 825-line composition becomes lib/hono-factory-market-bidder-app driven by a component
      spec; no standalone mode; the harnesses compose through it).
    instrument: >
      Against a fake kcp, provision resolves on Running and destroy only after 404; createBidConfig
      equals the firecracker record; a node NotReady during our link outage is kept for 90 s after the link
      returns, and one NotReady before a provider restart is still released on time; a bidder's offering is
      listed by its own PDS account with no repo served by the bidder; two issuers in one process name their
      own issuer; hono-bidder/mod.ts under 150 lines with every bidder test green.
  - id: P7-M4
    title: OPEN - a restarted bidder keeps its issuer, its keys and its contracts (the TypeScript store NOW); guest host keys are guest-reported and verified.
    body: >
      OPEN as P7-M1. Plan 0007 items M4-CONTRACT-STORE-FILE (new 2026-10-12, split from M4-CONTRACT-RESTORE
      by the user and startable NOW: market-bidder ContractStore load() before subscribe and awaited save,
      a file-backed store for compute-provider-firecracker, terminated-receipt tombstones persisted; bidder
      restarts kept losing receipts and a guest leaked 2026-10-12T01:31Z), M4-BIDDER-VAULT, M4-BIDDER-BAO-SYNC,
      M4-CONTRACT-RESTORE (now only the ComputeVM-backed store), M4-ONNETWORK, M4-HOST-KEYS (follows
      M1-PROTOCOL-CHECKLIST and needs M1-QR-DEPLOY; decided by the user 2026-10-12: a bidder-signed
      com.publicdomainrelay.temp.compute.events.vm.hostKeys record in the market.event envelope, reported by
      a cloud-init module with proof of possession; request-vm-ssh and the door use it with
      StrictHostKeyChecking=yes; the host-side ssh-keyscan is deleted).
      Live on hat-8 2026-10-07 a restarted bidder lost its receipts,
      vm.delete failed and the guest leaked; its issuer URL also moves, leaving one jwt mount per issuer
      in cluster vaults. The keys move into an OpenBao beside the bidder, reconciled against live
      ComputeVMs, with one stable issuer per bidder. Fifth fold 2026-10-12 (user: sessions and every key only
      in the application's OpenBao, never kcp Secrets): M4-BIDDER-VAULT holds EVERY relay keypair by name
      (1 + P relays, +1 for an in-process repo, all fresh per process today), the OAuth session and DPoP key
      (MarketIdentity sessionRef) and a pdsAccount password; it depends on M3-OIDC-ISSUER-INSTANCE and
      M1-MARKET-IDENTITY. M4-HOST-KEYS' known_hosts rule lands on the iroh ProxyCommand only (after the 0008
      strip).
    instrument: >
      A bidder seeded from its ContractStore answers vm.delete 200 and destroys once; three starts keep
      the same did, issuer URL and JWKS; restarts and an upgrade leave one jwt mount per bidder in the
      cluster vault; request-vm-ssh verifies the guest-reported key and a wrong key fails verification.
  - id: P7-M4-TERMINATION
    title: DOING - the bidder tells the requester when and why a guest ended (vm.terminated).
    body: >
      DOING as P7-M1. Plan 0007 item M4-TERMINATION-EVENT (decided by the user 2026-10-12): new lexicon
      com.publicdomainrelay.temp.compute.events.vm.terminated, bidder-authored, in the existing market.event
      envelope; one of plan 0007's two protocol additions with vm.hostKeys (ownership.not_owned,
      ACC7-NO-PROTOCOL-CHANGE). TS side done in atproto-market pre-iroh (eb2aa82 lexicon, 7c4a8f4 bidder
      publish + vm.delete ack + tombstone, bdd423b requester watch, onTerminated hook, ssh abort, no
      redundant vm.delete). Live on hat-8 2026-10-12 through the RFP flow: CtrlAltDel 01:44:39.873Z ->
      requester vm_session_ended_by_bidder + vm_delete_skipped 01:44:45.429Z (5.6 s), late vm.delete
      'already-terminated' on both paths at 01:33:07Z; needed typescript-helpers 5b071fe (bidder role
      scope), did-key-associator 3cde452 (QR client scope) and a bidder QR re-sign-in. Remaining:
      the Go controller and compute-provider-kcp emit it from Lost verdicts at re-population and from unit
      failure (in practice after M2-CONTROLLER and M3-TS-PROVIDER, though its depends_on is empty); the door
      acts on it in M3-NODE-LOSS-CLOCK / M6-*. Its in-memory tombstones are persisted by
      M4-CONTRACT-STORE-FILE (startable now). The scope steps it needed are now M1-PROTOCOL-CHECKLIST.
    instrument: >
      test/vm_terminated_{lexicon,bidder,requester}_test.ts green; live on the market network a guest powered
      off from inside ends request-vm-ssh within seconds (vm_session_ended_by_bidder) and no vm.delete is
      sent; a late vm.delete answers 200 with 'already-terminated', never 'unknown receipt'.
  - id: P7-M5
    title: OPEN - run bidder as a user unit of the shared lingering bidder account, no docker, least-privilege deno.
    body: >
      OPEN as P7-M1. Plan 0007 item M5-RUN-BIDDER: one shared lingering account (swc-bidder) for all
      handles, created only by `install bidder` with its subuid/subgid range, units namespaced by handle,
      kvm added before linger, default KillMode, the QR guard in Go,
      the bidder DenoPod with no -A, --allow-run or --allow-ffi and /dev/kvm and $XDG_RUNTIME_DIR denied.
      Third fold 2026-10-12 (decided by the user): the handle's kcp is one slot on kine-sqlite behind a port-0
      front in the bootstrap layer (corrects "kine -> postgres"); `run bidder --host-backend=proc` runs in a
      dev instance with no account; --host-backend is required. Fifth fold 2026-10-12: M5-RUN-BIDDER applies a
      MarketBidder root object with --profile prod-qr (no PDS, oauthQr) | market network (own PDS DenoPod, pdsAccount) |
      dev-local (localRepo) and renders MarketIdentity pending actions in the foreground; hono-bidder runs only
      as the bidder DenoPod's entry from then on (exits 2 outside one; the standalone launcher and
      bob-bidder.sh path deleted). New M5-BIDDER-COMPONENTS (user 2026-10-12): one `guest-<provider>` DenoPod
      per provider owns the provider relay, the OIDC issuer, /v1/on-network and /v1/host-keys, so a core
      restart never moves what guests dial; no guest-jsr pod (stripped).
    instrument: >
      The bidder user unit verifies with no KillMode=mixed; deno in the bidder pod cannot open /dev/kvm or
      dial the user bus or the systemd private socket; `run bidder` shows the QR from status and returns when
      Ready; a bidder-core restart leaves the guest's issuer and onNetwork serving.
  - id: P7-M6
    title: OPEN - bidder and gateway upgrades leave VMs running, in-flight claims resume across a door restart, recovery cases, reboot = Lost, all through the RFP flow.
    body: >
      OPEN as P7-M1. Plan 0007 items M6-BIDDER-UPGRADE (also measures the stop grace window under a k3s
      workload; E8 read 0.21 s idle), M6-CLAIM-RESUME (decided by the user 2026-10-12: per-claim
      secrets-server key in the cluster OpenBao + status.secrets on the NodeClaim, write-ahead acceptPending;
      no depends_on, can start now), M6-GATEWAY-REPOPULATE (record scan only for acceptPending claims and
      unclaimed receipts; decided by the user 2026-10-12: an unclaimed receipt is adopted first through
      claim phase Adopting - matched by node name = guest name, vault role node-<name> and the vm.hostKeys
      record; joined + Ready -> adopted, not joined but its cluster exists -> adopted on join within the
      grace, cluster gone or no join -> released once), M6-LIVE-RECOVERY (kill -9, systemctl restart, logout with linger, user-manager
      restart = reboot semantics), M6-NOSSH-JOIN and the acceptance checks ACC7-* (incl.
      ACC7-NO-RESIDENT-CODE, ACC7-NO-LEAK, ACC7-CLAIM-RESUME). The gateway rebuilds its ownership from
      NodeClaims, receipts, market records and Nodes, including VMs bidders elsewhere rented to it.
    instrument: >
      TestABidderUpgradeLeavesItsVMRunningAndStillReleasesIt, TestADoorRestartMidProvisioningStillJoinsTheNode
      and TestAGatewayUpgradeKeepsEveryMarketNodeReadyAndOwned, through the RFP flow, with zero ssh sessions,
      the VM tree audit passing after every boot, restart and upgrade, and no work dir left after a release.
  - id: P8-M1
    title: OPEN - a pinned deno and the TypeScript closure inside the binary, run offline.
    principle_note: >
      P8 under the organizing principle (see P6-M0 principle_note; plan 0008 `principle`): DenoPods are an
      application's TypeScript components as objects of its own kcp; every DenoPod binds port 0 and the
      runner records status.address from the pod's port file (port-audit.md blocker 1, in M1-MARKET-NETWORK-PARALLEL);
      the market network is the seed of the model and each workstream's own market network. How today's multi-server
      deno processes split into DenoPods per application: folded 2026-10-12 (see P6-M0 principle_note; plan
      0008 fifth fold).
    body: >
      OPEN: the plan 0005 gate is satisfied (ACC-ZERO, ACC-MESH, ACC-NOSSH done); items start per their
      depends_on, incl. plan 0006 M1-ASSETS. Plan 0008 (docs/plans/0008-embedded-deno-and-typescript-denopods.yaml)
      items M1-DENO, M1-TS-SOURCE, M1-TS-CLOSURE. Production runs the embedded archive; other builds
      take this checkout from SOCIALWEB_COMPUTER_SOURCE_ROOT or find it by walking up. DENO_DIR is keyed by
      the closure's sha256 and every run passes --no-code-cache (13349d6: a stale code cache ran old
      bidder code after a restart).
    instrument: >
      An upgraded closure never runs the old code cache; an entry imported from jsr and npm runs with no
      network; two bundles of the same commits are byte-identical.
  - id: P8-M1-MARKET-NETWORK
    title: OPEN, EARLY - today's market network runs N per host (no fixed ports, no one-network-per-host check).
    body: >
      Plan 0008 item M1-MARKET-NETWORK-PARALLEL (new 2026-10-12): live tests in parallel worktrees collide on the market network's
      fixed ports 2583-2589, the deno-kcp kcp 6443 and kine 23791 and on the one-network-per-host check
      (internal/marketnetwork/live_test.go:115) until this lands; ports come from the instance-keyed lease file
      (0006 M1-PORT-LEASE-INSTANCE) or bind 0 and are read back. Guests still only through the market network's
      requester (runComputeContract -> RFP -> bid -> accept -> cloud-init). Until it lands, market-network runs on
      hat-8 are serialized. Fifth fold 2026-10-12 (decision text only; status untouched): ports are read back
      from the port file, never log lines (precursor of M2-DENOPOD-LISTENERS); the market network bidder's key, repo KV
      and session live in its per-run dir; accept.sh reads the bidder DID from the market network record, not stdout.
      Today's market network keeps four applications in one kcp, which the user's strict rule forbids: recorded as
      transitional, retired by M4-MARKET-NETWORK-PORT; this item adds no new cross-application coupling.
    instrument: >
      No market network port literal outside the market network record; two market networks from two worktrees each rent a guest through the
      RFP flow on hat-8 at the same time.
  - id: P8-M1-IROH
    title: OPEN, EARLY - the ssh gateway reaches guests over iroh, then every non-iroh guest transport is stripped.
    body: >
      Decided by the user 2026-10-12, in this order. Plan 0008 M1-SSH-GATEWAY-IROH (no dependency, startable
      now): socialweb-computer-ssh lib/socialweb-computer-requester-inproc asks for the `tunnel` transport
      (mod.ts:268) and runs sessions over the websocket tunnel; it moves to iroh like request-vm-ssh. Then
      M1-STRIP-LEGACY-TRANSPORTS: the cloud-init-common tunnel, fedproxy-ssh, fedproxy-web and wootty modules,
      websocat ProxyCommand paths, relay-fqdn guest addresses and the guest JSR registry are deleted across
      atproto-market, hono-compute-provider and socialweb-computer-ssh (request-vm-ssh --user-data-transport
      removed as a legacy transport). The ssh gateway's Live market CI (socialweb-computer-ssh live.yml) stays
      green throughout. Its broader kcp-native move stays M4-RUN-GATEWAY-SSH.
    instrument: >
      The scan tests find no tunnel, fedproxy-ssh, fedproxy-web or wootty module, no websocat, fedproxy-client,
      wootty or JSR_URL in source and no transport other than iroh requested; the Live market workflow green
      after each of the two changes; a market network guest reached over iroh.
  - id: P8-M2
    title: OPEN - deno-kcp and kcp-libs forked into this repo (runner build-tagged) and run in-process; one service DenoPod template with explicit permissions.
    body: >
      OPEN as P8-M1. Plan 0008 items M2-DENOKCP-FORK (execrunner's Setpgid moves into GOOS-tagged files so
      the cross-OS gate stays green; builds on k8s.io v0.36.4 since the kcp route is out of process, so it
      depends on 0006 M0-KCP-SPIKE and M0-XOS-GATE, both done, and can start now; its runner sets SWC_UNIT so
      devsup attributes deno processes), M2-DENOKCP-INPROC (deno dies with the core user unit; tested with
      `systemctl --user restart`, kill -9 and an upgrade, and on proc in a dev instance since 2026-10-12),
      M2-SERVICE-TEMPLATE (required explicit
      permissions, no -A, /dev/kvm and $XDG_RUNTIME_DIR denied; user 2026-10-11). Fifth fold 2026-10-12: new
      M2-DENOPOD-LISTENERS (createServe writes a listener report - tcp, unix, relay ingress URLs - into the run
      dir; the owned runner sets DenoPod.status.listeners; peers and probes resolve from status; no stdout
      scraping), new M2-MARKET-NETWORK (startable now: one MarketNetwork value type and one fetch adapter in
      typescript-helpers replace the four fetch patches; values reach an application only through its root
      object); M2-SERVICE-TEMPLATE renders values from application profiles, the component spec, the
      MarketNetwork value and the report path, never a port, HOME or stdin.
    instrument: >
      A DenoPod applied to the kcp runs on the embedded deno; a restart, a kill and an upgrade each restart
      every recorded DenoPod on the new closure exactly once; the template refuses -A; a port-0 DenoPod is
      resolved by its reported address; no fetch patch outside the adapter.
  - id: P8-M3
    title: OPEN - the door runs as a DenoPod; its sessions and requester key live in the root vault.
    body: >
      OPEN as P8-M1. Plan 0008 items M3-DOOR-DENOPOD and M3-DOOR-STATE-VAULT (fifth fold 2026-10-12, user:
      secrets only in the application's OpenBao): oauth-sessions.json and requester-key.hex move into the
      gateway's root vault; each door account is a MarketIdentity (oauthDelegated). The node fulfiller stays in
      the door DenoPod; a split is revisited after 0007 M6-CLAIM-RESUME (decided by Claude, user may veto).
    instrument: >
      On a fresh state dir the door DenoPod serves /api/config and, after a core restart, lists the claims
      it wrote before it (no container-era state is opened; fresh deploy, user 2026-10-12); a recreated door
      with an empty state dir serves an existing session and the same requester DID.
  - id: P8-M4
    title: OPEN - run gateway ssh, run request, and the market network driven by socialweb-computer.
    body: >
      OPEN as P8-M1. Plan 0008 items M4-RUN-GATEWAY-SSH, M4-RUN-REQUEST, M4-MARKET-NETWORK-PORT (market network units
      named socialweb-market-network-<runid>-..., never matched by production prefixes; since 2026-10-12 `market-network up` =
      `dev up --profile market-network`, market network ports render to 0, no lock, N market networks per host) and its acceptance checks
      ACC8-*. run request keeps its contracts as ComputeContract objects in its own kcp on port 0. Fifth fold
      2026-10-12 (user's answers): M4-RUN-REQUEST reworked - a FRESH kcp per invocation whose state dir (kcp
      root + vault under state/<invocation>) persists, `run request release|resume <name>` restart that same
      kcp; a MarketRequester root object with a MarketIdentity (oauthQr with no repo, or localRepo = the
      ephemeral-PDS mode); every request-vm-ssh option kept as a field or profile (--user-data-transport
      removed as a legacy transport); request-vm-ssh reduced to the DenoPod entry (kcp only); ssh in the
      foreground over iroh. M4-MARKET-NETWORK-PORT is the STRICT market network: the dev instance is a MarketNetwork whose
      bidder, gateway and requester-invocation children each run their own kcp; values only by copy; the
      shim never resolves another application's name; system tests via internal/apptest.Start reading root
      status. M4-RUN-GATEWAY-SSH after M1-SSH-GATEWAY-IROH, M1-STRIP-LEGACY-TRANSPORTS and 0006
      M2-APP-CONTROLLER.
    instrument: >
      The market network's live test passes twice through `socialweb-computer market network`, and `run request`
      reaches onNetwork, lists the contract with no kcp running, and `release <name>` restarts the
      invocation's kcp and gets vm.delete 200; no two applications in a market network share a kcp.
  - id: P11-M0
    title: QUEUED - Windows bidder spikes (plan 0011 M0).
    body: >
      QUEUED behind plans 0006 and 0007 (complete on Linux with ACC6-* and ACC7-* recorded) and the plan 0008
