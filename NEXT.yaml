      kcp, sets, root vault, rest; fresh state dir), M3-HOST-INSTALL (user unit, default KillMode),
      M3-CP-CONTINUITY (decided by the user 2026-10-12: continuity for upgrades of the finished system only,
      blue/green behind the front; the end-to-end market network proof), M3-KCP-ROLL (`units roll kcp`: pg_dump, new
      slot beside the old, /readyz on its own port, flip our front, old exits, lease
      kube-system/kcp-controllers deleted; storage-incompatible release pairs take a planned outage; on a
      bidder it is a short restart of the one slot, VMs untouched, decided by the user 2026-10-12). Third fold
      2026-10-12: cluster members are HostProcess children (either backend, StopSlice), fronts keep their fd
      through UnitSpec.FDStore (devsup on proc), k3s slots get their hostname and, in dev, the node password
      through `internal ns-exec`. Open note: M3-CP-SLOTS' scheduler leader election conflicts with plan 0010
      G4-SCHED-SINGLE-SERVER (see P10). Fifth fold 2026-10-12: M3-SERVE-GATEWAY-KCP applies a Gateway root
      object (profiles prod and market-network; the door's TEST_* seams become market-network profile values; door accounts are
      MarketIdentities) and depends on M2-APP-CONTROLLER.
    instrument: >
      A zero-node market cluster's /readyz never fails across `systemctl --user restart` of the gateway unit
      and an upgrade, with every member unit's InvocationID unchanged; a postgres restart stops no member;
      two stand-in k3s slots on one postgres swap behind the front with 0 failed polls and never both hold
      kube-system/k3s; on the market network (node via runComputeContract) every upgrade kind keeps the node Ready
      and owned with no vm.delete; a vault seeded with stale entries is reduced to the live set in one pass;
      a kcp roll fails no /readyz poll through the kcp front and leaves no controller gap over 5 s (61 s
      today without the lease delete); a profile switch of a root object deletes the children it omits; two
      bidder children of one MarketNetwork run two distinct kcps.
  - id: P6-M4
    title: OPEN - a reproducible static build per linux platform within its size budget; later, a parent kcp for nesting dev instances.
    body: >
      OPEN as P6-M0. Plan 0006 items M4-BUILD and M4-DEV-PARENT-KCP (new 2026-10-12, a later item the user
      accepted: `dev host`, a parent application instance whose root:dev:<instance> workspaces hold each child instance's
