      Third fold 2026-10-12 (decided by the user: dev run mode kcp-native now; bidder kcp one slot on
      kine-sqlite): new M2-HOST-CONFORMANCE (one Manager contract suite, proc on every check.sh --fast,
      systemd-user behind livegate), M2-HOST-BACKEND-PROC (devsup: per-instance parent, subreaper, process
      groups, tree kill, fd store, ns-exec), M2-BOOTSTRAP-LAYER (kcp store, kine, slot(s), front and core:
      installed units in production, devsup units in dev, before kcp; mirrored into kcp read-only),
      M2-HOSTPROCESS-KIND (HostProcess objects reconciled by the in-binary supervisor onto systemd-user or
      proc; Postgres, OpenBaoServer, cluster members and ComputeVMs own HostProcess children). M2-HOST-UNITS
      is the systemd-user backend (done, evidence kept); M2-KCP-STORE/SLOTS: the bidder's kcp is one slot on
      one sqlite kine with no postgres and no leader election; M2-VM-TREE-AUDIT is backend-aware.
      Transient SERVICES in the user
      manager of a lingering account over the private socket with deadlines, PropExecStart(argv, false),
      CollectMode=inactive, MemorySwapMax=0, no AllowedCPUs/IOWeight, own slice; systemd 253+ with probed
      features; the invariant that no socialweb code runs in a VM unit, audited from its cgroup. Fifth fold
      2026-10-12: new M2-APP-CONTROLLER - each application ONE root object (MarketBidder, MarketRequester,
      Gateway, MarketNetwork) in its own kcp, rendered by the core's appctl into owned children; a profile
      switch deletes what it omits; option coverage (every hono-bidder and request-vm-ssh option maps to a
      field or profile, removal only for a legacy transport); a MarketNetwork composes child applications,
      each with its OWN kcp (bootstrap layer as HostProcess objects in the network's kcp), copying network
      values onto their root objects as the only cross-app discovery.
    instrument: >
      A stand-in unit survives `systemctl --user restart`, kill -9, stop, daemon-reload and daemon-reexec of
      its starter and is adopted; a failed unit's Result is readable until reset; the tree audit fails a core
      binary in a VM unit; a Postgres object survives its controller's restart; a restarted bao is unsealed
      on the next pass; a second apply of every set changes no resourceVersion; two kcp slots on one kine ->
      postgres store serve the same workspaces and a front flip fails no /readyz poll; the contract suite is
      green on proc and systemd-user; two dev instances each serve their own kcp on port 0; a HostProcess
      reconciles identically on both backends and a deleted bootstrap mirror stops nothing; a bidder kcp
      restart leaves every stand-in VM unit's InvocationID unchanged.
  - id: P6-M3
    title: OPEN - serve gateway kcp on the host with kcp first, each cluster a slice of member units behind a per-cluster apiserver front, blue/green k3s+kine slots, the gateway as a user unit, continuity across upgrades proved.
    body: >
      OPEN as P6-M0. Plan 0006 items M3-FOLD (nodeboot deleted, nodeimage to CI), M3-CLUSTER-UNITS (each
      cluster a systemd slice of member units, no resident supervisor; kine and bao After=/Wants= the
      cluster's postgres unit), M3-APISERVER-FRONT (a per-cluster L4 front on the existing apiserver port;
