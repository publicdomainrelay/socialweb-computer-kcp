# knotless CI: tests/Cargo.toml's atlibs crates, and the knotless runner the compositions run on (knotless-fork-infra
# versions.env's commit), on the atlibs pin set (atlibs pins.json); behind, it names the sync command. 4 vCPU / 8 GB
# (binding kcp-small).
on:
  push:
    refs: [refs/heads/main, refs/heads/knotless-ci, refs/tags/v*]
runners: [aliceoa.bsky.social]
executor: kcp-small
steps:
  - name: atlibs pins
    timeout: 10
    run: |
      command -v curl >/dev/null && command -v git >/dev/null && command -v jq >/dev/null || { apt-get update -qq && apt-get install -y -qq curl git jq >/dev/null; }
      t=$(mktemp -d)
      curl -sSf https://knotless.dev/johnandersen777.bsky.social/atlibs/raw/main/pins.sh > "$t/pins.sh"
      sh "$t/pins.sh" check
      git clone -q --depth 1 https://knotless.dev/johnandersen777.bsky.social/knotless-fork-infra "$t/infra"
      cd "$t/infra" && sh "$t/pins.sh" check
