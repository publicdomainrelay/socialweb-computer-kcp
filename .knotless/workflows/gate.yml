# knotless CI: the gate (AGENTS.md: How to verify): go build, go vet, deploy/check.sh --fast (the release builds
# included), and a clean tree after. 12 vCPU / 16 GB (binding kcp-build: max cores, the RAM a build needs; hat-7 and hat-8 offer it).
on:
  push:
    refs: [refs/heads/main, refs/heads/knotless-ci, refs/tags/v*]
runners: [aliceoa.bsky.social]
executor: kcp-build
steps:
  - name: toolchain
    run: bash scripts/knotless-ci-toolchain.sh --deno
  - name: gate
    timeout: 75
    run: |
      . /opt/ci/env
      go mod download
      go build ./...
      go vet ./...
      deploy/check.sh --fast
      test -z "$(git status --porcelain)"
