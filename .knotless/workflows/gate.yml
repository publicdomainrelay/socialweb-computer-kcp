# knotless CI: the gate (AGENTS.md: How to verify): deploy/check.sh --fast (go build, go vet, the cross-OS and release
# builds included), and a clean tree after. 12 vCPU / 16 GB (binding kcp-build: max cores, the RAM a build needs; hat-7 and hat-8 offer it).
on:
  push:
    refs: [refs/heads/main, refs/heads/knotless-ci, refs/tags/v*]
  asked:
    refs: [refs/heads/main, refs/heads/knotless-ci]
runners: [aliceoa.bsky.social]
executor: kcp-build
steps:
  - name: toolchain
    run: |
      if bash scripts/knotless-ci-baked.sh; then :; else bash scripts/knotless-ci-toolchain.sh --deno; fi
  - name: gate
    timeout: 75
    run: |
      . /opt/ci/env
      # the VM's memory and load each minute (the binding's size, and a step that loses the VM)
      (while sleep 60; do echo "vm: $(free -m | awk '/Mem:/ {print $3 "/" $2 " MiB used, " $7 " available"}'), load $(cut -d' ' -f1-3 /proc/loadavg)"; done) &
      trap "kill $! 2>/dev/null" EXIT
      go mod download
      # the release workflow builds the release binaries (stricter: embed_deno, the assets), in parallel with this gate
      # a push to main builds linux/arm64 (internal/assets has arch-specific files, and it is a shipped target) and one target
      # of each other OS; a v* tag, and a local check.sh, run the full cross-OS matrix
      case "$KNOTLESS_RUN_REF" in
        refs/tags/v*) ;;
        *) export CHECK_CROSS_TARGETS="linux/arm64 darwin/arm64 windows/amd64" ;;
      esac
      CHECK_SKIP_RELEASE_BUILDS=1 deploy/check.sh --fast
      test -z "$(git status --porcelain)"
