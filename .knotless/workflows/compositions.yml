# knotless CI: the dev-network-only entries of the acceptance suite (0007:restart, 0014:*, 0015:pressure, 0016:*) against the
# multi-VM staging layout (R2 on the kcp-test VM rents four small VMs: atproto 2/4, gateway 4/8, two 4/8 nested-virt bidders
# on one meshd overlay), and the suite runs from the atproto VM (tests/compositions/staging/suite.sh). 0014:run needs three
# network bidders and SKIPs on two. Same stand-up and test host as `test.yml` (kept in step with it); on a push to main that changes code (paths) and, until the binary
# reaches the staging VMs reliably, on a branch only when asked, after `gate`, `testhost` and `binary`. The requester under test is this commit's build (step `binary`,
# as test.yml: the `binary` workflow's, pulled from ttl.sh by digest).
on:
  push:
    refs: [refs/heads/main]
    paths: [internal/**, cmd/**, api/**, tests/**, deploy/**, scripts/**, go.mod, go.sum, .knotless/workflows/compositions.yml]
  asked:
    refs: [refs/heads/*]
runners: [aliceoa.bsky.social]
after: [gate, testhost, binary]
executor: kcp-test
artifacts: [runs]
# a failed run freezes (--on-fail freeze): `knotless run attach` gives the owner's or a collaborator's key this, as
# root on the CI VM, only while the run goes (AGENTS.md: Debug a failed CI run)
attach: runuser -u r2 -- /usr/local/bin/swc-test-host attach /work/runs
# after the steps, whatever they came to (a cancel or a timeout cuts the staging step short): swc-test-host aborts and
# releases what R2 rented before the runner gives the CI VM back
stop: pkill -TERM -f "[s]wc-test-host compositions/" || exit 0; while pgrep -f "[s]wc-test-host compositions/" >/dev/null; do sleep 5; done
env:
  SWC_RUNS: /work/runs
steps:
  - name: swc-test-host
    timeout: 30
    run: |
      # the static swc-test-host and module wasm of this tests/ tree, built on hat-8 and in the bucket (tests/publish-test-host.sh)
      command -v curl >/dev/null && command -v jq >/dev/null || { apt-get update -qq && apt-get install -y -qq curl jq >/dev/null; }
      u=https://socialweb-computer-kcp.sfo3.digitaloceanspaces.com/tests/$(git rev-parse HEAD:tests)
      d=$(mktemp -d)
      # this commit's testhost run kept what the bucket lacks (a branch that changed tests/ or rust/) as dist/ artifacts
      art() { [ -n "${KNOTLESS_ARTIFACTS_URL:-}" ] && curl -sfo "$2" -H "Authorization: Bearer $KNOTLESS_ARTIFACTS_TOKEN" "$KNOTLESS_ARTIFACTS_URL?workflow=testhost&name=dist/$1"; }
      got=
      if art tests.SHA256SUMS "$d/SHA256SUMS" && art swc-test-host "$d/swc-test-host" && art test-modules.tar.gz "$d/test-modules.tar.gz" && (cd "$d" && sha256sum -c --quiet SHA256SUMS); then
        got=artifacts; echo "tests: testhost artifacts of this commit"
      else
        rm -f "$d/swc-test-host" "$d/test-modules.tar.gz"
        if curl -sfo "$d/SHA256SUMS" "$u/SHA256SUMS"; then
          got=bucket; echo "tests: $u"
          for f in swc-test-host test-modules.tar.gz; do curl -sfo "$d/$f" "$u/$f"; done
        fi
      fi
      if [ -n "$got" ]; then
        (cd "$d" && sha256sum -c --quiet SHA256SUMS)
        tar -C tests -xzf "$d/test-modules.tar.gz"
        install -D -m 0755 "$d/swc-test-host" tests/target/release/swc-test-host
      else
        # FALLBACK: no published build of this tests/ tree (`testhost` publishes it on a push to main; a branch builds here)
        echo "fallback: building test host ($u: none)"
        bash scripts/knotless-ci-toolchain.sh --wasm
        . /opt/ci/env
        (cd tests/modules && cargo wasm)
        (cd tests && cargo build --release -p swc-test-host)
      fi
      install -m 0755 tests/target/release/swc-test-host /usr/local/bin/swc-test-host
      # the static socialweb-meshd the multi-VM layout puts on each VM (SWC_MESHD), of this rust/ tree
      m=https://socialweb-computer-kcp.sfo3.digitaloceanspaces.com/meshd/$(git rev-parse HEAD:rust)
      if art meshd.SHA256SUMS "$d/meshd.SHA256SUMS" && art socialweb-meshd-x86_64 "$d/socialweb-meshd-x86_64" && (cd "$d" && sha256sum -c --quiet meshd.SHA256SUMS); then
        echo "meshd: testhost artifacts of this commit"
        (cd "$d" && sha256sum -c --quiet meshd.SHA256SUMS)
      elif curl -sfo "$d/meshd.SHA256SUMS" "$m/SHA256SUMS" && curl -sfo "$d/socialweb-meshd-x86_64" "$m/socialweb-meshd-x86_64"; then
        echo "meshd: $m"
        (cd "$d" && sha256sum -c --quiet meshd.SHA256SUMS)
      else
        echo "fallback: building meshd ($m: none)"
        [ -e /opt/ci/env ] || bash scripts/knotless-ci-toolchain.sh
        . /opt/ci/env
        MESHD_DIST="$d" bash rust/build.sh x86_64
      fi
      install -m 0755 "$d/socialweb-meshd-x86_64" /usr/local/bin/socialweb-meshd
  - name: binary
    timeout: 30
    run: |
      # the socialweb-computer under test and how the staging VMs get it (scripts/ci-staging-binary.sh): the published binary of this
      # commit, or of the branch's fork point when nothing a binary is built from changed, DOWNLOADED by every VM; else this commit's
      # build, put by the test host
      set -eu
      bash scripts/ci-staging-binary.sh
  - name: staging
    timeout: 120
    run: |
      # as the guest requester R2 (the runner associated it with the pusher's session; kcp refuses root): no creds here
      id r2
      install -d -o r2 /work/runs
      # the market's relays and Jetstreams over the run, for https://watch.socialweb.computer/ (runs/watch.ndjson)
      command -v git >/dev/null && dpkg -s libatomic1 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git libatomic1 >/dev/null; }
      git clone -q https://knotless.dev/johnandersen777.bsky.social/socialweb-computer-watch /opt/swc-watch
      git -C /opt/swc-watch checkout -q 83541a1bd622a8679d90226fa72cab2af87dcde3
      sh /opt/swc-watch/scripts/ci-capture.sh /work/runs/watch.ndjson 7200
      # the binary under test: this commit's build (step binary), put on each staging VM by the host
      spec="$(cat /home/r2/requester.spec)"
      echo "requester $spec"
      jq --arg b "$spec" '.requester = $b | .accounts.r2 = {handle: "", did: "", guestRequester: true}' tests/targets/prod.json > /home/r2/target-ci.json
      chown r2 /home/r2/target-ci.json
      # r2's user manager (the requester's units): its runtime dir, else mkdir /run/user/0/swc is refused
      loginctl enable-linger r2
      for i in $(seq 60); do [ -d "/run/user/$(id -u r2)" ] && break; sleep 1; done
      rc=0
      # a failed run holds its VMs (a freeze) for 30 min on main, 5 min elsewhere: the dump and artifacts carry a branch run's evidence, and a frozen
      # staging holds ~4 VMs of the 36-vCPU market
      if [ "$KNOTLESS_RUN_REF" = refs/heads/main ]; then freeze_ttl=1800; else freeze_ttl=300; fi
      # the multi-VM layout, then the dev-network-only suite from its atproto VM
      (cd tests && runuser -u r2 -- env HOME=/home/r2 XDG_RUNTIME_DIR="/run/user/$(id -u r2)" SWC_TARGET=/home/r2/target-ci.json \
        SWC_RUNS=/work/runs SWC_REPO="$(cd .. && pwd)" SWC_MESHD=/usr/local/bin/socialweb-meshd SWC_BINARY=/home/r2/swc-under-test \
        SWC_TEST_HOST_STATIC=/usr/local/bin/swc-test-host CI=1 target/release/swc-test-host \
        compositions/staging --account r2 --on-fail freeze --freeze-ttl "$freeze_ttl" --input '{"layout": "multi", "provision": "infra", "deadlineMin": 200, "suite": ["0007:restart", "0014:run", "0014:concurrent", "0014:exhausted", "0014:backtoback", "0015:pressure", "0016:run", "0016:badsha"]}') || rc=$?
      kill "$(cat /work/runs/watch.ndjson.pid)" 2>/dev/null || echo "watch: the capture was not running at the end"
      echo "watch: $(wc -l < /work/runs/watch.ndjson) lines in runs/watch.ndjson"
      exit $rc
