# knotless CI: the staging composition (tests/compositions/staging) on the published build of this commit
# (testkit's `sha:<commit>`, checked against the bucket's SHA256SUMS). On a 4 vCPU / 8 GB VM (binding kcp-test). The
# run's dump is an artifact (runs/), kept on failure.
# TEMPORARY (owner, 2026-11-13): published binaries, not build.yml's artifacts, until the staging run is green in CI;
# then `after: [build]` and its artifacts again (build.yml).
# A run rents a 4 vCPU / 8 GB nested-virt staging VM (only the temp bidder offers one): pushes to knotless-ci only,
# and when asked at main (`knotless run rerun knotless://<owner>/socialweb-computer-kcp --ref refs/heads/main --workflow test`).
on:
  push:
    refs: [refs/heads/knotless-ci]
  asked:
    refs: [refs/heads/main, refs/heads/knotless-ci]
runners: [aliceoa.bsky.social]
executor: kcp-test
artifacts: [runs]
# a failed run freezes (--on-fail freeze): `knotless run attach` gives the owner's or a collaborator's key this, as
# root on the CI VM, only while the run goes (AGENTS.md: Debug a failed CI run)
attach: runuser -u r2 -- /usr/local/bin/swc-test-host attach /work/runs
env:
  SWC_RUNS: /work/runs
steps:
  - name: swc-test-host
    timeout: 60
    run: |
      # the static swc-test-host and module wasm of this tests/ tree, built on hat-8 and in the bucket (tests/publish-test-host.sh)
      command -v curl >/dev/null && command -v jq >/dev/null || { apt-get update -qq && apt-get install -y -qq curl jq >/dev/null; }
      u=https://socialweb-computer-kcp.sfo3.digitaloceanspaces.com/tests/$(git rev-parse HEAD:tests)
      d=$(mktemp -d)
      if curl -sfo "$d/SHA256SUMS" "$u/SHA256SUMS"; then
        echo "tests: $u"
        for f in swc-test-host test-modules.tar.gz; do curl -sfo "$d/$f" "$u/$f"; done
        (cd "$d" && sha256sum -c --quiet SHA256SUMS)
        tar -C tests -xzf "$d/test-modules.tar.gz"
        install -D -m 0755 "$d/swc-test-host" tests/target/release/swc-test-host
      else
        # FALLBACK: no published build of this tests/ tree (run tests/publish-test-host.sh before pushing)
        echo "fallback: building test host ($u: none)"
        bash scripts/knotless-ci-toolchain.sh --wasm
        . /opt/ci/env
        (cd tests/modules && cargo wasm)
        (cd tests && cargo build --release -p swc-test-host)
      fi
      install -m 0755 tests/target/release/swc-test-host /usr/local/bin/swc-test-host
  - name: staging
    timeout: 110
    run: |
      # TEMPORARY: the stand-up only (suite: false) until the guests' kernel has CONFIG_NFT_BRIDGE_REJECT
      # as the guest requester R2 (the runner associated it with the pusher's session; kcp refuses root): no creds here
      id r2
      install -d -o r2 /work/runs
      # the market's relays and Jetstreams over the run, for https://watch.socialweb.computer/ (runs/watch.ndjson)
      command -v git >/dev/null && dpkg -s libatomic1 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git libatomic1 >/dev/null; }
      git clone -q https://knotless.dev/johnandersen777.bsky.social/socialweb-computer-watch /opt/swc-watch
      git -C /opt/swc-watch checkout -q 7a56d9021997a7306fb1fc7b88ebde06e934a059
      sh /opt/swc-watch/scripts/ci-capture.sh /work/runs/watch.ndjson 7200
      # TEMPORARY (until build.yml is back): the newest published main build at or below this commit
      bucket=https://socialweb-computer-kcp.sfo3.digitaloceanspaces.com
      for c in $(git rev-list --max-count 30 HEAD); do curl -sfo /dev/null "$bucket/main/$c/binaries/SHA256SUMS" && break; c=; done
      test -n "$c" && echo "requester sha:$c"
      jq --arg b "sha:$c" '.requester = $b | .accounts.r2 = {handle: "", did: "", guestRequester: true}' tests/targets/prod.json > /home/r2/target-ci.json
      chown r2 /home/r2/target-ci.json
      rc=0
      (cd tests && runuser -u r2 -- env HOME=/home/r2 SWC_TARGET=/home/r2/target-ci.json SWC_RUNS=/work/runs SWC_REPO="$(cd .. && pwd)" CI=1 \
        target/release/swc-test-host compositions/staging --account r2 --on-fail freeze --freeze-ttl 3600 --input '{"suite": false}') || rc=$?
      kill "$(cat /work/runs/watch.ndjson.pid)" 2>/dev/null || echo "watch: the capture was not running at the end"
      echo "watch: $(wc -l < /work/runs/watch.ndjson) lines in runs/watch.ndjson"
      exit $rc
