# knotless CI: the release binary of this commit (linux/amd64), swc-test-host and the test modules, as artifacts
# for test.yml (after: [build]). On a 16 vCPU / 32 GB VM (binding kcp-build).
# TEMPORARY (owner, 2026-11-13): off until the staging run is green in CI; test.yml downloads published binaries
# meanwhile. Then: these triggers back on, test.yml `after: [build]` on build's artifacts again.
on: {}
runners: [aliceoa.bsky.social]
executor: kcp-build
artifacts: [dist]
steps:
  - name: toolchain
    run: bash scripts/knotless-ci-toolchain.sh --wasm
  - name: binaries
    timeout: 110
    run: |
      . /opt/ci/env
      bash scripts/build-socialweb-computer.sh --platform linux/amd64 --commit "$KNOTLESS_RUN_SHA" --build-root /root/swc-build
      rm -rf dist && mkdir -p dist/release
      cp -a "/root/swc-build/release/$KNOTLESS_RUN_SHA"/. dist/release/
      (cd dist/release && sha256sum -c --quiet SHA256SUMS)
  - name: swc-test-host
    timeout: 60
    run: |
      . /opt/ci/env
      (cd tests/modules && cargo wasm)
      (cd tests && cargo build --release -p swc-test-host)
      mkdir -p dist/bin dist/wasm
      cp tests/target/release/swc-test-host dist/bin/
      cp tests/modules/target/wasm32-unknown-unknown/release/*.wasm dist/wasm/
      (cd dist && find . -type f ! -name SHA256SUMS | sort | xargs sha256sum > SHA256SUMS && cat SHA256SUMS)
