# knotless CI: the release binaries (linux/amd64, linux/arm64), the node downloads by sha256 and the pinned guest
# image, built and staged in the bucket in parallel with the gate: downloads/<sha256>/ and guest-images/<target>/<pin>/
# (content-addressed, so nothing a failed gate can poison) and staging/<sha>/ (the binaries and their manifest). The
# `publish` workflow, after gate and release at this commit, copies staging/<sha>/ to main/<sha>/ and main/latest/ (a tag:
# releases/<tag>/) and checks what it published. The bucket key is a sealed secret given only to pushes to main and v*
# tags (`knotless secret set ... --ref`): elsewhere (knotless-ci, a pull) the staging steps are skipped. A newer push to the ref
# cancels an older commit's release. 12 vCPU / 16 GB (binding kcp-build: max cores, the RAM a build needs; hat-7 and hat-8
# offer it).
on:
  push:
    refs: [refs/heads/main, refs/heads/knotless-ci, refs/tags/v*]
  asked:
    refs: [refs/heads/main, refs/heads/knotless-ci]
runners: [aliceoa.bsky.social]
executor: kcp-build
secrets: [SPACES_ACCESS_KEY_ID, SPACES_SECRET_ACCESS_KEY]
env:
  SPACES_BUCKET: socialweb-computer-kcp
  SPACES_REGION: sfo3
  TARGET: firecracker-x86_64
  OUT: /root/ci-out
steps:
  - name: toolchain
    run: |
      if bash scripts/knotless-ci-baked.sh; then :; else bash scripts/knotless-ci-toolchain.sh --deno --arm64; fi
  - name: binaries
    timeout: 110
    run: |
      . /opt/ci/env
      (while sleep 60; do echo "vm: $(free -m | awk '/Mem:/ {print $3 "/" $2 " MiB used, " $7 " available"}'), load $(cut -d' ' -f1-3 /proc/loadavg)"; done) &
      trap "kill $! 2>/dev/null" EXIT
      root=/root/release-build
      mkdir -p "$root"
      case "$KNOTLESS_RUN_REF" in refs/tags/v*) ;; *) export ASSET_CACHE_URL=https://$SPACES_BUCKET.$SPACES_REGION.digitaloceanspaces.com/asset-cache ;; esac
      bash scripts/build-socialweb-computer.sh --platform linux/amd64 --platform linux/arm64 --commit "$KNOTLESS_RUN_SHA" --build-root "$root"
      rel="$root/release/$KNOTLESS_RUN_SHA"
      ls -la "$rel"
      want="$(jq -r '.assets.deno.version' internal/versions/versions.json)"
      jq -e --arg v "$want" '(.builds | length) > 0 and all(.builds[]; .denoEmbedded.version == $v and (.denoEmbedded.zips | keys | sort) == ["linux/amd64","linux/arm64"])' "$rel/release.json"
      rm -rf "$OUT/binaries" && mkdir -p "$OUT/binaries" && cp -a "$rel"/. "$OUT/binaries/"
      (cd "$OUT/binaries" && sha256sum -c --quiet SHA256SUMS)
      tree="$(mktemp -d)"
      zstd -dc "$root/src/1/internal/assets/blobs/linux_amd64/socialweb-computer-k8s-downloads.tar.zst" | tar -x -C "$tree"
      rm -rf /root/ci-downloads && mkdir -p /root/ci-downloads
      for side in "$tree"/*.sha256; do
        name="$(basename "$side" .sha256)"
        want="$(cut -d' ' -f1 "$side")"
        got="$(sha256sum "$tree/$name" | cut -d' ' -f1)"
        echo "downloads/$want/$name (sha256 $got)"
        test "$got" = "$want"
        mkdir -p "/root/ci-downloads/$want" && cp "$tree/$name" "/root/ci-downloads/$want/$name"
      done
      test "$(find /root/ci-downloads -type f | wc -l)" -gt 0
  - name: guest image
    timeout: 120
    run: |
      . /opt/ci/env
      pin="$(jq -er --arg t "$TARGET" '.guestImages.targets[$t].outputs["image.json"].sha256' internal/versions/versions.json)"
      url="https://$SPACES_BUCKET.$SPACES_REGION.digitaloceanspaces.com/guest-images/$TARGET/$pin"
      img=/root/ci-guest-image && rm -rf "$img" "$img.published"
      published=true
      # never downloads the image: the publish stores each object's sha256 (x-amz-meta-sha256) beside its bytes
      for f in image.json vmlinux rootfs.ext4; do
        want="$(jq -er --arg t "$TARGET" --arg f "$f" '.guestImages.targets[$t].outputs[$f].sha256' internal/versions/versions.json)"
        bytes="$(jq -er --arg t "$TARGET" --arg f "$f" '.guestImages.targets[$t].outputs[$f].bytes' internal/versions/versions.json)"
        head="$(curl -sSfI --retry 3 --max-time 60 "$url/$f" | tr -d '\r')" || head=
        got="$(printf '%s\n' "$head" | awk 'tolower($1)=="x-amz-meta-sha256:" {print $2}')"
        size="$(printf '%s\n' "$head" | awk 'tolower($1)=="content-length:" {print $2}')"
        echo "$TARGET/$f sha256 ${got:-absent} ${size:-?} bytes (pinned $want, $bytes bytes) at $url/$f"
        [ "$got" = "$want" ] && [ "$size" = "$bytes" ] || published=false
      done
      if [ "$published" = true ]; then
        echo "guest-image: not building $TARGET: every output is published at $url and matches its pin"
        touch "$img.published"
        exit 0
      fi
      echo "guest-image: building $TARGET"
      mkdir -p "$img" /root/guest-image-work
      scripts/build-guest-image.sh --target "$TARGET" --work /root/guest-image-work --out "$img"
      for f in vmlinux rootfs.ext4 image.json; do
        want="$(jq -er --arg t "$TARGET" --arg f "$f" '.guestImages.targets[$t].outputs[$f].sha256' internal/versions/versions.json)"
        got="$(sha256sum "$img/$TARGET/$f" | cut -d' ' -f1)"
        echo "$TARGET/$f sha256 $got (pinned $want)"
        test "$got" = "$want"
      done
  - name: asset cache
    on: {refs: [refs/heads/main, refs/tags/v*]}
    timeout: 30
    run: |
      . /opt/ci/env
      scripts/asset-cache-upload.sh /root/release-build/cache/blobs
  - name: stage
    on: {refs: [refs/heads/main, refs/tags/v*]}
    timeout: 90
    run: |
      . /opt/ci/env
      test -n "$SPACES_ACCESS_KEY_ID" && test -n "$SPACES_SECRET_ACCESS_KEY"
      if [ ! -e /root/ci-guest-image.published ]; then
        pin="$(jq -er --arg t "$TARGET" '.guestImages.targets[$t].outputs["image.json"].sha256' internal/versions/versions.json)"
        deno run -A --no-lock scripts/publish-spaces.ts --dir "/root/ci-guest-image/$TARGET" --prefix "guest-images/$TARGET/$pin" --content-addressed
      fi
      deno run -A --no-lock scripts/publish-spaces.ts --dir /root/ci-downloads --prefix downloads --content-addressed
      deno run -A --no-lock scripts/publish-spaces.ts --dir "$OUT" --prefix "staging/$KNOTLESS_RUN_SHA"
